[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorflow"
version = "0.1.0"
description = "FactorFlow: classify a self-defined stock universe and trade it automatically under owner-controlled strategies, proven in paper before capital is at risk."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3",
    "psycopg-pool>=3",
    "pydantic-settings>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "massive>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "hypothesis",
    "testcontainers[postgres]",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factorflow = ["coverage/sql/*.sql", "db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: marks tests that require a running PostgreSQL container (testcontainers)",
    "slow: marks tests that take significant time (e.g. 3000-instrument volume runs)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# design-system/ carries the vendored design-system tooling this repository's
# Python package does not own; it predates this project's pyproject.toml and
# is out of scope for factorflow's own lint rules. docs/ carries approved,
# reviewed specification and design content, including Python code fences
# inside markdown; ruff's markdown support would reformat those fences as
# real source, which this project's constitution forbids editing outside the
# specification-review process.
extend-exclude = ["design-system", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

# The official `massive` SDK (docs/constitution/tech-stack.md) ships no
# type stubs or py.typed marker. `factorflow.ingestion.massive.client` is
# the one module that imports it directly; every value this component
# reads off it is validated through this component's own Pydantic models
# before crossing back out (component design section 2.4), so the
# suppressed stub gap does not propagate untyped values past this seam.
[[tool.mypy.overrides]]
module = ["massive", "massive.*"]
ignore_missing_imports = true
