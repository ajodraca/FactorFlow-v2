# TDD evidence for CAP-003-E6-S2 - Download Now and the Stop Following Dialog.
# Base: usr/alvaro-de-jodra/CAP-003-integration-20261128T021153Z (c276899f).
# Cycles per the plan's T014: (1) Download now, (2) Stop following dialog, (3) vocabulary and badge scans (tests only).
# Each cycle is committed as it ends with this file's entry beside its code, so commit_hash is stage.
# Mutation: scripts/mutation-run.py with 'ln -sfn <node_modules> node_modules && npx vitest run web/src/screens/data-health/<file>'
# as the command; generated mutants plus the plan's hand-written ones (operator manual).
# Reviews: an independent code-review subagent and an independent spec-drift subagent judged each cycle's patch.

cycles:
  - id: cycle-1
    tasks: [T002, T003, T006, T009, T010, T014]
    description: >
      Download now. web/src/screens/data-health/download-now.test.tsx (new): TC-COMP-161 (T002 a-f), its 202 edge cases
      and routine-action rules (T003 a-g) and the Download now copy cases (T006 a-c). Then copy.ts (DOWNLOAD_NOW,
      QUEUED_NOTICE, START_REFUSALS, startFailed) and download-now.tsx (DownloadNow).
    deviations: >
      (1) The OTHER_409 fixture's message is "a refusal nobody has met", not the plan's "x": "x" is a substring of the
      rendered "unexpected", so the envelope-text assertion could never hold. (2) The refusal and failure sentences are
      <output> elements (implicit role status), not <p role="status">: biome's useSemanticElements rejects the latter.
      (3) The initial-state aria-busy assertion was added to T003 (e) after the first mutation scoring left the
      busy useState(true) mutant alive (18 of 19); that scoring is superseded. (4) A first draft guarded Try again with
      the pending ref; the spec-drift review read that as beyond T010, so it was removed and the patch re-reviewed.
