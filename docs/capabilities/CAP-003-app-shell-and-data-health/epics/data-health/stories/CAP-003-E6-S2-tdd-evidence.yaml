  - id: cycle-2
    tasks: [T004, T005, T006, T009, T011, T014]
    description: >
      The stop-following dialog. stop-following-dialog.test.tsx (new): the dialog's own contract (T004 a-e), TC-COMP-162
      with its 200 edge case and the focus rules (T005 a-k, plus l-o added after mutation scoring) and the stop copy
      cases (T006 d-f). Then copy.ts (STOP_FOLLOWING, the title, description, failure and stopped strings,
      STOP_REFUSAL_REASONS, isStaleRowRefusal, stopFailureReason) and stop-following-dialog.tsx (StopFollowingDialog).
    deviations: >
      (1) The fallback-focus effect also runs a retry on setTimeout(0), and focus inside the closing [role=dialog] is
      not read as the owner's own focus: with only the plan's per-render effect, T005 (g) cleared its watch while
      focus was still on the closing dialog's Cancel, and T005 (h) never re-rendered after the dialog left, so the
      heading was never focused. (2) The refusal and failure sentences are output elements (implicit role status) for the
      same reason as cycle 1. (3) Tests l to o and the fresh-node assertion in (j) were added after the first scoring left
      nine mutants alive (24 of 33); the second scoring is the final one. (4) The OTHER_409 fixture message is the
      same one as in cycle 1.
