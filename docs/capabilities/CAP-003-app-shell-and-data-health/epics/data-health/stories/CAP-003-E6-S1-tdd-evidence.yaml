      (T002 a-g, plus a single-absent/single-gap row and an ok-with-no-session row) and the Daily prices half of the
      null state (T004). Then copy.ts (card strings, GAP_REASONS, gapReason, andMore), check-card.tsx (CheckCard) and
      daily-prices-card.tsx (DailyPricesCard).
    deviations: >
      (1) The shared test harness is smaller than the plan's list for this cycle: only the Daily prices fixtures
      exist; DH/ATT/ok/INTERNAL arrive with the cycles that use them. (2) A check with status ok and no stored session
      renders the absent dash alone as its result, and the behind part is omitted when there is no session; the plan
      does not state these two unreachable-on-real-data cases and both reviewers read them as faithful to T014.
