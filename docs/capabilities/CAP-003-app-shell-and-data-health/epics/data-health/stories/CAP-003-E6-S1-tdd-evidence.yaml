  - id: cycle-3
    tasks: [T005, T016, T012, T013]
    description: >
      Factor scores card. check-cards.test.tsx gains the TC-COMP-150 rows (T005 a-i, plus the one-stock-short and
      unreachable-failure rows); then copy.ts (scores strings, readFailed, READ_TARGETS, readFailureReason, TRY_AGAIN),
      check-card.tsx (ReadFailure, SkeletonLine) and scores-card.tsx.
    deviations: >
      (1) ReadFailure renders the sentence in an output element (implicit role status), not p role=status: biome's
      useSemanticElements rejects the latter and the delivered StateRegion uses output; the tests find it by the
      status role as the plan's (i) does. (2) readFailureReason takes Error, not ApiError | ApiUnreachableError: it
      only tests instanceof ApiUnreachableError, and ApiError would be an unused import. Both are plan-text follow-ups
      (the plan is not this skill's to edit without a decision); both reviewers judged them faithful. (3) The
      unreachable-failure sentence is asserted through the scores card here; the plan's T011 copy unit cases arrive
      with the verdict cycle. (4) The first mutation scoring (13/15) left the null-stocks_current guard and the k > 0
      boundary alive; rows were added and the final run is 15/15.
