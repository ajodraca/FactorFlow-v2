# Reviews: an independent code-review subagent and an independent spec-drift subagent judged each cycle's patch.
# Two earlier scorings of cycle 1 (13/15 with two survivors at a count of exactly 1, then 15/15) were superseded after
# the code review's rework of the null-session handling; only the final run is kept.

