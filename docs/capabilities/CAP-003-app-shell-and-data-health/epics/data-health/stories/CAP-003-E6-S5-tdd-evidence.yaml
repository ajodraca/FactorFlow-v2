# The plan's six cycles (T017) are run as two: the screen with its strings and tests (T002-T008, T010-T013), then the scan widening (T009, T014).
# Mutation: scripts/mutation-run.py with 'ln -sfn <node_modules> node_modules && npx vitest run web/src/screens/data-health/data-health.test.tsx'; catalogue mutants plus the plan's hand-written ones (operator manual).
# Reviews: an independent code-review subagent and an independent spec-drift subagent judged each cycle's patch.

cycles:
  - id: cycle-1
    tasks: [T002, T003, T004, T005, T006, T007, T008, T010, T011, T012, T013]
    description: >
      The copy cases, the empty card, the refresh rule, the eight states, layout, vocabulary and badges of
      data-health.test.tsx, then the empty-card strings of copy.ts and index.tsx (DataHealthScreen: the slot adapter,
      the empty card, the check grid and the region conditions).
    deviations: >
      (1) The plan's six cycles run as two (this one and the scan). (2) T003 (a) asserts that the lower regions are
      absent and no longer read once the empty state settles, not that they are never read, because they mount while
      attention loads (DEC-0405). (3) Interactions click through fireEvent inside act: user-event waits on a real timer
      under vitest fake timers and hangs. (4) T004 (c) steps the clock in two advances so React renders the running
      answer before the terminal one. (5) T008 (a) reads a badge's visible text for its name, since a span has no
      accessible name from content. (6) T005 (h) is enforced by tsc; the test only renders. (7) The never-wired slot
      retry (the error kind is a notApplicable renderer, so StateRegion's retry is unreachable) has no mutant.
