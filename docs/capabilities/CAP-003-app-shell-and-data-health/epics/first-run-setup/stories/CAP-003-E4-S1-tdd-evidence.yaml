  - id: cycle-2
    tasks: [T003, T004, T005, T009]
    description: >
      The step state (TC-COMP-098, TC-COMP-106, DAC-E4-1, DAC-E4-S1-2, DAC-E4-13, AC-2, AC-21, DEC-0342, DEC-0343, DEC-0344): use-setup-state.ts holds StepId, SetupState and useSetupState, which reads GET /api/settings/history-depth and GET /api/instruments?lifecycle=active&limit=1 once on mount into two ReadStates, takes health and attention from useShell(), derives each done flag from its fact, the current step as the first not done (4 when all are), step4 blocked only on a known count of 0, and keeps the goTo override in the hook so a new visit re-derives. use-setup-state.test.ts holds the cumulative four-step walk, the eight download states, the null depth, first-not-done, step 1 after an outage, Add later, re-derivation on a new visit, done steps revisited, the failed-read cases, the exact queries, no interval, loading, Try again, a re-read that keeps its value, a failed count, a failed attention poll and the member shape. The generator produced 27 mutants and 16 were hand-written from the plan's kill list; the first run left three survivors, one of them the count boundary (a single followed stock), so a case for one stock was added and the run repeated: 43 mutants, 41 killed. The two survivors are judged equivalent: useRef(true) to false is overwritten by the mount effect, which runs before any read can settle; and the cleanup's mounted.current = false to true only lets a late answer call setState on an unmounted component, which React 18 ignores without a warning, so nothing observable differs. Both reviews approved. The code review raised one MEDIUM, that overlapping re-reads have no sequence guard and could resolve out of order; the task plan's Other Notes records this as accepted for this story (no overlap guard on re-reads, a re-read being user-triggered or following a save), so it is a follow-up for the story that needs one, not rework. The rest were LOW: the rethrow of a non-API error is unpinned by a test, and the mounted guard is untested beyond the equivalent mutants.
