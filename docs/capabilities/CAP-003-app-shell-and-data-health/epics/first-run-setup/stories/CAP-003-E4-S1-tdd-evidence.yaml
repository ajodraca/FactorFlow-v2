    red_log_sha256: 31e65451d3048793b57bfb9a01fe59731fbb4412e42810483744299d6a4a5bf8
    red_evidence: >
      use-setup-state.test.ts failed to load (./use-setup-state did not resolve) before the module existed.
    green_evidence: >
      use-setup-state.test.ts 26 passed in the first run (green-cycle-2-step-state.log) and 27 with the single-stock case added after the first mutation run; the setup suites 32 passed; tsc --noEmit, biome lint and biome format clean.
