  - id: cycle-4
    tasks: [T005, T006, T012, T017]
    description: >
      Step 2, the history depth (TC-COMP-108, TC-COMP-111, AC-3, AC-17, DAC-E4-4, DAC-E4-13, DAC-E4-S2-1, DAC-E4-S2-4, DEC-0346, DEC-0347): step-history-depth.tsx holds StepHistoryDepth, a form with a numeric field and the years suffix, checked on blur and on Continue by a schema (a whole number from 1 to 50, spaces ignored, bounds mirroring the server's) and sent only when valid, as a number, through setHistoryDepth; a success re-reads the depth and moves to step 3; a refused value (the 422 code) and any other failure are field errors (the range sentence, and Couldn't save history depth with a reason that never echoes the server's message) with the value kept; a failure that is not an answer from the server is rethrown; the typed text is kept as a draft; a failed depth read shows Couldn't read history depth with Try again in this step only; the plan limit is the card's note. step-history-depth.test.tsx holds TC-COMP-108's composed save through the real step state, the 422 edge, TC-COMP-111's scan (with planted terms) over every state of the list, the card and steps 1 and 2, and the field, initial value, draft, blur and Continue validation, bounds, save, failure, read-failure and Back cases. The form's submit event stands in for Enter in the number field, since user-event's implicit submission lists text-like input types only. The generator produced 15 mutants and 14 were hand-written from the plan's kill list. The first run left three survivors: the trim of the typed text and the rethrow of a failure that is not an API answer, each prescribed by the plan and unpinned, and the generator's removal of the same trim; a rethrow case (through a surfaced-rejection helper) and a restored-draft-with-spaces case were added and the run repeated: 29 mutants, all killed. Both reviews approved; the code review raised one MEDIUM (nothing guards a second submit while the save is in flight, which the plan's Other Notes records as accepted: the same PUT is idempotent) and LOW observations (the initial value is read once, so a depth that arrives after a failed read leaves the field empty).
