# TDD evidence for CAP-003-E4-S2 - Setup Steps 1 and 2: the Step List, the Step Card, Market Data Key Presence and History Depth.
# Each cycle is committed as it ends on the story branch; commit_hash: stage names the commit that added the cycle's entry.
# Reviews: one independent code-review subagent and one independent spec-drift subagent judged each cycle's patch.

cycles:
  - id: cycle-1
    tasks: [T008, T009, T013, T014]
    description: >
      The copy strings and the step card (DAC-E4-13, AC-25, DEC-0345, DEC-0346, DEC-0350): copy.ts gains READ_ERRORS.notAnswering, READ_ERRORS.unexpected and STEP2.saveFailed; step-card.tsx holds STEP_HEADING_ID, StepCard (section labelled by its h2, position line, explanation at the layout measure, note, Back and Next/Continue footer), useStepHeadingFocus (moves focus only on a change of step, never on first render), failureReason (fixed reasons, never the error's message or request id) and StepReadError. step-card.test.tsx holds cases (a) to (g) and copy.test.ts the three new rows. The generator produced 16 mutants and 5 were hand-written; the first run left 9 survivors, two of them real gaps (a Next hint or Continue rendered past the last step, and a Next hint without a handler), so cases for step 4 with a handler and a middle step without one were added and the run repeated: 21 mutants, 15 killed. The six survivors are judged equivalent: five rewrite a literal inside a type-only cast (as 1 | 2 | 3), which is erased before the code runs, and one rewrites a number inside a comment. Both reviews approved and the spec-drift review found no drift. The code review raised one MEDIUM, that StepReadError's message carries no live region so a failed retry is not announced; the plan fixes the markup and the delivered read errors elsewhere are static, so it is a follow-up for the design, not rework. The rest were LOW.
