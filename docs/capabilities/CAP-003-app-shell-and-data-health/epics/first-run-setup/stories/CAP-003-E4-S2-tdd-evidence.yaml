    description: >
      Step 1, the market data key (TC-COMP-099, TC-COMP-109, TC-COMP-112, AC-4, DAC-E4-3, DAC-E4-S2-2, DAC-E4-S2-5, DEC-0203, DEC-0349): step-market-data.tsx holds StepMarketData, which reads one answer (the health answer only while liveness is answering, so a stale answer kept after a failed poll is never shown) and renders the key line as a StatusBadge Found or Missing from labelOf and tierOf, or NotDeterminable with its reason whenever health is not answering; a missing key adds the variable line, with the name in code type, and the restart line; Continue always moves to step 2 and is never blocked, and nothing of the answer but the boolean reaches the page. step-market-data.test.tsx holds the three renderings, the always-available Continue, the planted-value checks over innerHTML and over every text node and attribute, the stale and never-answered unreachable cases, the badge and description structure, no colour alone, and the position line, Back and unknown-health cases. The generator produced 5 mutants and 11 were hand-written from the plan's kill list (adapted to the single answer value). The first run left one survivor, the step number passed to the card, which no case pinned; a case for the position line and the Next hint was added and the run repeated: 16 mutants, all killed. Both reviews approved; the code review raised LOW observations only (a test that a failed depth read does not show in step 1 would pass if the depth state were ignored, and the sentence split depends on the copy still containing the variable name, which the copy tests pin).
