  - id: cycle-1
    tasks: [T008, T009, T013, T014]
    description: >
      The copy strings and the step card (TC-COMP-111 groundwork, AC-25, DAC-E4-13, DEC-0345, DEC-0346, DEC-0350): copy.ts gains READ_ERRORS.notAnswering, READ_ERRORS.unexpected and STEP2.saveFailed, each with a doc comment saying this story adds it; step-card.tsx holds STEP_HEADING_ID, StepCard (a section labelled by its h2, the position line, explanation capped at LAYOUT.explanationMeasure, note, Back and Continue footer naming the neighbouring steps), useStepHeadingFocus (never on first render, on a change only), failureReason (never reads the message or request id) and StepReadError. step-card.test.tsx holds the section and heading, footer, absent controls, explanation and note, focus hook and failureReason and StepReadError cases; copy.test.ts gains the three verbatim rows. The generator produced 6 mutants and 8 were hand-written from the plan's kill list. The first run left nine survivors: cast-union off-by-ones on the Back and Next title index (no test can tell a type-level union member from another) and the step 4 Continue guard; the index casts were replaced by a single StepId cast and a step 4 case with a handler was added. The first spec-drift review then reported drift: that guard is not in the plan's T014, so the guard and its case were removed and the plan's literal footer kept, the mutation run repeated (14 mutants, all killed) and both reviews repeated on the corrected diff, which this entry records. Both repeated reviews approved; the code review raised one MEDIUM (the h2 carries focus-visible:outline-none with no ring, which T014 prescribes and not-found.tsx does the same) and LOW observations (a step 4 card given a handler would read Next: undefined, which the plan says never happens).
