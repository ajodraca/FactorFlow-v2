  - id: cycle-2
    tasks: [T010, T015]
    description: >
      The step list (AC-25, DAC-E4-1 rendering half, DAC-E4-S2-1, DEC-0348, DEC-0349, DEC-0350): step-list.tsx holds StepList, the left column with an optional header and the vertical stepper as a navigation named Setup steps, bounded by LAYOUT.sideColumnMin and sideColumnMax with dots of LAYOUT.markerSize; a done step that is not the current one is an in-page link to the step heading that calls goTo, and a done step's one-line summary reads Found or Missing (only while health is answering), the saved years, the followed count through formatCount, or the download's start time, else its request time, from the attention answer or the last good one. step-list.test.tsx holds the structure, current and done, activation, keyboard, summaries, layout values and header cases against independent literals. The generator produced 10 mutants and 9 were hand-written from the plan's kill list. The first run left two survivors, both on the link condition: the stepper only links a step whose state is done, so a guard beside it was redundant and unobservable; the link is now derived from the computed state (stepState === done) and the manual mutant changed to its negation, and the run repeated: 19 mutants, all killed. Both reviews approved; the code review raised LOW observations only (a fixture run_id value that holds a scanned word in a test file, no test for an answering state with a null health, and no check that the link click's default is prevented).
