leton's rows, which no test could observe, so the rows are now derived from the step titles and a test asserts four of them; the repeated run: 16 mutants, all killed. Both reviews approved; the code review raised LOW observations only (steps 2 to 4 of the never-populated row assert no record, the screenStateOf absence claim is not asserted, one fewer done link than the plan words in the step 2 vocabulary row, the loading row does not check the card skeleton inside the busy element, and one vacuous assertion on parseBulkSymbols), none a plan violation and left as follow-ups.
