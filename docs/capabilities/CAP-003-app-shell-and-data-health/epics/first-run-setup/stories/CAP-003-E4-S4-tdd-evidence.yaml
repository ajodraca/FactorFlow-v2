    description: >
      Rework of adversarial review v1 (IR-001 to IR-005, IR-007). IR-001: the progress line puts a space between the Started and checked spans, so its text reads Started {time} checked {time} and carries no trailing boundary when checked is absent; two tests pin the whole line's text. IR-002: the TC-COMP-122 loading row asserts the busy element holds the default card with its three skeleton bars. IR-003: a test accepts a 202 while attention is loading and asserts the pending view and no unreadable line. IR-004: StepDownload latches the pending view with a named flag set when attention first names this visit's download and reset on each start, so a later download is shown as itself (DEC-0356 until); a test pins an ok read naming r-2, then r-3 running, then r-3 ended. IR-005: the vacuous parseBulkSymbols assertion and its import are removed; the other plan assertions it lists are left for the owner. IR-007: latestOf takes ReadState<Attention>. IR-006 is addressed by this cycle's run using --stillborn-pattern 'error TS[0-9]+'; cycles 2 and 3 keep their recorded results, which the review recounted as 51 of 52 killed. The run: the generator produced 10 mutants and 5 were hand-written (the reviewer's two survivors, the dropped boundary, the unlatched view, the latch never set); 14 killed, 1 survived as equivalent. Both reviews approved.
