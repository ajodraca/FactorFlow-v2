  - id: cycle-3
    tasks: [T010, T011, T012, T013, T018, T019, T020, T021]
    description: >
      The screen (TC-COMP-121, TC-COMP-122, TC-COMP-123 screen half; AC-3, AC-24, AC-25, AC-26, DAC-E4-S4-3, DAC-E4-S4-4, DAC-E4-S4-5; DEC-0359): index.tsx holds SetupScreen (default export for the shell's lazy binding) with the persistent h1 and sub-line outside the loading swap, the two columns inside LAYOUT.contentMaxWidth with the step list column bounded by LAYOUT.sideColumnMin and sideColumnMax, the step list or its skeleton, and the step card region through StateRegion; screenStateOf (loading, never populated, partial, populated and nothing else), cardRenderers (a function, because the never-populated kind carries no data) recording empty-no-match, unavailable, error and unreachable as not applicable with their reasons, the stale record in the module comment, the card and list skeletons, and SetupBody, which calls the step heading focus hook only once the reads have settled. It mounts no provider and opens no timer. setup.test.tsx holds T010 to T013: back and forward from step 4 to step 2 keeping the years text, the radio choice and the pasted text with nothing written to browser storage, every applicable state of every step through the composed screen with the not-applicable records, the vocabulary scan of five screen rows, and the screen's own cases (the h1 persists and takes the shell's focus, no focus moved on entry, focus on a step change, each step's card, the layout values, no provider of its own, re-derivation on every mount). T019 and T020 join this cycle's validation evidence (validation-cycle-3.log): the change set is the story's files and plan artifacts, the delivered directories are unchanged against HEAD, no timer, storage, layout literal or DAC-E7-3 term appears in step-download.tsx or index.tsx, /setup is not registered, and the full suite (125 files, 3430 tests), lint, format, tsc and build pass. The generator produced 20 mutants and 10 were hand-written from the plan's kill list; the first run left four survivors, the numeric keys of the skeleton's rows, which no test could observe, so the rows are now derived from the step titles and a test asserts four of them; the repeated run: 16 mutants, all killed. Both reviews approved; the code review raised LOW observations only (steps 2 to 4 of the never-populated row assert no record, the screenStateOf absence claim is not asserted, one fewer done link than the plan words in the step 2 vocabulary row, the loading row does not check the card skeleton inside the busy element, and one vacuous assertion on parseBulkSymbols), none a plan violation and left as follow-ups.
