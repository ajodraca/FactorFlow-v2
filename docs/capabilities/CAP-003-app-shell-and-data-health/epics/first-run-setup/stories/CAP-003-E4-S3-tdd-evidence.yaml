      The paste summary (TC-COMP-113, AC-5, DAC-E4-5, DAC-E4-S3-1, DEC-0218, DEC-0351, DEC-0352): summarise-paste.ts holds SYMBOL_SHAPE and ENTRY_SEPARATOR (mirrors of the delivered parser, pinned equal by test), summarisePaste (accepted in paste order, each repeated valid symbol named once in duplicates, every invalid entry in unreadable with the near-miss fix when a stretch of slash, space or underscore between letters becomes one dot and yields a valid symbol) and replaceEntry (every whole entry equal to the unreadable one replaced, separators and surrounding whitespace kept). summarise-paste.test.ts holds TC-COMP-113's four cases and T010's rule cases (a) to (g). The generator produced 9 mutants and 5 were hand-written from the plan's kill list. The first run left one survivor: the even-index guard on replaceEntry's split parts, which no input can distinguish because a separator run never equals a non-blank parser entry; the guard was removed and the run repeated (14 mutants, all killed). The first code review rejected one HIGH (the word run in a comment, an AC-19 term), fixed; the first spec-drift review reported that ENTRY_SEPARATOR was not exported as T015 states, fixed and given a mirror assertion. Both reviews repeated on the corrected diff approved; the code review left LOW observations only (a replacement string would read $ patterns, an over-long near-miss and a double separator are not pinned).
