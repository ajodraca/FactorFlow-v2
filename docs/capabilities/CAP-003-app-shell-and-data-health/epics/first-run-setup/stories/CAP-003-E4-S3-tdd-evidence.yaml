    description: >
      The batches (TC-COMP-114 request half, AC-5, AC-17, DAC-E4-6, DAC-E4-S3-2, DEC-0354): post-in-batches.ts holds MAX_SYMBOLS_PER_REQUEST (the mirror of the server bound, pinned equal by reading bounds.py in a test), the BatchOutcome union and postInBatches, which posts one batch at a time through the delivered addInstruments, counts a 409 all_duplicate batch as posted and goes on, collects each batch's rejected dispositions in order, stops at any other ApiError or an ApiUnreachableError returning the posted count with that batch's and every later symbol unposted, and rethrows anything else. post-in-batches.test.ts holds the 1000/1000/500 split, the sequential posting, the 409 and transport and 500 cases, the boundaries, the accumulation, the other refusal codes, the rethrow and the bound mirror. The generator produced 6 mutants and 6 were hand-written from the plan's kill list (the Promise.all mutant is covered by the sequential case and was not generated). All 12 were killed on the first run. Both reviews approved; the code review raised LOW observations only (a 409 batch adds no per-symbol rows, the sequential case settles on a fixed number of microtask ticks, and the bounds mirror and its comment depend on a line layout).
