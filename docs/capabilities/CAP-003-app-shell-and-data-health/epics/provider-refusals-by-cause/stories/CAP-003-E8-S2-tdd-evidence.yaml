  - id: cycle-3
    tasks: [T008, T012, T013]
    description: >
      Review rework for implementation review v1. IR-001 (HIGH): no test failed if raising ProviderRateLimited released
      the stock's spent budget. New TC-COMP-237 row test_a_spent_budget_stays_spent_for_every_execute_until_the_next_start:
      after the 300 s budget is spent ([60.0] * 5, then ProviderRateLimited), a further always-throttled execute before
      the next start_throttle_budget() raises ProviderRateLimited after exactly one send with no new sleep, so the sleeps
      between two starts stay at 300 s (DAC-E8-5; rate-limit-governor section 2.4). IR-002 (HIGH): no test failed if
      throttled_at was read from the wall clock. New row test_throttle_waits_are_charged_on_the_monotonic_clock_not_the_wall_clock,
      beside T012: monotonic FakeClock at 1000 s, now = that clock + 1_793_999_000 s (a whole minute, about time.time in
      late 2026), budget 300 s, always throttled with the 20-send guard; six sends, [60.0] * 5, then ProviderRateLimited
      (DAC-E8-5 "measured from the start of the throttle sleep", section 2.3 monotonic). IR-003 (LOW): errors.py module
      docstring now says a throttled response never becomes a MassiveError (DAC-E3-S3-6) and persistent throttling ends
      as ProviderRateLimited, raised by the governor (massive-client sections 2.4, 2.5). rate_limit.py unchanged. Its
      commit is the rework commit after the review commit 2c44be5, so commit_hash: stage resolves to it and the patch is
      the staged diff over 2c44be5.
    deviations: >
      (1) The IR-002 row derives now from the monotonic FakeClock plus a fixed offset instead of passing one FakeClock as
      both clocks, as DAC-E8-S2-1's Given and rate-limit-governor section 7 have every row do: one shared clock cannot
      tell the monotonic charge from a wall-clock one, which is why review-throttled-at-from-wall-clock survived. The
      Given's reason (a sleep advances the pacing and wall clocks together, review v14 FINDING-60) still holds, because
      now moves in lockstep with the FakeClock; the offset is a whole number of minutes, so the boundary waits are the
      ones one shared clock gives. IR-002's remediation allowed this placement as a recorded deviation; both cycle
      reviewers accepted it. The row builds RateLimitGovernor directly because _governor()'s now parameter is typed
      FakeClock; the helper and every delivered and story row are unchanged. Doc sync may name this row as section 7's
      exception. (2) The cycle was staged twice: the first round's code review (approved) raised two non-blocking
      wording points in the IR-002 row's comment and docstring (time.time is about 1.79e9 in late 2026, not 1.76e9; the
      claim about the other rows overstated), which were fixed before the final RED, GREEN, mutation run and reviews
      recorded here. The second round's non-blocking points (the docstring's "Unlike the rows DAC-E8-S2-1 governs" is
      this deviation, recorded here; the IR-001 row's redundant sum assertion) need no code change.
