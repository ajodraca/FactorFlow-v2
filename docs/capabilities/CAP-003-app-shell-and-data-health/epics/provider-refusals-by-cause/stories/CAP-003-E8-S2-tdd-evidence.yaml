# TDD evidence for CAP-003-E8-S2 - One throttle wait budget per stock, checked before each wait, and ProviderRateLimited.
# Base commit (T001): 201442b37d064dddc5df1edb00c188b0e23b746f (CAP-003-E8-S1 coded, adversarial review v2 PASS and
# doc-synced on this branch's ancestry: 3888727, 75f2162, ee9c56f, 201442b); whole-story focused suite there: 116 passed.
# T001 records: (a) errors.py defines ProviderNotEntitled(MassiveError), lists it in __all__, holds five
# _ERROR_KIND_BY_TYPE rows including not_entitled, and composes _NOT_ENTITLED_DESCRIPTION for it; S1 left
# compose_failure_reason's docstring ("one of the typed `MassiveError` subclasses in this module's kind table") and its
# TypeError text ("only the typed MassiveError subclasses in its kind table are accepted.") count-free, so T013 leaves
# both unchanged. (b) massive/__init__.py re-exports ProviderNotEntitled; its docstring says "the `MassiveError` types"
# with no count, so T014 changes no count. (c) outcomes.py line 151,
# `if isinstance(error, (ProviderUnavailable, ProviderContractViolation, ProviderNotEntitled)):`, already carries the
# comment naming ProviderRateLimited; T003's hand-written mutant targets that line. (d) S1's tests:
# test_massive_failure_reasons.py test_not_entitled_reason_carries_the_fixed_description_never_the_provider_text,
# test_each_kind_composes_its_own_reason_by_exact_class (five kinds), test_an_unlisted_massive_error_subclass_raises_type_error;
# test_massive_error_classification.py the TC-COMP-228/229/234 rows and
# test_provider_not_entitled_is_exported_from_errors_and_the_package; test_outcomes.py the four TC-COMP-233 tests. T002's
# tests carry new names beside them; its six-kind test is TC-COMP-240's own mapped case and repeats S1's five delivered
# rows with its own literals, as T002 specifies.
# Two cycles, as the task plan's Other Notes define them: cycle-1 (T002-T005 -> T013, T014) and cycle-2 (T006-T012 ->
# T015, T016). Story coding makes one commit for the story, so both cycles record commit_hash: stage and cite their
# reviewed_patch. cycle-1's patch is the staged diff against HEAD (check-tdd-evidence.py fingerprint --staged); cycle-2's
# is the diff from the index tree cycle-1 was reviewed at to the index tree after staging its own files
# (fingerprint --range <tree>..<tree>), so the patches apply in order onto the base and rebuild the story's code.
# Mutation: scripts/mutation-run.py generates no mutant for cycle-1's lines (a class statement, a dict row and list
# entries) and four for cycle-2's; each cycle also runs the task plan's hand-written mutants (operator "manual") plus a
# few the coder added for the same lines.
# Reviews: per cycle, one independent code-review subagent and one independent spec-drift subagent judged the patch;
# their verdicts are recorded in code-review-cycle-N.txt and spec-drift-cycle-N.txt.
# Interpreter: no venv in this clone; every command ran as <main checkout>/.venv/bin/python -m <tool> from the clone
# root, with pytest given -o pythonpath=src.
# No exception and no decision record: no TDD or review step was skipped.
# T017 (final bytes): full suite 2659 passed, postgres tests included (testcontainers postgres:16), 1 pre-existing
# StarletteDeprecationWarning; uv build ok; ruff check, ruff format --check and mypy src clean; start_throttle_budget has
# no caller in src; no rate_limit.py hunk inside GovernorSettings or from_massive_settings, no logging, no new message
# other than _THROTTLE_BUDGET_SPENT_MESSAGE; client.py and outcomes.py not in the diff (final-validation.log).
# Cycle-3 is the rework for implementation review v1 (IR-001, IR-002 HIGH; IR-003 LOW): two test_governor_retry.py rows
# and the errors.py module docstring, no production behaviour change; its mutation run is the review's 41 mutants
# (scratchpad review-e8s2-v1/mutants.json, sha256 6362ffc4...6c37) retagged cycle-3, on the review's command.

