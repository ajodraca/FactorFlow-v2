      survivors:
        - id: src/factorflow/ingestion/runner.py:manual:m5-call-after-symbol-lookup
          disposition: equivalent
          reason: >
            The plan's M5, recorded there as equivalent. The symbol lookup sends no provider request, and
            start_instrument() only resets the governor's spent throttle wait (no request, no return value, no error),
            so the budget is still started once per stock, after heartbeat and cancellation_requested and before the
            stock's first provider request; the governor holds the same state at every request. The placements differ
            only for a stock skipped for a missing symbol, which sends nothing; pinning either placement there would
            pick one reading of DAC-E8-7 ("once per stock" against "a stock never fetched starts no budget"). The
            code-review subagent accepted the disposition.
        - id: src/factorflow/ingestion/runner.py:manual:m12-call-inside-reference-helper
          disposition: equivalent
          reason: >
            The call moved to the first line of _fetch_reference, immediately before client.fetch_reference: M5's
            placement (after the symbol lookup, which sends nothing) plus inside the reference try, whose except
            clauses catch only CredentialRejected and provider errors that start_instrument(), a reset of one float on
            the governor (massive-client section 11: returns None, no error), never raises. Every provider request of
            every stock is charged to a budget started after that stock's heartbeat, as before. The code-review
            subagent accepted the disposition.
