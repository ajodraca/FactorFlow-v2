      already holding, T006 at its marks, T008 at start_instrument.call_count 0 for both refusals, T009 at the second
      stock's sleeps []. T004 and both T007 scenarios pass on arrival, characterization rows of E8-S1 to S3 and the
      delivered outcome rule through the runner.
    green_evidence: >
      The focused module 11 passed; ruff check, ruff format --check and mypy src clean (green-cycle-1.log). Phase 4
      (T011): the module plus every delivered runner, outcome and entrypoint suite, 143 passed, delivered tests
