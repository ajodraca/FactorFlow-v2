  - id: cycle-2
    tasks: [T003]
    description: >
      Review rework for implementation review v1, test-only (tests/integration/test_runner_provider_refusals.py; no
      production file changes). IR-001 (HIGH): TC-COMP-252 drove only the normal path and the cancellation exit, so the
      review's mutants review-r08-extra-call-on-claim-loss, review-r05-call-after-symbol-lookup and
      review-r12-call-inside-reference-helper survived. Two TC-COMP-252 rows on the same parent-Mock technique: (1) the
      claim lost during the first stock (an _abandon_run helper copied from tests/integration/test_runner_reclaim.py,
      called from the first stock's fetch_corporate_actions side effect, as the cancellation row calls
      _set_cancelling): the names are the seven-name first stock followed by heartbeat only, start_instrument is called
      once, and the run stays abandoned; (2) a roster [AAPL, an instrument_id with no instrument row, KO] with
      runner._symbol_for_id wrapped in a Mock spy attached to the same parent as symbol_lookup: every stock records
      heartbeat, cancellation_requested, client.start_instrument, symbol_lookup in that order, the skipped stock with no
      fetch_*, so start_instrument is called 3 times, once per stock and before each lookup (story Description,
      acquisition-runner CAP-003 section 2.2, DAC-E8-7), and the lookups are made for the roster's ids in order. The
      cycle's commit is the rework commit after the review commit d809d75, so commit_hash: stage resolves to it and the
      patch is the staged diff over d809d75.
    deviations: >
      (1) The missing-symbol row also spies the symbol lookup, beyond IR-001's minimum (a call count on the skipped
      stock), so the order "start_instrument before the lookup" is pinned on the fetched stocks too; the code review
      showed a mutant that keeps three calls but moves the fetched stocks' call below the lookup is killed only by the
      spy. (2) Cycle-1's mutation block now cites mutation-cycle-1-rescored-results.json, the same 13 cycle-1 mutants
      rerun at this cycle's test bytes (13/13 killed), in place of the first scoring whose m5 and m12 equivalence the
      review rejected; the original results file is kept beside it and named in cycle-1's comment. (3) The task plan's
      Other Notes still describe M5 as equivalent; the plan's content is not this skill's to edit (story-coding
      constraint 9), so it is a follow-up for the plan's next revision. (4) Code-review NIT left as is: the
      _abandon_run docstring reads "as ... does" twice.
