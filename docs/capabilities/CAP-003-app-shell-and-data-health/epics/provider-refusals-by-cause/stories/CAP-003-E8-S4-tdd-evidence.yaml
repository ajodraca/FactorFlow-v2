# TDD evidence for CAP-003-E8-S4 - The runner starts each stock's budget at its heartbeat, proven end to end at the
# default timing set.
# Base commit (T001): eb912cb020f511a990ec681671d90a105b286112 (CAP-003-E8-S3 doc sync; E8-S1, S2 and S3 coded,
# adversarially reviewed and doc-synced on this branch's ancestry; nothing pushed or merged, by the owner's
# instruction, so "landed" means present in this branch's history; S3 and S4 land and release together). T001 records:
# errors.py defines ProviderRateLimited (line 109) and ProviderNotEntitled (line 124) and maps them to rate_limited and
# not_entitled (lines 292-293); rate_limit.py has RateLimitGovernor.start_throttle_budget() (line 124); client.py has
# classify_for_governor (line 67) and MassiveClient.start_instrument() (line 100); outcomes.py classify_provider_error
# accepts both types (line 151); PYTHONPATH=src imports this clone's factorflow; docker info succeeds (28.3.2) with the
# sandbox disabled.
# One behaviour-changing cycle, the plan's cycle-1 (T002-T009 tests, then T010 the runner call). T013 (README upgrade
# subsection) changes documentation only and is no cycle; T014 was already satisfied by the E8-S1 and E8-S2 doc syncs
# (201442b, 52ecfbd), so README.md's Massive provider failure reasons section was not edited (docs-and-static-checks.log).
# T001, T011, T012, T015 and T016 change no code.
# Story coding makes one commit for the story, so the cycle records commit_hash: stage and cites its reviewed_patch,
# the staged diff against HEAD (fingerprint --staged, index tree 617b1ccc).
# Mutation: scripts/mutation-run.py generates no mutant for the added comment and call line (as the plan expected), so
# the run is the plan's hand-written M1-M4 and M6 plus the coder's own on every other placement of the call
# (operator "manual"); M5 (and the coder's m12) survive and are disposed of as equivalent, as the plan records M5.
# Reviews: an independent code-review subagent and an independent spec-drift subagent judged the patch.
# Interpreter: no venv in this clone; every focused command ran as <main checkout>/.venv/bin/python -m <tool> from the
# clone root with pytest given -o pythonpath=src; postgres rows in a testcontainers postgres:16 on a random port with
# the Bash sandbox disabled; the production compose project factorflow untouched; the live provider never contacted.
# No exception and no decision record: no TDD or review step was skipped.

cycles:
  - id: cycle-1
    tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T010]
    description: >
      tests/integration/test_runner_provider_refusals.py (new, every test @pytest.mark.postgres on
      migrated_runner_connection). T002: copied store helpers (_fetch_result_rows reads instrument_id, data_type,
      outcome, reason only), _symbol_of, the responders (_plan_refusal_answer: 403 with req_403_<n> on
      /stocks/financials/v1/*, reference_active.json with the requested ticker, empty events and results;
      _throttling: a real 429 with error_rate_limited.json's bytes for the throttled symbols), and _real_harness:
      production MassiveSettings and RunSettings from env (RPM 60, every other value at its default, asserted 3 /
      300.0 / 900.0), one FakeClock(1_762_560_000.0) as monotonic and now, FakeSleeper, SequenceJitter([jitter]), the
      real MassiveClient, forbid_sockets then RecordingMakeRequest, and heartbeat / finalise / budget marks recorded
      before delegating. T003 (TC-COMP-252) two MagicMock-client tests on one parent Mock: the literal seven-name
      sequence x 2, and, cancelled during the first stock, the seven names plus heartbeat, cancellation_requested,
      start_instrument called once, run cancelled. T004 (TC-COMP-253) AAPL then KO refused on financials. T005
      (TC-COMP-254) KO always 429 then AAPL, jitter 0.0 and 0.999, (a) to (e). T006 (TC-COMP-255) KO alone, run
      failed. T007 (TC-COMP-258) both scenarios, an earlier failed run's [unavailable] rows unchanged by xmin and
      every column except the retry count. T008 (TC-COMP-256 edge) a refusal then CredentialRejected fails the run
      at once. T009 two throttled stocks each wait a full budget. Then T010: runner.py execute_claimed, after the
      cancellation_requested block and before "# --- Fetch symbol ---", the design's two-line comment and
      self._client.start_instrument().
    deviations: >
      (1) Markers read "# Implements CAP-003 TC-COMP-NNN", not "# Implements TC-COMP-NNN": CAP-001 already uses bare
      TC-COMP-253 to 259 (tests/unit/test_run_states.py, tests/integration/test_run_constraints.py); E8-S1 to S3 set
      the prefix precedent. Both reviewers accepted it. (2) _plan_refusal_answer() is a factory returning a fresh
      responder per download, so each download's 403 request ids count from 1; the scenario helpers share one
      _run_download and take a prepare hook (T007's seed between the instrument inserts and the download), and
      _run_throttled_download takes throttled (T009's KO and PEP). (3) Small tightenings beyond the plan: TC-COMP-252
      test 1 also asserts the run succeeded; path checks compare the route without its query for equality. (4) The
      plan's Phase 2 checkpoint predicted 4 RED and T004, T006, T007, T008 passing on arrival; the observed split is 8
      RED (T003 x2, T005 x2 at (d), T006, T008 x2, T009) and 3 passing on arrival (T004, T007 x2). T006 and T008 fail
      on assertions the plan itself specifies (the budget mark; start_instrument.call_count == 1), which need T010;
      both reviewers judged the tests right and the checkpoint's prediction a planning inconsistency.
