# TDD evidence for CAP-003-E8-S1 - A plan refusal is sent once and recorded as not_entitled.
# Base commit (T001): 0c0c7ad6ada5b161b567787e3277bc888e8a4811; focused suite there: 49 passed.
# Four cycles, as the task plan's T016 defines them: C1 (T002, T003 -> T010), C2 (T006, T008 -> T011),
# C3 (T007 -> T012), C4 (T009, T004, T005 -> T013). Story coding makes one commit for the story, so every cycle
# records commit_hash: stage and cites its reviewed_patch. cycle-1's patch is the staged diff against HEAD
# (check-tdd-evidence.py fingerprint --staged); each later cycle's patch is the diff from the index tree the previous
# cycle was reviewed at to the index tree after staging its own hunks (fingerprint --range <previous tree>..<new tree>),
# so the patches apply in order onto the base and rebuild the story commit.
# Mutation: scripts/mutation-run.py generates no mutant for these lines (none of its operators matches a Python
# membership test, a non-default keyword argument or a tuple literal), so every cycle runs the task plan's hand-written
# mutants plus the plan's named generated-operator mutants written by hand (operator "manual").
# Reviews: per cycle, one independent code-review subagent and one independent spec-drift subagent judged the patch;
# their verdicts are recorded verbatim in code-review-cycle-N.txt and spec-drift-cycle-N.txt.
# Interpreter: no venv in this clone; every command ran as PYTHONPATH=src <main checkout>/.venv/bin/python -m <tool>.
# No exception and no decision record: no TDD or review step was skipped.
# T014 (final bytes): full suite 2639 passed, postgres tests included (testcontainers postgres:16); uv build ok;
# ruff check, ruff format --check and mypy src clean (CAP-003-E8-S1-evidence/final-validation.log).
# T015 against the base: (a) uv.lock and pyproject.toml unchanged; (b) no hunk touches _safe_fields (base lines
# 110-135), which still returns exactly status, message, error and request_id; (c) no added test line reads attempts;
# (d) the change set is errors.py, __init__.py, outcomes.py, the four test files, the task plan, the story status, this
# file and the CAP-003-E8-S1-evidence folder (logs, review records, patches, mutation results, as earlier stories keep
# them); no migration. client.py, rate_limit.py, runner.py, models.py and paging.py are unchanged.

