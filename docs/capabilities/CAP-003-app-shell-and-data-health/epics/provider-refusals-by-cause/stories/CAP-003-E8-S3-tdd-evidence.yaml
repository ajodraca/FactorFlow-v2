# TDD evidence for CAP-003-E8-S3 - A real 429 is throttling, not an attempt, and each stock starts its own budget.
# Base commit (T001): 52ecfbd0f4cc51cbfaac0899158811a11dce7d41 (CAP-003-E8-S2 doc sync; E8-S1 PASS v2 and E8-S2
# PASS-WITH-WARNINGS v2 coded, reviewed and doc-synced on this branch's ancestry; nothing pushed or merged, by the
# owner's instruction, so "landed" means present in this branch's history). T001 records: errors.py defines
# ProviderNotEntitled (line 124) and ProviderRateLimited (line 109) and _ERROR_KIND_BY_TYPE holds not_entitled and
# rate_limited; rate_limit.py defines RateLimitGovernor.start_throttle_budget() (line 124) and the check-before-wait
# THROTTLED branch (line 176); tests/unit/test_massive_retry.py holds S1's TC-COMP-230/231 rows and real-transport harness
# (_CLOCK_START, _production_settings, _real_transport_client) and S2's _governor() budget 300.0. Focused suite at the
# base: 56 passed (the plan's 36 predates S1 and S2's rows).
# Three cycles: the plan's cycle-1 (T002 -> T013) and cycle-2 (T003-T012 -> T014, T015, with T016's module-docstring
# paragraph), and cycle-3, a test-only correction of a delivered CAP-001 test the full suite (T016) showed failing.
# Story coding makes one commit for the story, so every cycle records commit_hash: stage and cites its reviewed_patch. cycle-1's patch is the staged diff against HEAD (fingerprint --staged, index tree
# 72aaf81); cycle-2's and cycle-3's are each the diff from the previous cycle's index tree to the index tree after
# staging their own bytes (fingerprint --range <tree>..<tree>), so the patches apply in order onto the base and rebuild the story's code.
# Mutation: scripts/mutation-run.py generates no mutant for cycle-1's lines and three for cycle-2's; both also
# runs the plan's hand-written mutants (operator "manual") plus the coder's own on every branch added. cycle-2's
# command is two-stage (see cycle-2 deviations). cycle-3 changes no production line (not_applicable).
# Reviews: per cycle, an independent code-review subagent and an independent spec-drift subagent judged the patch;
# cycle-2 was reviewed three times as it was strengthened (round files kept beside the final ones).
# Interpreter: no venv in this clone; every command ran as <main checkout>/.venv/bin/python -m <tool> from the clone
# root, with pytest given -o pythonpath=src.
# No exception and no decision record: no TDD or review step was skipped.
# Cycle-4 is the rework for implementation review v1 (IR-001 HIGH; IR-003 LOW; IR-002 is left to doc sync): test-only
# changes to tests/unit/test_massive_retry.py, no production change; its mutation run is the review's 33 mutants
