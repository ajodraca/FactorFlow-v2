  - id: cycle-3
    tasks: [T004, T005, T006, T007, T011, T012, T013]
    description: >
      The header (TC-COMP-133, TC-COMP-134, TC-COMP-135; AC-24, AC-25, AC-26, DAC-E5-6, DAC-E5-S1-2 to DAC-E5-S1-4; DEC-0206, DEC-0209, DEC-0362): header.tsx exports HomeHeader (no props), which reads useShell().attention and nothing else, renders the h1 from the Chicago wall clock and either the generic AsOfLine of market state, prices and checked or, while loading, the aria-hidden skeleton; Market closed is text and not-determinable goes through NotDeterminable with its reason, never a tier; prices go through formatSessionDate unshifted, read prices not downloaded yet when null and an Absent dash while the read fails; checked is the server's checked_at (last answer's while failing, an Absent dash when never answered), never the client's checkedAt; a one-minute interval renews the clock with no read and is cleared on unmount. header.test.tsx holds T004 to T007 (28 tests): the date and unshifted prices across two machine zones, the badge's variant, hatch, description and absence of a tier, the ten-state vocabulary scan and the catalogue walk with its CALLS map (at least 40 strings, every function leaf called, the scanner's control cases), and cases (a) to (h). T012 and T013 join this cycle's validation evidence (validation-cycle-3.log): the full suite (128 files, 3553 tests), lint, format, tsc and build pass, the delivered directories are unchanged against HEAD, only the six story files are new under web/src/screens/home, and the Validation Plan greps print what the plan states. The generator produced no mutants for the tsx file and 14 were hand-written from the plan's kill list; the first run left one survivor (a mutant that did not change behaviour, replaced by one that never updates the clock) and one stillborn mutant (an unused import, replaced by a shifted date), and the repeated run killed all 14. Deviation: the plan's mutant 'prices not acquired yet' is not matched by the whole-word term acquire, so the run uses 'prices not acquire yet'; the plan text is the follow-up. Both reviews approved with LOW observations only.
