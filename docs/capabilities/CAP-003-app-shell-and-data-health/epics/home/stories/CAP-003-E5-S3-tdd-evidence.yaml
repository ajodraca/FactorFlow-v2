  - id: cycle-2
    tasks: [T002, T003, T004, T011, T012, T016]
    description: >
      The Needs you card (TC-COMP-141, TC-COMP-142, TC-COMP-146; DAC-E5-7 to DAC-E5-9, DAC-E5-11, DAC-E5-S3-1, DAC-E5-S3-2, DAC-E5-S3-3, DAC-E5-S3-6, AC-7, AC-9, AC-12, AC-16; DEC-0367 to DEC-0370): needs-you-card.tsx exports NeedsYouCard() and NEEDS_YOU_STATES. The list is sortAttention(deriveNeedsYou(...)) once, each row goes through NeedsYouItemRow with the catalogue copy, a polite unkeyed output carries the count, and the body renders through StateRegion (loading skeleton, populated list or the empty sentence, error with Try again; five kinds recorded not-applicable). needs-you-card.test.tsx holds the shared harness and T002 to T004, T011 and T012. It also asserts T007 (a) to (d) and T008's records at card level, because this cycle's code introduces the error path and the records; home.test.tsx will assert the same through the screen. The first spec-drift pass reported drift (tests for a later cycle written early, and gaps in T003, T004 and T011); the gaps were fixed, the extra describe was kept and declared, and the second pair of reviews approved with no drift. The generator produced 13 mutants and 16 were hand-written; 28 of 29 were killed. The one survivor, the off-by-one on the done fallback of copy.body in the first_download case, is equivalent: the fallback applies only when latest_download is null, which the derivation never produces for that kind, and body ignores done when total is null.
