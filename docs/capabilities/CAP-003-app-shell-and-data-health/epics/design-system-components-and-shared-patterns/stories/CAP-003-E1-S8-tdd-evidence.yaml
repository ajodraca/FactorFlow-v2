# TDD evidence for CAP-003-E1-S8 - Needs You Derivation and Sort: needs-you.ts and the Item Row.
# Each cycle commit carries its own entry (commit_hash: stage); the cycle's evidence artifacts (patch, logs, mutation results) follow in a docs-only commit naming the story.
# Mutation runs use a command that links the repo's node_modules into each clone (the clones carry none); the plan's tsc step is not part of the per-cycle mutation command, tsc and the full suite run in the Final Step.

