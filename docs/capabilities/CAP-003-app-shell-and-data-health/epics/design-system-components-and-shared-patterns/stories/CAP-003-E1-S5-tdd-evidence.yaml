# TDD evidence for CAP-003-E1-S5 - The One Tier Function: tiers.ts and StatusBadge.
# One commit for the whole story-coding stage (commit_hash: stage); independent code-review and spec-drift subagents judged each cycle's patch.
# Deviation from the plan: T003's table has 29 rows, not 28, because the plan also asks for the explicit failed: false item row on top of the kind rows (a reviewer found it missing; added, cycle-1 re-reviewed).
# Deviation from the plan: the T002 @ts-expect-error guards sit on the status property line inside a multi-line call and are wrapped in expect(() => ...).toThrow() so they also hold at runtime under vitest.
# Mutation: mutation-run.py generates no mutants for TypeScript (its operators target Swift and Python), so every mutant is hand-written: the plan's five, plus one per tier row, label and ternary of tiers.ts and one per shape, attribute and prop of status-badge.tsx.
# Cycle-1 and cycle-2 red log is one run covering both test files (tiers.test.ts could not resolve ./tiers; six status-badge tests failed).

cycles:
  - id: cycle-1
    tasks: [T001, T002, T003, T006]
    description: >
      The one tier function: tiers.ts exports Tier, NeedsYouKind, Status, tierOf and labelOf over every UX brief 12.2 row (28 DAC-E1-1 rows plus the explicit failed: false item row, 29), each a switch with a never default. tiers.test.ts asserts every row by input, label and tier, the partial-never-good and cancelled-never-critical guards, and, through the TypeScript compiler API, that a planted status kind or scores state fails to type-check inside both tierOf and labelOf (TC-COMP-020, TC-COMP-021). Baseline before any change: npm run test, 95 files and 2381 tests green. Reviews: code review APPROVED and spec drift none on the first pass except one drift (the missing explicit failed: false row), fixed, then both reviews repeated APPROVED and none.
