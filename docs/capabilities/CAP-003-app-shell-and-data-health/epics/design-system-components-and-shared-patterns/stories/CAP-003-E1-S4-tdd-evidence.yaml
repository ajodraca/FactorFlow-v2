  - id: cycle-2
    tasks: [T002, T003, T004, T005, T006, T008, T009, T010, T011, T012, T013]
    description: >
      data-table: the pure windowFor arithmetic, the table body common to every variant (programmatic headers, controlled single-column sort cycle ascending, descending, unsorted, aria-sort on the sorted column only, row header always on for history and opt-in elsewhere, busy), per-row expansion behind a named aria-expanded expander (kept open across appended pages), and the virtualised windowing over keyset pages with measured row and expansion heights, spacer rows, aria-rowcount and aria-rowindex, onEndReached once per loaded page, and a row memo that leaves earlier rows alone (TC-COMP-017, TC-COMP-018, TC-COMP-019, DEC-0306, DEC-0307). Reviews: first pass APPROVED with one MEDIUM (onEndReached never re-fired when a sort replaced the rows by as many); fixed by keying the fired page on the first row id and the count, with two tests, and the cycle re-reviewed APPROVED with no drift. Mutation survivors of the first runs were killed by tests (numeric class, colSpan, sticky header, zero-height layout, one pixel row, expansion height past the window, shift-click) or by removing dead code (the extras filter, the scrollTop and rowCount guards, the open-id set, the inert options).
