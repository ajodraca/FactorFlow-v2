# TDD evidence for CAP-003-E1-S4 - Vendor data-table: compact, history, virtualised and expandable variants on TanStack Table.
# One commit for the whole story-coding stage (commit_hash: stage); independent code-review and spec-drift subagents judged each cycle's patch.
# Decisions applied from planning: DEC-0215, DEC-0306, DEC-0307.
# Deviation from the plan's five cycles: data-table.tsx and data-table.test.tsx are two files that every behaviour task changes, and staging is file-granular, so tasks T002 (row-height half), T003-T006 and T008-T011 are one cycle (cycle-2) instead of cycles 2-5. The package manifest is cycle-1.
# Deviation from the plan's text: the plan's manualSorting and autoResetExpanded options are not set. No sorted or expanded row model is wired, so both are inert (mutating them left every test green); the component says so in a comment. The licence of @tanstack/react-table was verified by hand against node_modules/@tanstack/react-table/LICENSE (MIT, Tanner Linsley); package-lock.json carries license MIT (DEC-0298).

