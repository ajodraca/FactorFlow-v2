        - id: web/src/components/ui/data-table.tsx:266:negate-boolean:1
          disposition: equivalent
          reason: >
            The layout effect's guard (!windowed || !tableRef.current) read as && only skips less: for a non-windowed table the effect then measures a row height and expansion heights that no non-windowed code reads, and tableRef.current is set whenever the effect runs, so every windowed render behaves the same.
