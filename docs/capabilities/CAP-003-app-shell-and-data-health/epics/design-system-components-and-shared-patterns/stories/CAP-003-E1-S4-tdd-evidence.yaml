          disposition: equivalent
          reason: >
            The non-windowed window literal is typed VisibleWindow; dropping padTop leaves undefined, and the only read, padTop > 0, is false for undefined exactly as for 0.

  - id: cycle-3
    tasks: [T002, T004, T006, T009, T010, T011]
    description: >
      Review v1 rework (IR-001 to IR-005, IR-008). Tests now pin the windowed aria-rowindex after a scroll, the memo's index and columns invalidation, the open expansion's height credited to its own row (IR-001, IR-002); the virtualised scroller's overflow-y-auto, the 24 px h-5 / h-5 w-5 sort and expander targets and the sr-only Details header (IR-003); the ten spec section 6 token classes and the sticky header background (IR-004). Production: an expanded row now also compares renderExpansion and getRowLabel in the row memo, so detail a caller loads into its own state reaches it (IR-005, DEC-0307); collapsed rows stay memoised. IR-008: the append test expands with Enter and awaits the rerender inside act, because TanStack resets its own page state in a microtask after data changes. Deviations, recorded here (IR-007): manualSorting and autoResetExpanded are not set, as cycle-2's header says (inert; no sorted or grouped row model is wired, TanStack table-core 8.21.3 index.esm.js:2740 and :3377); the expansion row's colSpan is columns.length + 1; heights are measured in a layout effect on every render; the prefetch key is the first row id plus the count; plan cycles 2 to 5 are cycle-2. IR-006 (aria-rowcount states the loaded count while hasMore) is not changed: T011 prescribes rowCount + 1 and a -1 or a total-count prop is a change to DEC-0307's owning design, so it is the owner's to decide.
