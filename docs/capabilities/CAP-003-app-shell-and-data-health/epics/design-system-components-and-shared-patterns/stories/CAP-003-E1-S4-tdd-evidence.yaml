  - id: cycle-1
    tasks: [T001, T002, T007]
    description: >
      Package half of TC-COMP-019: @tanstack/react-table ^8.21.3 added with npm install; licence verified by hand against node_modules/@tanstack/react-table/LICENSE (MIT, Tanner Linsley); package-lock.json carries license MIT for it and for the transitive @tanstack/table-core; no virtualisation library (DEC-0215). Baseline before any change: npm run test, 94 files and 2280 tests green.
