  - id: cycle-2
    tasks: [T003, T005]
    description: >
      Review v1 rework (IR-001, IR-002, IR-003). Test only; the production code already behaves so. IR-001: presence.test.tsx pins the plan-fixed wrapper (inline-flex items-center gap-2) and reason (text-xs text-muted-foreground) classes of NotDeterminable. IR-002: format.test.ts asserts the RangeError message naming the input for every non-date and non-count, rejects x2026-03-08, 2 ** 53 and 1e21, signed expanded-year instants, and an empty started_at that must not fall back to requested_at. IR-003: the catalogue's 21 generated mutants over format.ts are run, and the suite baseline is restated as measured at the review base. IR-004 and IR-005 are optional and not taken up. After: npm run test 99 files and 2509 tests green, npm run lint, npm run format, npx tsc --noEmit and npm run build clean.
