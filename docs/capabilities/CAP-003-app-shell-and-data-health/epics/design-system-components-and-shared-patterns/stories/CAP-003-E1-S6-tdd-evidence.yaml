      The review's 11 non-equivalent survivors, re-applied one at a time to the production files, each fail a new test: wrapper-no-class, wrapper-no-gap, reason-not-muted, reason-not-xs, date-shape-drop-caret, session message blank and off-by-one, count-message, count-isinteger, download-or and iso-drop-caret. 11 of 11 killed; the log lists each mutant and the failing test.
    green_evidence: >
      Against the unmutated code format.test.ts (40 tests) and presence.test.tsx (8 tests) pass; npm run test, npm run lint, npm run format, npx tsc --noEmit and npm run build are clean.
