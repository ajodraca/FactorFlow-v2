  - id: cycle-3
    tasks: [T002, T004, T005, T006, T007, T008, T012, T013]
    description: >
      The dialog, the CommandDialog prop and the scan widening (TC-COMP-062, TC-COMP-082, TC-COMP-083, TC-COMP-084, TC-COMP-085, TC-COMP-086, DAC-E3-11, DAC-E3-12, DAC-E3-S5-2 to DAC-E3-S5-6, AC-22, AC-24, AC-27, DEC-0330): index.tsx exports CommandPalette, a CommandDialog with filtering off around a body that mounts only while open, so the text and the universes read are per opening; Stocks, Universes (only while registered) and Pages in that order with separators between rendered groups, disabled hint, partial and error rows, CommandEmpty gated on a settled search, and the not-applicable record for the stale, unavailable and one-tier states. command.tsx gains the optional shouldFilter prop, forwarded to the inner Command and defaulting to cmdk's own. command-palette.test.tsx gains the rendering harness and the T002, T004, T005, T006 and T008 cases; token-literals.test.ts appends the palette directory to SCANNED_DIRECTORIES with the T007 cases. The generator produced 24 mutants (all in index.tsx; command.tsx produced none) and 19 were hand-written from the plan's kill list and the survivors of the first run; that run left six survivors (an empty Pages group left standing, a hint span rendered for a null hint or missing for a set one, a separator before the first group, and an undisabled universes error row), so five assertions were added and the run repeated: 43 mutants, 42 killed. The survivor judged equivalent: the page row's value written as its label rather than page: plus its route; page labels are unique and every other row's value is prefixed by its kind, so no two rows can collide. T014's planted-literal check was run on the real file system: 12px in a palette source failed token-literals naming the file, and passed again once the file was deleted. Both reviews approved with LOW observations only: for one commit after the text changes the previous search state is still paired with the new text, so a stale row or the empty state can flash before the hook reports loading (a follow-up for use-stock-search, which cycle 2 shipped); the not-applicable record is asserted as comment text; the group and separator assertions read cmdk's attribute names.
