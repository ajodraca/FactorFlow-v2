  - id: cycle-2
    tasks: [T007, T008, T010, T011, T012]
    description: >
      The on-demand aggregate hook (TC-COMP-064, DAC-E3-19, AC-28, DEC-0324, DEC-0325): useDataHealth() reads GET /api/data-health once on mount, once per retry() and once when two consecutive successful attention answers show latest_download going from requested, running or cancelling to one of the five outcomes; never on a timer. One read runs at a time, and any number of triggers during it add exactly one trailing read. The test file also holds the static check that only web/src/screens/data-health/ may import the hook, with its planted-record and non-vacuity cases. T011 (scope: the four files plus plan artifacts, every delivered file unchanged, the hook imported by no non-test file) and T012 (full Vitest suite 108 files and 2842 tests, biome lint and format, tsc --noEmit and the build all clean) join this cycle's validation. The first mutation run left two more survivors than now: an error-to-error read that must keep error.last, and a retry pending at unmount that must start no trailing read; both tests were added and the run repeated. Two survivors remain, both equivalent.
