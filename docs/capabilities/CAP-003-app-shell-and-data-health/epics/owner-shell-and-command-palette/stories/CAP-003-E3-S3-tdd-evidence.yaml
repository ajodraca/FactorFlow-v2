# TDD evidence for CAP-003-E3-S3 - ShellProvider, useShell and the On-Demand useDataHealth Hook.
# Each cycle is committed as it ends on the story branch; commit_hash: stage names the commit that added the cycle's entry.
# Reviews: one independent code-review subagent and one independent spec-drift subagent judged each cycle's patch.

cycles:
  - id: cycle-1
    tasks: [T001, T002, T003, T004, T005, T006, T009]
    description: >
      The provider (TC-COMP-073, 074, 075, 076, 059, DAC-E3-S3-1 to 4, DAC-E3-6, DAC-E3-18, AC-25, AC-28, AC-8): ShellProvider and useShell with exactly the five members, useTitleDetail on a second private context (DEC-0323), useShell throwing outside a provider (DEC-0326). Attention and summary are two usePolledRead reads whose intervals follow the other read's last success through refs: 60 s idle, 10 s while the download is requested, running or cancelling or the summary's later set is building, 60 s for a not-served summary. T001 case (d) resolves the summary first, because the plan's own cross-read note says one read's change reaches the other only when that other next settles; T001 case (c) puts the terminal answer at the 40 s read, equivalent for the 60 s return. The first spec-drift review found the summary half of case (c) too loose (a bound, not exact spacing); the test was tightened to exact 59 999 and 60 000 ms boundaries, the mutation run repeated and a fresh review pair judged the revised patch. 23 mutants (8 generated, 15 hand-written from the plan's kill lists) were all killed. The second code review left three low findings accepted as warnings: a cast in the SUMMARY_LATER_FAILED fixture, the terminal-return case relying on attention settling before the summary in one tick, and one test title that names only its first half.
