      survivors:
        - id: web/src/app/use-data-health.ts:46:negate-boolean:1
          disposition: equivalent
          reason: >
            mounted = useRef(true) instead of useRef(false). The mount effect sets mounted.current to true before any read it starts can settle, and the cleanup sets it false, so the initial value is never read.
        - id: web/src/app/use-data-health.ts:manual:unmounted-guard-off
          disposition: equivalent
          reason: >
            Removing the early return when the hook is unmounted. The only code it skips is setState, which React 18 drops silently on an unmounted component, and the rethrow of a rejection that is not ApiError or ApiUnreachableError, which cannot occur because requestJson rejects with only those two. The trailing-read guard in the finally block is separate and is killed by the pending-at-unmount test.
