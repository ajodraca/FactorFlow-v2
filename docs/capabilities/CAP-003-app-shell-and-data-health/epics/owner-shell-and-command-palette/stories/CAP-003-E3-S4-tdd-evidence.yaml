  - id: cycle-4
    tasks: [T001, T003, T004, T007, T009, T013, T014, T015, T016]
    description: >
      The route map and the interim compatibility (TC-COMP-056, 058, 079, DAC-E3-1, DAC-E3-4, DAC-E3-S4-3, AC-2, AC-17, AC-18, AC-27, DEC-0327, DEC-0328): routes.tsx is rewritten as owner-shell 2.6's map for what exists: ten lazy screens (CAP-002's five bindings and Route lines kept), one Suspense with the one shell skeleton as fallback, RootRedirect (skeleton until the first health answer, then replace to /setup or /home), the five delivered screens at /data/coverage, /data/followed, /data/downloads, /data/downloads/:runId and /settings, legacyRoutes and the NotFound catch-all. routes.test.tsx is rewritten whole with the shared harness (ten screen stubs recording loads, a gated run-detail stub, mocked fetchHealth, a location probe), keeping the DESTINATIONS and NotFound describes of cycles 2 and 3 and restoring, after the first review pair, the delivered TC-COMP-195 unreachable cases and the TC-COMP-193 Research-href case the rewrite had dropped. T014: shell.tsx's private rail changes three to values and one comment line; status-region.integration.test.tsx and shell.unreachable.test.tsx take findBy where a lazily loaded screen's text is read (the second was found by the first review pair as a flake, one run in four); copy.test.ts case (f) reads the declared paths from legacy-redirects.tsx too (DEC-0402). The RED run hangs at import against the delivered routes.tsx, because its static import of the gated run-detail module never resolves, so the log also holds the same file with the gate released at import: 15 of 30 cases fail on assertions. 13 hand-written mutants and one generated, all killed after a Suspense-fallback test was added for the one that first survived (fallback null). Full suite 110 files, 2893 tests, biome lint and format, tsc --noEmit and the build all clean, and the build splits the screens into separate chunks. Both reviews of the revised patch raised only LOW observations.
