  - id: cycle-3
    tasks: [T009, T010, T012, T013]
    description: >
      Test-only cycle. T009 appends the TC-COMP-054 cases to CAP-002-E1-S2's tests/unit/test_universe_sql_safety.py (one new import line and an appended block; no S2 line changed): the service's *_SQL constants including _INSERT_MEMBER_REMOVED_SQL pass the append-only and named-placeholder checks, rename/remove_member/retire hold no UPDATE/DELETE literal and pass execute only names or constants, the statements they execute are event INSERTs, and the scan fires on synthetic DELETE, f-string, .format and % sources. T010 adds the integration tests for the write lock (each operation waits on pg_locks), rename/create serialisation, rollback when the event INSERT fails, event order, remove_member's returned recorded_at, symbol normalisation and removal of a retired instrument's membership. Also re-checks the sole member after LastMember (cycle-2 review low finding). The full Validation Plan ran green before this cycle was fingerprinted.
