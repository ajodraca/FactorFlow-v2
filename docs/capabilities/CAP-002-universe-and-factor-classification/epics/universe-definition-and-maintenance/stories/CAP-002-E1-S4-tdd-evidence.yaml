  # Review-rework cycle against CAP-002-E1-S4-implementation-review-v1.md (CHANGES-REQUIRED). Tests only: no
  # production file changes, so the cycle's mutation run is the review's five surviving mutants, now killed. The
  # driver owns the commit; recorded against the staged tree on usr/alvaro-de-jodra/CAP-002-E1-S4 over d137e54.
  # No new decision was needed.
  - id: cycle-4
    tasks: [T003, T004, T007, T010, T013]
    description: >
      Rework of implementation review v1. IR-001 (HIGH): test_a_write_waiting_on_the_lock_checks_what_the_holder_committed,
      parametrised over remove_member, rename and retire, holds the write lock on a second session, waits until the
      write is a pg_locks waiter, then commits a change under the lock (remove AAA; retire; retire) and asserts the
      waiting write refuses on that committed state (LastMember; UniverseRetired; UniverseRetired, exact type), that the
      event log holds only the holder's event, and for remove_member that BBB is still a member. T010(a)'s docstring
      no longer claims to prove the lock is first; it points to the new test. IR-002 (HIGH):
      test_a_blank_rename_is_a_shape_failure_before_the_target_check and
      test_a_malformed_symbol_is_a_shape_failure_before_the_target_check, each over an unknown and a retired
      universe, expect exactly ValueError (not UniverseNotFound, not the ValueError subclass UniverseRetired) and no
      event written (design 2.4 step 2 before step 5). IR-003 (LOW, optional): reworded, not strengthened: a comment
      in TC-COMP-037's test now states that the creation-day as-of read is same-day, so it shows the replay still
      works after retire rather than a differing past membership, and that past-date replay is S2's
      test_universe_as_of.py; building a differing past date would need direct inserts, which the plan avoids.
      Production: unchanged (service.py byte-identical to HEAD).
    red_log: repos/factorflow-v2/FactorFlow-v2/docs/capabilities/CAP-002-universe-and-factor-classification/epics/universe-definition-and-maintenance/stories/CAP-002-E1-S4-evidence/red-cycle-4.log
