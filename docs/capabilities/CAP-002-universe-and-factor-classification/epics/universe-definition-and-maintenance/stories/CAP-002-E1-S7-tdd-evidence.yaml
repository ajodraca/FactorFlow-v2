# TDD evidence for CAP-002-E1-S7 - Universes list screen and create-by-hand dialog.
# Two cycles, grouping the plan's suggested T017 cycles by file: (1) the create dialog - T003, T004, T009 with
# T011's copy.ts strings and T013 (suggested cycles 1, 2 and the dialog half of 7); (2) the list screen, table and
# navigation - T005, T006, T007, T008, T010 with T012 and T014 (suggested cycles 3 to 6 and the list half of 7).
# The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's reviewed_patch is its
# own staged diff: cycle-1.patch is HEAD..index after cycle 1, cycle-2.patch the diff between the index trees after
# cycles 1 and 2, so the two apply in order onto the stage parent.
# Reviews: each cycle's patch was judged by an independent code-review subagent and an independent spec-drift
# subagent before the next cycle began; the verdicts below are the final reviews of the patches cited.
# Mutation: scripts/mutation-run.py with each cycle's focused suite (node_modules symlinked into each clone);
# generated operators plus hand-written mutants ("operator": "manual").
# Decisions applied: DEC-0101, DEC-0102, DEC-0103, DEC-0104, DEC-0108, DEC-0109, DEC-0145 (all owner-upheld) and
# DEC-0254 (recorded during this coding run, agent-decided, provisional).

