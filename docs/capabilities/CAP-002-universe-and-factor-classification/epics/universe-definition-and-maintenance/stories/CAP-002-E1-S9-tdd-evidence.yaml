# TDD evidence for CAP-002-E1-S9 - universe detail screen: summary header, rename, add stocks and retire.
# Four cycles, one per component file: (1) the retire dialog - T007, T008, T013; (2) the add stocks dialog -
# T004 to T006, T014 with their T011 strings; (3) the summary header - T002, T003, T012, T015 with theirs;
# (4) the detail screen - T009, T010, T016 with theirs. T001 (verification), T017 and T018 (integration and
# whole-suite validation) change no code; T019 is this file.
# The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's reviewed_patch
# is the diff between the trees before and after that cycle (a private index holding only that cycle's code
# files), so the four apply in order onto the stage parent (the frozen integration base fadf2c4).
# Reviews: each cycle's patch was judged by an independent code-review agent and an independent spec-drift
# agent (fresh `claude -p` processes restricted to Read, Grep and Glob) before the next cycle began; the
# verdicts below are the final rounds of the patches cited, earlier rounds' findings having been fixed with
# tests. Each round's transcript is kept beside this file (review-cycle-N-round-M-{code,drift}.log).
# Mutation: scripts/mutation-run.py with each cycle's focused suite (node_modules symlinked into each clone);
# generated operators plus hand-written mutants ("operator": "manual"). Every survivor is disposed of as
# equivalent with its reason; none by exception.
# Lint and format: `npm run lint` and `npm run format` also scan build/, the git-ignored output of an earlier
# `uv build` that predates this run (a minified bundle: 60 lint errors, and the formatter does not finish on
# it). The green logs therefore run the same Biome commands with the VCS ignore file honoured, which checks
# every tracked source.
# T017: (a) see cycle-4; (b) detail/index.tsx default-exports UniverseDetailScreen; (c) the change set is the four
# source and four test files under detail/, copy.ts (three Add stocks entries and the breadcrumb label, additive),
# the export keyword in universe-table.tsx, the story status, this plan's checkboxes, this file and its evidence
# folder; nothing under web/src/app or web/src/api, no CAP-001 file, members-tab.tsx and copy.test.ts untouched,
# and dependencies.yaml already lists CAP-002-E1-S7 for this story, so it is unchanged; (d) universes.test.tsx,
# create-dialog.test.tsx, results-table.test.tsx and filters-pane.test.tsx all ran (4 files, 189 tests passed).
# T018, on the final tree: npm run test 69 files, 1702 tests passed; npm run build succeeded; npx tsc --noEmit
# clean; biome lint and format clean over every tracked file (npm run lint/format themselves fail only on the
# git-ignored build/ bundle described above). The story changes no Python, and the Python commands were run for
# completeness: ruff check and ruff format --check clean; uv run pytest -m 'not postgres' 1497 passed, 1 xfailed,
# 4 failed, all in tests/unit/test_deploy_smoke.py on "OSError: [Errno 97] Address family not supported by
# protocol" from this sandbox's network stack (the postgres-marked tests need a container runtime, absent here).
# T001 findings: E4-S1 exports getUniverse(id, {asOf}), renameUniverse(id, name), addUniverseMembers(id,
# symbols) -> {added, alreadyMember} and retireUniverse(id) -> {lifecycle, retiredAt}; ClassificationApiError
# exposes code and symbols; origin.kind is by_hand | from_filter with thresholds keyed by query-parameter
# name. copy.ts already holds every retire string in UNIVERSE_LIFECYCLE, UNIVERSE_DETAIL's header labels,
# UNIVERSES.nameInUse (DEC-0109), DIALOGS.enterName (the shared empty-name key, DEC-0167/0169),
# UNIVERSES.enterAtLeastOne/tooMany, DIALOGS.added (the verbatim already-member clause) and
# SHELL_ROUTES.followedStocks. research-query.ts owns neither tab nor as_of and keeps unknown keys.
# MembersTab closes its Remove dialog before calling onRetire, so T017 needs no members-tab.tsx change.
# describeOrigin is file-local in universe-table.tsx and takes the snake_case filter_provenance shape.
# Decisions applied: DEC-0104, DEC-0108, DEC-0109, DEC-0145, DEC-0167, DEC-0169 (owner-upheld or
# agent-decided at planning); recorded during this coding run: DEC-0270 (the Add stocks test lists use the
