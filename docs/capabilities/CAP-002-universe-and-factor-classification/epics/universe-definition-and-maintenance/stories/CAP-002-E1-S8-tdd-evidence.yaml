# TDD evidence for CAP-002-E1-S8 - universe Members and History tabs, as-of view and remove dialog.
# Three cycles, one per component file: (1) the remove dialog and row action - T006, T007, T012 with their
# T010 strings; (2) the History tab - T008, T009, T013 with theirs; (3) the Members tab - T002 to T005, T011
# (a no-op: both seams were delivered) and T014 with theirs. T001 (verification), T015 and T016 (integration
# and whole-suite validation) change no code; T017 is this file.
# The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's reviewed_patch
# is the diff between the index trees before and after that cycle, so the three apply in order onto the stage
# parent (the frozen integration base).
# Reviews: each cycle's patch was judged by an independent code-review agent and an independent spec-drift
# agent (fresh `claude -p` processes restricted to read-only tools) before the next cycle began; the verdicts
# below are the final reviews of the patches cited, earlier rounds' findings having been fixed with tests.
# Mutation: scripts/mutation-run.py with each cycle's focused suite (node_modules symlinked into each clone);
# generated operators plus hand-written mutants ("operator": "manual"). Every survivor is disposed of as
# equivalent with its reason; none by exception.
# T001 findings: E4-S1 types members[].factors and members[].name as nullable (DEC-0097); format.ts has no
# Chicago calendar-date helper, so the tab uses Intl.DateTimeFormat("en-CA", America/Chicago) (DEC-0105);
# research-query.ts holds no as_of, which the host keeps (T014); FactorCell renders reasonCode retired as Not
# followed; FiltersPane has showLookIn and children and is its own <section aria-label="Filters">;
# ResultsTable has extraColumns with placement afterName and end, rows addressed as tr[data-symbol] with
# aria-rowindex, and leaves the heading to its host.
# Decisions applied: DEC-0097, DEC-0105, DEC-0106, DEC-0107, DEC-0145, DEC-0159 (all owner-upheld). No
# decision was recorded during this coding run.

