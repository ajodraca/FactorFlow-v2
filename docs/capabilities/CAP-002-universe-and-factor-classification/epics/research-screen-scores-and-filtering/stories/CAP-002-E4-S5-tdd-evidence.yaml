# TDD evidence for CAP-002-E4-S5 - Filters pane and threshold sentences.
# Three cycles, as the task plan's Other Notes lay out: (1) T007 then T008 (use-research-query.ts); (2) T001, T002,
# T005 then T009, T010 (threshold-sentence.tsx and the copy.ts additions); (3) T003, T004, T006 then T011
# (filters-pane.tsx). The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's
# reviewed_patch is its own staged diff: cycle-1.patch is HEAD..index after cycle 1, cycle-2.patch and cycle-3.patch
# are the diffs between the index trees after each cycle, so the three apply in order onto the stage parent.
# Reviews: each cycle's patch was judged by an independent code-review subagent and an independent spec-drift
# subagent before the next cycle began. The verdicts below are the final reviews of the patches cited.
# Mutation: scripts/mutation-run.py with each cycle's focused suite; generated operators plus hand-written mutants
# ("operator": "manual") where the operators find no line to mutate.
# Decisions applied: DEC-0156 (URL binding and pane props), DEC-0157 (commit points, field errors, accessible names,
# focus after Clear), DEC-0158 (Unavailable universe); all owner-upheld.

cycles:
  - id: cycle-1
    tasks: [T007, T008]
    description: >
      T007: the hook reads decodeResearchQuery of the location search; setQuery writes applyResearchQuery over the
      current params (unknown keys survive, defaults are not written) as one push, so back restores the earlier URL;
      an equal query causes no navigation; clear keeps sort and order; two same-tick writes are two pushes, each a
      full rewrite of the owned keys (react-router 6.26's functional setSearchParams receives the render snapshot,
      so the test states that rather than a composition); query identity is stable while the search is unchanged.
      Production: web/src/screens/research/use-research-query.ts (useResearchQuery; also exports the return shape
      as the interface ResearchQueryBinding, a typing idiom the spec-drift review judged not to be drift).
