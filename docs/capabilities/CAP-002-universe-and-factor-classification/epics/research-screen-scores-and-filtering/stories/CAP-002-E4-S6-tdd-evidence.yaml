# TDD evidence for CAP-002-E4-S6 - the virtualised results table with server-side sort and selection.
# Four cycles, as the task plan's Other Notes lay out: (1) T007 then T010 (results-window.ts, pure);
# (2) T005, T006 and the loading half of T008 then T009 and T011 (data, paging, windowing); (3) T001, T002,
# T003 and the header half of T008 then T012 (header and sort); (4) T004 and the remainder of T008 then T013
# (rows, selection, checking). T014 to T016 change no behaviour.
# The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's reviewed_patch is
# its own diff: cycle-1.patch is HEAD..index after cycle 1, and each later patch is the diff between the index
# trees written after each cycle (git write-tree), so the four apply in order onto the stage parent. The
# evidence logs and patches of earlier cycles appear in a later patch as added files; they are documentation.
# Reviews: each cycle's patch was judged by an independent code-review subagent and an independent spec-drift
# subagent before the next cycle began. The verdicts below are the final reviews of the patches cited.
# Mutation: scripts/mutation-run.py with each cycle's focused suite (vitest compiles with esbuild and does not
# type-check, so a mutant runs on its runtime behaviour). The operator catalogue derives negate-boolean and
# off-by-one mutants from TypeScript; JSX yields nothing, so hand-written mutants ("operator": "manual") cover
# each cycle's rendering and handlers.
# Decisions applied: DEC-0159 (props and empty-state shapes), DEC-0160 (windowing constants), DEC-0161 (sort
# controls, header sentence, checkbox name), DEC-0162 and DEC-0164 (onInspect debounce); all owner-upheld.
# Decisions recorded by this run are named in the cycle that applies them.

