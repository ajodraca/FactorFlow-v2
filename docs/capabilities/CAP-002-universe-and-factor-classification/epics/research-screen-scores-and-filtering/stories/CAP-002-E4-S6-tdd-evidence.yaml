      the floor within a row, the clamp at the first row, the bound end - start <= VIEWPORT_ROWS +
      2 * OVERSCAN_ROWS for 0, 1, 50 and 3000 loaded rows, the clamp beyond the end, negative and NaN scrollTop
      as 0, and all zeros for nothing loaded; scrollTopToReveal's three cases; needsNextPage's boundary, its
      missing cursor and its in-flight read. Production: web/src/screens/research/results-window.ts, no
      React and no import (DEC-0160).
