    green_evidence: >
      notices.test.tsx 10 and copy.test.ts 312 passed (green-cycle-1.log); tsc --noEmit, biome lint and biome format
      clean. The spec-drift review's first pass found the surface used bg-background where the toast spec names
      --popover; fixed with token-backed classes and re-reviewed (no drift). Code review LOWs: Esc-to-dismiss and the
