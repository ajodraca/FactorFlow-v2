        - id: manual:cycle-3:focus-follows-choice
          disposition: equivalent
          reason: >
            Adding isNew to the focus effect's dependencies re-runs it on a choice change, but the effect moves focus
            only while focus is on Cancel, and the choice changes only through the select, which holds focus at that
            moment; the list effect sets the first choice in the same batch as loaded. Judged equivalent by the
            independent code review.
        - id: manual:cycle-3:wrong-resource
          disposition: equivalent
          reason: >
            The resource argument is used only for a network failure, where failureSentence is called with code null;
            copy.ts returns the operation label plus FALLBACK_ERROR for a non-code and never reads the resource.
