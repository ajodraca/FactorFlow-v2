# TDD evidence for CAP-002-E4-S8 - Save-as-Universe and Add-to-Universe Dialogs.
# Three cycles, as the task plan's Other Notes lay out: (1) T009 then T010 (notices.tsx); (2) T001-T004, T006, T007
# then T011 (the empty-name string), T012 (dialog-frame.tsx) and T013 (save-as-universe-dialog.tsx); (3) T005, T008
# then T011 (the Universe label) and T014 (add-to-universe-dialog.tsx). T015 and T016 change no behaviour.
# The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's reviewed_patch is its
# own staged diff: cycle-1.patch is HEAD..index after cycle 1, cycle-2.patch and cycle-3.patch are the diffs between
# the index trees after each cycle (fingerprinted with check-tdd-evidence.py fingerprint --range), so the three apply
# in order onto the stage parent f4deee3.
# Reviews: each cycle's patch was judged by an independent code-review subagent and an independent spec-drift
# subagent before the next cycle began; findings were fixed, the patch regenerated and re-reviewed. The verdicts
# below are the final reviews of the patches cited.
# Mutation: scripts/mutation-run.py with each cycle's focused suite (the cycle's test file plus copy.test.ts);
# generated operators plus hand-written mutants ("operator": "manual") for layout, DOM order, design-named classes,
# focus, async guards and copy.
# Decisions applied: DEC-0167 (no name maximum, empty-after-trim is a field error), DEC-0168 (notices.tsx, dialog
# seams, no auto-dismiss), DEC-0169 (Add defaults, list bound, New universe route, the one empty-name key); all
# owner-upheld. No new decision was recorded.

cycles:
  - id: cycle-1
    tasks: [T009, T010]
    description: >
      T009: notices.test.tsx through a local host calling useNotices once and rendering NoticeRegion once: a polite,
      non-atomic status region (an output, tabindex -1) present and empty before any notice; one success item per
      notice with a router link when `to` is given and plain text otherwise; messages rendered as text, never markup;
      arrival order; Dismiss removes only its item (distinct ids for duplicate messages) and returns focus to the
      region; nothing removed after 5 minutes of fake time; a notice raised by an unmounted component's callback still
      shows; the toast tokens (--popover surface and text, --status-good accent, --radius) and the 24px dismiss target
      (min-h-5/min-w-5 = --space-5) pinned; universePath encodes the id. Production: web/src/screens/research/
      notices.tsx (Notice, HeldNotice, NoticesBinding, universePath, useNotices, NoticeRegion) and copy.ts
      NOTICES.dismiss with its copy.test.ts anchor. Deviation from T010's wording: the region is an output (implicit
      status role; biome rejects div role=status and the repo's status regions use output), so the items are spans.
    red_log: repos/factorflow-v2/FactorFlow-v2/docs/capabilities/CAP-002-universe-and-factor-classification/epics/research-screen-scores-and-filtering/stories/CAP-002-E4-S8-evidence/red-cycle-1.log
