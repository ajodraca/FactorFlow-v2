# TDD evidence for CAP-002-E4-S2 - URL query model, display formatting and the owner-facing copy catalogue.
# Three cycles, as the task plan's Other Notes lay out: (1) T001, T005 then T008 (format.ts); (2) T002, T003,
# T006 then T009, T010 (research-query.ts); (3) T004, T007 then T011, T012 (copy.ts).
# The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's reviewed_patch is
# its own diff: cycle-1.patch is HEAD..index after cycle 1, cycle-2.patch and cycle-3.patch are the diffs between
# the index trees written after each cycle (git write-tree), so the three apply in order onto the stage parent.
# Reviews: each cycle's patch was judged by an independent code-review subagent and an independent spec-drift
# subagent before the next cycle began. Cycle 2 was reworked after its first spec-drift review (SORT_KEYS was an
# export the plan does not list; now module-private) and re-reviewed; cycle 3 was reworked after its first code
# review (failureSentence read an Error's own `name` as the universe name; now `universeName`) and first
# spec-drift review (classification_set_changed reworded the design's sentence; now verbatim), then re-reviewed.
# The verdicts below are the final reviews of the patches cited.
# Mutation: scripts/mutation-run.py with each cycle's focused suite (vitest compiles with esbuild and does not
# type-check, so a mutant runs on its runtime behaviour); generated operators plus hand-written mutants
# ("operator": "manual").
# Decisions applied: DEC-0145 (UNIVERSE_LIFECYCLE allow-list), DEC-0146 (bare-score rule), DEC-0147 (format.ts
# conventions), DEC-0148 (URL codec conventions, with its 2026-10-18 amendment), DEC-0149 (operation and resource
# labels); all owner-upheld. No new decision was recorded.

