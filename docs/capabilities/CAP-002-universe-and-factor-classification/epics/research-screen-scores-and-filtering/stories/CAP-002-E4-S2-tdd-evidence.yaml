      TC-COMP-071 and the T005 edge cases: standardised score signed at two decimals with an ASCII hyphen-minus
      and zero unsigned, percentile whole, ratio two decimals, rate fraction times 100 signed with %, amount
      whole units with comma separators, half-away-from-zero rounding on the decimal string, RangeError on
      non-decimal input, America/Chicago timestamps with CDT/CST as the instant falls (minutes, or seconds on
      request; midnight 00; the autumn change; independent of the machine TZ), dates passed through after a shape
      check. Production: web/src/screens/research/format.ts. Deviation from T008's wording: hourCycle "h23"
      replaces the 24-to-00 mapping, with the same pinned output on every engine.
