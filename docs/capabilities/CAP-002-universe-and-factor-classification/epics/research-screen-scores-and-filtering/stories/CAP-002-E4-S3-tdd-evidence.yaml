# TDD evidence for CAP-002-E4-S3 - the factor cell and the Possibly restated mark patterns.
# Two cycles, as the task plan's Other Notes lay out: (1) T003 then T010 (restated-mark.tsx); (2) T001, T002,
# T004 to T008 then T009 and T011 (factor-cell.tsx, plus the copy.ts strings T009 adds).
# The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's reviewed_patch is
# its own diff: cycle-1.patch is HEAD..index after cycle 1, cycle-2.patch is the diff between the index trees
# written after each cycle (git write-tree), so the two apply in order onto the stage parent.
# Reviews: each cycle's patch was judged by an independent code-review subagent and an independent spec-drift
# subagent before the next cycle began. The verdicts below are the final reviews of the patches cited.
# Mutation: scripts/mutation-run.py with each cycle's focused suite (vitest compiles with esbuild and does not
# type-check, so a mutant runs on its runtime behaviour). The operator catalogue derives nothing from JSX, so
# every mutant is hand-written ("operator": "manual") against the cycle's changed lines.
# Decisions applied: DEC-0075 (the mark as a composition), DEC-0150 (props, showScore, momentum guard),
# DEC-0151 (Incomplete title sentence and state-selection order), DEC-0152 (Not followed without a date); all
# owner-upheld. Decisions recorded by this run are named in the cycle that applies them.

