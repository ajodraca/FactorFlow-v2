# TDD evidence for CAP-002-E4-S7 - Selection tray and inspector panel.
# Three cycles, as the task plan's Other Notes lay out, with two recorded adjustments: all of T008 (failure, retry,
# stale reads, unmount) runs in cycle 2 rather than half of it, because T011 implements that logic and its mutants
# would otherwise go unscored; and T003's "each input with as_of and known_on" assertion runs in cycle 3, with the
# rendering it needs (T012). T013 and T014 change no behaviour and were run inside cycle 3 before its review.
# The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's reviewed_patch is its
# own staged diff: cycle-1.patch is HEAD..index after cycle 1, cycle-2.patch and cycle-3.patch are the diffs between
# the index trees after each cycle (2d54764..dfbd684, dfbd684..47b1340), so the three apply in order onto the stage
# parent.
# Reviews: each cycle's patch was judged by an independent code-review subagent and an independent spec-drift
# subagent before the next cycle began; the verdicts below are the final reviews of the patches cited.
# Mutation: scripts/mutation-run.py with each cycle's focused suite (each clone links the main checkout's
# node_modules); generated operators plus hand-written mutants ("operator": "manual") for the JSX the operators do
# not reach.
# Decisions applied: DEC-0070, DEC-0163, DEC-0164, DEC-0165, DEC-0166 (owner-upheld), DEC-0151, DEC-0152, DEC-0229;
# recorded in this run: DEC-0247 (PROVISIONAL, the explanation box's sentences).

