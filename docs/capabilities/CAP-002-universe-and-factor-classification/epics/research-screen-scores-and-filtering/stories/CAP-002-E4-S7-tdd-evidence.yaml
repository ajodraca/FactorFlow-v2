        - id: web/src/components/patterns/inspector-panel.tsx:62:off-by-one:1
          disposition: equivalent
          reason: >
            The mutant starts the retry counter at 1 instead of 0. `attempt` is read only as an effect dependency,
            whose contract is to change on every Try again so the read re-runs; its starting value is never
            rendered, compared or sent, so no input distinguishes the two.
