  - id: cycle-5
    tasks: [T008, T011]
    description: >
      Rework of implementation review v2. IR-001: a settled read now carries the (symbol, attempt) it was issued for,
      and the panel renders a loaded or failed state only while that key is still the current one; otherwise it shows
      the skeleton, or the empty sentence when the selection is null. A read for a stock that is no longer selected is
      therefore never shown, even when it settles between the new selection's commit and the previous effect's
      cleanup, before the cancelled flag flips. The cancelled flag and the render-phase reset stay as they were. The
      effect now reads attempt, so its biome-ignore suppression is removed. Four new T008 tests drive that gap without
      act(): a concurrent root with real timers, the selection moved in a transition, and a sibling layout effect that
      settles AAPL's read during the new commit and holds the commit past the scheduler's 5 ms frame. They cover a
      stale success and a stale failure under MSFT, a stale success after the selection is cleared, and MSFT's own read
      still rendering afterwards. A transition is used because jsdom leaves window.event set to an earlier test's
      click, which would put a plain root.render on the discrete lane, where passive effects flush synchronously and
      the gap closes. IR-003: the explanation box's rounded class is asserted. IR-002 and IR-004: no change (see the
      comment above).
