      aria-describedby and no navigation on click, Enter or Space at 1, 7 and 8 checked; a link to
      /research/compare?symbols= with the checked symbols at 2, 3 and 6) and the T002 tray behaviour (nothing at 0
      checked; a region named Selection on bg-foreground text-background; a polite live count updated in place;
