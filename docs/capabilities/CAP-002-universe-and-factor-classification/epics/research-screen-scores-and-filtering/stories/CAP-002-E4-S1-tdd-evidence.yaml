# TDD evidence for CAP-002-E4-S1 - Classification fetch layer, response types and the requestJson export.
# Three cycles, as the task plan's Other Notes lay out: (1) T001 then T008; (2) T002, T004, T005, T006 then
# T009 and T011 (success path, `request` only delegating); (3) T003, T007 then T010 (ClassificationApiError).
# The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's reviewed_patch is
# its own diff: cycle-1.patch is HEAD..index after cycle 1, cycle-2.patch and cycle-3.patch are the diffs between
# the index trees written after each cycle (git write-tree), so the three apply in order onto the stage parent.
# Reviews: each cycle's staged diff was judged by an independent code-review subagent and an independent
# spec-drift subagent before the next cycle began. Cycle 3 was re-fingerprinted, re-mutated and re-reviewed
# after the first code review's non-blocking note (restoration asserted before the call settles) was applied.
# Mutation: scripts/mutation-run.py with the focused suite (vitest compiles with esbuild and does not type-check,
# so a mutant runs on its runtime behaviour); generated operators plus hand-written mutants ("operator": "manual").
# Decisions applied: DEC-0064 and DEC-0086 (the export), DEC-0097 (null member factors and name), DEC-0140
# (evidence factors may be {}), DEC-0143 (operation, reason, resource normalisation, fetch capture), DEC-0144
# (repeated symbols key, pass-through values). No new decision was recorded.

cycles:
  - id: cycle-1
    tasks: [T001, T008]
    description: >
      TC-COMP-130: classification-client.test.ts imports requestJson from ./client and asserts it is a function,
      returns a 200 JSON body unchanged, rejects a 404 envelope with ApiError carrying code and requestId, and
      rejects a failed fetch with ApiUnreachableError. Production: the `export` keyword on requestJson in
      web/src/api/client.ts, nothing else (git diff --numstat 1 1).
