# TDD evidence for CAP-002-E4-S4 - Not-current banner, as-of line and the score-set poll with refresh-once.
# Three cycles, as the task plan's Other Notes lay out: (1) T001, T002, T007 then T010 (one copy.ts string) and
# T011 (not-current-banner.tsx); (2) T003, T004, T008 then T012 (as-of-line.tsx); (3) T005, T006, T009 then T013
# (use-score-set-poll.ts).
# The driver commits once per stage, so every cycle's commit_hash is `stage` and each cycle's reviewed_patch is
# its own diff: cycle-1.patch is HEAD..index after cycle 1, cycle-2.patch and cycle-3.patch are the diffs between
# the index trees written after each cycle (git write-tree), so the three apply in order onto the stage parent.
# Reviews: each cycle's patch was judged by an independent code-review subagent and an independent spec-drift
# subagent before the next cycle began; the verdicts below are those reviews of the patches cited.
# Mutation: scripts/mutation-run.py with each cycle's focused suite (vitest compiles with esbuild and does not
# type-check, so a mutant runs on its runtime behaviour); generated operators plus hand-written mutants
# ("operator": "manual"), listed in each cycle's mutants-cycle-N.json.
# Decisions applied: DEC-0153 (hook interface and new-set trigger), DEC-0154 (banner and line props), DEC-0155
# (a failed poll stops polling until Try again), all owner-upheld; DEC-0232 (PROVISIONAL, agent, this run): the
# banner's clause for a failed set that recorded no reason, and the start time named when its end time is null.
# Rework: rework-1 is the review-rework cycle against CAP-002-E4-S4-implementation-review-v1.md (CHANGES-REQUIRED,
# IR-001 to IR-008), staged on top of the stage commit 58fc558 and the review commit 00c22fd; its reviewed_patch is
# HEAD..index. DEC-0233 (PROVISIONAL, agent, this run): exactly one further summary read after the shell's health
# reports the download terminal, never an open-ended poll for the ended download's set.
# Rework 2: rework-2 is the review-rework cycle against CAP-002-E4-S4-implementation-review-v2.md (CHANGES-REQUIRED,
# IR-001 to IR-004), staged on the merge of origin/main into the story branch (db9b691); its reviewed_patch is HEAD..index.
# It is test-only. It supersedes rework-1's disposition of manual:rework-1:line-height-value-changed-on-both as equivalent:
# that claim was wrong (min-height is a floor, so a floor below the one-row line's content height leaves the skeleton
# shorter than the line), and the token's value is now pinned. DEC-0238 (PROVISIONAL, agent, this run): DEC-0233's timing
# guarantee corrected, both handoff exposures handed to the owner, the polling rule unchanged until the owner answers.

