# TDD evidence for CAP-002-E5-S1 - Comparison Table Pattern and Compare Screen.
# Two cycles: (1) the ComparisonTable pattern and the compare strings (T001, T002, T003, T005 to T007, T011);
# (2) the CompareScreen (T004, T008 to T010, T012). T013 and T014 change no behaviour. The driver commits once per
# stage, so every cycle's commit_hash is `stage`; each cycle's reviewed_patch is its own diff (cycle-1.patch is
# HEAD..tree after cycle 1, cycle-2.patch the diff between the trees after each cycle, fingerprinted with
# check-tdd-evidence.py fingerprint --range), so the two apply in order onto the stage parent 543198f.
# Reviews: each cycle's final patch was judged by an independent code-review subagent and an independent spec-drift
# subagent after the last code change; earlier rounds' findings were fixed and the patches regenerated and re-reviewed.
# Mutation: scripts/mutation-run.py with each cycle's focused suite, generated operators only.
# Decisions applied: DEC-0175 to DEC-0177 (owner-provisional); no new decision was recorded.

