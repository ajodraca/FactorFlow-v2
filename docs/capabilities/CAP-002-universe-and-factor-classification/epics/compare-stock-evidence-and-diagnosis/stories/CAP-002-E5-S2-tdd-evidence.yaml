# TDD evidence for CAP-002-E5-S2 - Stock History Tab: Earlier Scores as Recorded.
# Two cycles: (1) T002, T003, T004, T005, T008 and the symbol-change part of T006 (the table, rows as recorded, the
# restatement mark and sentence, the empty statement, the strings); (2) T006 (Show more) and T007 (skeleton, failure
# sentences, Try again, unreachable renders nothing) plus the late test gaps the cycle-1 reviews listed. T001 and T009
# change no behaviour; T010 is a review whose findings are covered by the tests (the delivered a11y tests use no axe
# assertion, so none was added).
# The driver commits once per stage, so every cycle's commit_hash is `stage`. cycle-1.patch is HEAD..index after
# cycle 1; cycle-2.patch is the diff between the index trees after cycle 1 and after cycle 2
# (check-tdd-evidence.py fingerprint --range), so the two apply in order onto the stage parent 543198f.
# Reviews: each cycle's patch was judged by an independent code-review subagent and an independent spec-drift subagent
# before the next cycle began. Cycle 1: first code review REJECTED (restatement-sentence condition untested), fixed and
# re-reviewed APPROVED; spec drift none. Cycle 2: first code review REJECTED (first-read failure race untested) and
# spec drift found four drifts, all fixed and re-reviewed (APPROVED, no drift). The verdicts below are the final reviews.
# Mutation: scripts/mutation-run.py with the focused suite, generated operators plus hand-written mutants
# ("operator": "manual"). The runner needs node_modules in each clone, so the command links it.
# Decisions applied: DEC-0178 to DEC-0180 (owner-provisional); DEC-0278 recorded for the local state union.

