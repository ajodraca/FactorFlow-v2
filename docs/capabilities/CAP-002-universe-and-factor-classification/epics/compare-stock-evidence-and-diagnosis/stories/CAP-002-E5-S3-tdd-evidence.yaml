# TDD evidence for CAP-002-E5-S3 - Stock Evidence Screen with Factor Cards and Three-Part Insufficient-Evidence Statements.
# Two cycles: (1) T002, T003, T005, T006, T007, T010 (strings, FactorCard: statements, input list, card states);
# (2) T004, T008, T009, T011, T013 (StockEvidenceScreen: header, memberships, tabs, states, page-level sentences).
# T001 (gate), T012 (integration check), T014 (a11y/token review) and T015 change no behaviour of their own.
# The driver commits once per stage, so every cycle's commit_hash is `stage`. cycle-1.patch is HEAD..index after
# cycle 1; cycle-2.patch is the diff between the index trees after cycle 1 (67373dda) and after cycle 2 (0615e8e1)
# (check-tdd-evidence.py fingerprint --range), so the two apply in order onto the stage parent 6e7b8b0.
# Reviews: each cycle's patch was judged by an independent code-review subagent and an independent spec-drift subagent
# before the next cycle began. Cycle 1: code review APPROVED with untested-guard findings (all fixed with tests) and
# spec drift on two unspecified strings (recorded as DEC-0279) and a comment, re-reviewed APPROVED with no drift.
# Cycle 2: code review APPROVED; spec drift on a literal aria-label (fixed), re-reviewed APPROVED with no drift.
# Mutation: scripts/mutation-run.py with the focused suite. The runner needs node_modules in each clone, so the
# command links it.
# Decisions applied: DEC-0181 to DEC-0186 (owner-provisional); DEC-0279 and DEC-0280 recorded here.

