      factor_classification access in the history plan carries an Index Cond naming instrument_id. The first code review
      round noted, non-blocking, that the first layout of the same-day test left a started_at order and a set_id ASC order
      to chance; the layout was changed, re-fingerprinted, re-mutated (two more manual mutants) and re-reviewed.
