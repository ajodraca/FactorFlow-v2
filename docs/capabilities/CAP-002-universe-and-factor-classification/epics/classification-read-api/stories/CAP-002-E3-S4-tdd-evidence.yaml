# TDD evidence for CAP-002-E3-S4 - Stock history, set list and single-set reads with the 3000-stock volume test.
# One cycle: the plan writes every test first (Phase 2, T003-T011, on the T002 seed helpers), then the two statements,
# the row models and the three reads (Phase 3, T012-T016), so there is a single RED and a single GREEN. The story is
# committed once on its stage branch: commit_hash is stage.
# Decisions: this stage recorded DEC-0264 (the postgres-marked tests run against a local PostgreSQL 16.15 server
# substituted for the testcontainers container by an out-of-repository pytest plugin, Docker being absent) and
# DEC-0265 (PROVISIONAL: SetRow.factors is {} for a set with no classification_set_factor row, as the engine leaves
# every building and failed set). It applied the plan-time DEC-0132, DEC-0135, DEC-0136 and DEC-0137.
# Reviews: one independent code-review session and one independent spec-drift session (fresh `claude -p` sessions,
# read-only tools, no history) judged cycle-1.patch, the staged diff the fingerprint hashes: APPROVED and
# drift_detected false, with NON-BLOCKING notes only (the two-statement read window shared with stock_evidence; a
# partial set of factor rows the engine never writes; the existing runs.queries cursor accepting a naive timestamp).
# TC-COMP-153 passed in the RED run: it exercises the CAP-002-E3-S2 list, count and sorts at volume, which exist; the
# volume extras (T009) failed there on the missing history and sets reads.

cycles:
  - id: cycle-1
    tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019, T020]
    description: >
      src/factorflow/classification/reader.py (stock_history, list_sets, get_set, HistoryRow, SetRow, SetNotFound,
      _check_limit, _decode_page_cursor, _run_sets, _row_to_set, HISTORY_SQL and SETS_SQL, and the rename-only
      extraction of _factor_summaries from _row_to_current), sql/stock_history.sql and sql/sets.sql. Tests:
      tests/integration/reader_seed.py (bulk_seed_scored_stocks, analyze_classification_tables),
      tests/integration/test_reader_history.py (TC-COMP-150, 151, 152 and the history, sets and get_set details),
      tests/integration/test_reader_volume.py (TC-COMP-153 and the volume extras, postgres and slow),
      tests/unit/test_reader_paging.py and the T011 extension of test_reader_sql_read_only.py. The first mutation run
      left the frozen-model, exact-limit-page and three-way ended_at tie mutants alive; tests were added for each and
      the rerun left only the 13 equivalent survivors below. Five mutants that make paging never end (an inclusive or
      ignored keyset) hang the paging loops and are recorded as timeouts.
