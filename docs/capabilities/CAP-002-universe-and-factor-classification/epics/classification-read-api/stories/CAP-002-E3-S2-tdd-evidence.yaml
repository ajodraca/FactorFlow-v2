# TDD evidence for CAP-002-E3-S2 - Classification list read and the single evaluate_filter predicate.
# One cycle: the plan writes every test first (Phase 2, T002-T016), then the models, cursor, two statements and the
# two reads (Phase 3, T017-T020), so there is a single RED and a single GREEN. The driver commits once per stage:
# commit_hash is stage.
# Decisions recorded by this stage: DEC-0245 (PROVISIONAL: StockRow.name is the latest instrument_reference
# company_name, None when none; the design's i.name has no column) and DEC-0246 (the cursor carries a payload check,
# so an altered cursor is refused, as DAC-E3-S2-5 and T004 require). Plan-time DEC-0127, DEC-0128 (PROVISIONAL,
# pinned by test_retired_universe_is_still_a_scope) and DEC-0129 are implemented as the plan records them.
# Reviews: one independent code-review session and one independent spec-drift session (fresh claude -p sessions
# with read-only tools) judged cycle-1.patch, the staged diff the fingerprint hashes: APPROVED and drift_detected
# false (code-review-cycle-1.txt, spec-drift-cycle-1.txt). Their non-blocking notes asked for no change here: compare
# (CAP-002-E3-S3) must widen the scope's active-only rule when symbols is set (DAC-E3-5); Thresholds.bounds is a dict
# inside a frozen dataclass; DEC-0245 awaits the owner; the final SELECT uses a plain LEFT JOIN where the plan wrote
# LEFT JOIN LATERAL, identical because the subquery references no outer column.

cycles:
  - id: cycle-1
    tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019, T020, T021, T022, T023]
    description: >
      src/factorflow/classification/reader.py (INPUT_REASONS, SORT_ALLOWLIST, resolve_sort, escape_like,
      UniverseNotFound, CursorError re-exported from runs/queries.py, Thresholds, FactorCell, StockRow, ListFilters,
      ClassificationPage, encode_cursor/decode_cursor, list_classifications, evaluate_filter), sql/list_classifications.sql
      (scope and matched CTEs, twelve guarded bounds, hide_incomplete over the input reasons, a one-row count joined to
      the keyset page) and sql/universe_exists.sql. A universe scope runs the imported MEMBERSHIP_AS_OF_SQL (the name
      the plan expected) with today in America/Chicago. Tests: tests/integration/reader_seed.py (insert_classification,
      insert_reference, insert_universe, add_member, remove_member, retire_universe, seed_scored_stock),
      tests/integration/test_reader_list.py (TC-COMP-096, 108, 112, 120, 122, 189 and the T012-T015 cases),
      tests/unit/test_reader_sort_allowlist.py and test_reader_cursor.py (TC-COMP-121), test_reader_filters.py
      (TC-COMP-122 model half, the import-order guard) and the T016 extension of test_reader_sql_read_only.py. The
      first mutation run left 31 survivors; tests were added for the inclusive momentum bounds, a full last page,
      ListFilters.symbols, UniverseNotFound.universe_id, frozen models, the check's length and field-order
      independence, and the rerun left only the 15 equivalent survivors below.
