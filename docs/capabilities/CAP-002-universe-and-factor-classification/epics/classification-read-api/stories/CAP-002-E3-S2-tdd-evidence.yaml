  - id: rework-1
    tasks: [T008, T009, T011, T014, T018, T020]
    description: >
      Review rework against CAP-002-E3-S2-implementation-review-v1.md (CHANGES-REQUIRED), one cycle for its six
      findings; the 11 non-equivalent survivors of its mutation run are re-run here. IR-001 (HIGH):
      test_value_and_growth_marks_are_each_their_own_cell seeds a value-only and a growth-only restated stock, so
      neither mark can be read from the other factor's row. IR-002 (HIGH):
      test_value_and_growth_input_reason_cells_carry_their_own_input_and_detail asserts reason_code, reason_input
      and reason_detail on a value (book_to_price) and a growth (revenue_growth) input-reason cell of one stock.
      IR-003 (HIGH): test_universe_scope_replays_membership_at_today_in_chicago fixes the reader's clock (a datetime
      subclass patched over reader.datetime) at 00:30 and at 23:30 CDT on 15 October, with one member recorded on
      that Chicago date and one on the next; reader_seed.add_member gains a keyword-only recorded_on whose default
      is the column's own. IR-004 (MEDIUM): test_a_missing_factor_row_is_a_data_integrity_error seeds a stock with
      no value row and expects ValueError with no bound and with a bound on value (Open Gap 7, DEC-0129). IR-005
      (LOW): _parse_cursor refuses, with CursorError, a factor-sort key at or beyond what its column holds (score
      numeric(18,6), magnitude below 10^12; percentile numeric(9,6), below 10^3) or finer than six decimal places,
      and returns the key quantized to six places, so a re-encoded 0E-200000 binds as 0.000000 (the second code
      review's note); cursors the reader issues carry stored values and are unaffected. IR-006 (LOW): the TC-COMP-122
      test now seeds an input-reason member (INC) in the universe, so its docstring holds; counts 3 to 4.
