# TDD evidence for CAP-002-E3-S1 - Reader foundation: current set, later attempt and summary.
# One cycle: the plan writes every test first (Phase 2, T002-T012), then the two statements and the module (Phase 3,
# T013-T016), so there is a single RED and a single GREEN. The driver commits once per stage: commit_hash is stage.
# Decisions: none recorded by this stage. Open Gap 1 (which set is later while none is complete) stays PROVISIONAL as
# the plan records it, pinned by T011.
# Reviews: one independent code-review subagent and one independent spec-drift subagent judged cycle-1.patch (the
# staged diff the fingerprint hashes): APPROVED and drift_detected false. Their non-blocking notes (the RuntimeError
# guard in summary() could be an assert; the read-only test's import spelling; LaterSet's docstring follows Open Gap 1)
# asked for no change.
# cycle-2 is the rework of implementation review v1 (IR-001, IR-002, IR-003): tests only, no production change.

cycles:
  - id: cycle-1
    tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017]
    description: >
      src/factorflow/classification/reader.py (LaterSet, FactorSummary, CurrentSet, StocksCurrent, Summary,
      read_set_blocks, current_set, summary; FACTORS and MIN_PEER_SET_SIZE re-exported from constants.py),
      sql/current_set.sql (design 2.4 with the elided select list closed per T013) and sql/summary.sql (design 2.4
      verbatim). Tests: tests/integration/reader_seed.py (seeding helpers), test_reader_current_set.py (TC-COMP-170,
      171, 181, the T009 edge cases, the T011 PROVISIONAL pin, and a frozen-blocks check), test_reader_summary.py
      (TC-COMP-103, 104, 178 and the T010 shape cases) and tests/unit/test_reader_sql_read_only.py (T012). The first
      mutation run left two non-equivalent survivors (summary.sql reading every set's inputs; ranked derived from the
      qualified count); the tests were strengthened (the building set's leaked stock is now all present, and
      TC-COMP-178 stores momentum 33 qualified yet unranked) and the rerun killed both. A one-row assertion and the
      frozen-blocks test were added before that rerun to kill LIMIT 2 and frozen=False mutants.
    red_log: repos/factorflow-v2/FactorFlow-v2/docs/capabilities/CAP-002-universe-and-factor-classification/epics/classification-read-api/stories/CAP-002-E3-S1-evidence/red-cycle-1.log
