  - id: cycle-2
    tasks: [T003, T004, T009]
    description: >
      Review rework for implementation review v1. Tests only; no production file changes, as the report's Follow-Up
      directs. All in tests/integration/test_reader_current_set.py. IR-001 (HIGH): TC-COMP-170 asserts
      later.started_at equal to the building set's own start (run start + 1h, distinct from the run's start and the
      current set's start); TC-COMP-171 asserts it in both the building and failed cases (set start T0 + 1h, run
      start T0, no current set). IR-002 (HIGH): TC-COMP-170's building set now carries its own factor rows
      (3/False, 4/False, 50/True) and the test asserts the complete set's factors exactly through read_set_blocks
      and summary; the new T009 case below asserts them too while another complete set holds different rows, and
      inserts that other set first, the reverse of TC-COMP-170, so a factors subquery merging every set's rows
      fails one of the two tests whichever duplicate key jsonb_object_agg keeps. IR-003 (HIGH): two T009 cases,
      test_current_is_chosen_by_ended_at_where_started_at_orders_otherwise (A starts first and ends last, B inside
      A's window; A is current through current_set and summary) and test_set_started_while_current_was_building_is_later
      (a building set started after the current set's started_at but before its ended_at is later, not_current
      true). The first leaves later and not_current unasserted: a complete set started after the current one cannot
      exist by construction (design 2.4), and the docstring says so.
    red_log: repos/factorflow-v2/FactorFlow-v2/docs/capabilities/CAP-002-universe-and-factor-classification/epics/classification-read-api/stories/CAP-002-E3-S1-evidence/red-cycle-2-rework.log
    red_log_sha256: 13963cb00951d8e7985b5d1e3e9daae33520d0a422d5f71edf473d521b394732
    red_evidence: >
      The five non-equivalent survivors of review v1 (mutants-cycle-2.json: the reviewer's ids and old/new text) were
      first reproduced as survivors of the cycle-1 tests, with HEAD's test_reader_current_set.py restored in each
      clone: 36 passed under each mutant (5 of 5 survived). Then the cycle-2 tests ran under one mutant at a time:
      review:current-by-started-at fails the ended_at case (1 failed); review:factors-any-set fails TC-COMP-170
      (1 failed); review:later-after-current-end fails the started-while-building case (1 failed);
      review:later-started-is-run-started and review:later-started-sql-is-current each fail TC-COMP-170, both
      TC-COMP-171 cases and the started-while-building case (4 failed). Unmutated, 38 passed in each of five
      baselines. The factors-any-set kill relies on PostgreSQL reading a small fresh table in insertion order and
      jsonb keeping the last duplicate key; the two tests' opposite insertion orders cover either outcome.
    green_evidence: >
      The four focused files, as the review ran them: 38 passed in each of the five mutation baselines
      (mutation-cycle-2-results.json). On 1cc28d8 plus the staged cycle-2 tree, the full Python suite gave
      1640 passed, 1 xfailed (full-suite-cycle-2.log under logs). ruff check, ruff format --check and mypy src are
      clean, and strict mypy is clean over the changed test file. Reviews: an independent code-review session and an
      independent spec-drift session (fresh claude -p sessions with read-only tools) judged cycle-2.patch:
      APPROVED, drift_detected false. A first pass over an earlier draft asked for a docstring note that the
      reversed-key state cannot occur by construction; that note and the reversed insertion order were added and the
      final patch re-reviewed. Non-blocking notes recorded here: the factors-any-set kill depends on scan order (see
      red_evidence); the new started-while-building case checks read_set_blocks but not summary, which the other
      tests already prove agree.
