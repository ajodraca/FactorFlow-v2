# story branch; the router, the models and the mount then made them pass. commit_hash is stage.
# Decision: DEC-0281 (three plan statements corrected to the delivered code).
# Cycle-1 note (superseded by cycle-2): the postgres integration files were written without being run; the claim that Docker
# is absent held only inside the sandbox. Cycle-2 ran them against postgres:16 outside it.
# The three unit packaging tests (test_release_excludes_test_paths, test_distribution_contents) cannot run in the
# sandbox: uv cannot open its cache.
# Review notes: reviews were run on the unit and integration files together; both APPROVED with non-blocking notes.

