# TDD evidence for CAP-002-E3-S3 - Compare, stock evidence and stock memberships reads.
# One cycle: the plan writes every test first (Phase 2, T003-T012), then the scope clause, two statements, models and
# three reads (Phase 3, T013-T018), so there is a single RED and a single GREEN. The driver commits once per stage:
# commit_hash is stage.
# Decisions: this stage recorded none. It applied the plan-time DEC-0127 (compare bound on ListFilters.symbols),
# DEC-0130 (INPUT_LABELS from constants), DEC-0131 (PROVISIONAL: no row in the current set is reported, not invented),
# DEC-0132 (symbol normalisation and shape), DEC-0133 (compare also reads a retired stock) and DEC-0134 (memberships
# statement with a total order), as the plan records them.
# Reviews: one independent code-review session and one independent spec-drift session (fresh subagents, read-only,
# no history) judged cycle-1.patch, the staged diff the fingerprint hashes: APPROVED and drift_detected false.
# Deviation recorded for the reviewer: stock_evidence.sql wraps its UNION ALL in a subquery because PostgreSQL refuses
# expressions in a UNION's ORDER BY (the plan's T015 wrote them directly); the bound arrays and the ordering are as planned.
# Validation not excluded: the postgres-marked tests ran against a real PostgreSQL container.

