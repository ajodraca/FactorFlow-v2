      and spec-drift review (no drift) judged cycle-1.patch as recorded in diff_sha256.
      Their non-blocking notes: the roster join in marks is redundant (kept for DEC-0119 and T011;
      disposition below); the set-1 flag assertion in TC-COMP-188 repeats the snapshot check; a
      missing input is false even when it read a backfilled row, the DEC-0122 reading worth stating
      when factor-engine design 2.4 is next revised.
