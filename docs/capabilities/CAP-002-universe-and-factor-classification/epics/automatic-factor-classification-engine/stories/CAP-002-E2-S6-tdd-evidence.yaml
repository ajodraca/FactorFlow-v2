  - id: cycle-2
    tasks: [T006, T007]
    decisions: [DEC-0056, DEC-0122]
    description: >
      Review rework for implementation review v1. Tests only; no production file changes. IR-001 (HIGH): no story test
      told DEC-0056's rule (filed before the instrument's first fundamentals observed_on) from the rule it rejects
      (filed before the row's own observed_on), because every not-backfilled row the fixtures wrote was filed on the
      day it was observed. Two rows that the rules disagree on are now asserted to mark nothing, both in
      tests/integration/test_engine_restatement.py. TC-COMP-188 (T006): set 2's fresh quarter P0 is filed 2027-01-05,
      after FIRST and before its own observed_on 2027-01-10. Set 2 now asserts that B, C and D have no marked input and
      no marked classification, that A's book_to_price (which reads only the newest balance sheet, P0) is unmarked
      while A's earnings_yield, fcf_yield and growth inputs still read backfilled quarters, and that every stock's
      column agrees with its detail (assert_column_agrees_with_detail). T007 (c): a fourth stock D has its newest
      balance sheet and income statement observed again on FIRST + 1 and filed on FIRST, before their own
      observed_on but not before the stock's first. D's five inputs and its value and growth classifications are
      false, the column agrees with detail for A to D, and D's book_to_price detail shows that the later observation
      was read (observed_on FIRST + 1, filed FIRST, backfilled false). No assertion was removed or weakened.
