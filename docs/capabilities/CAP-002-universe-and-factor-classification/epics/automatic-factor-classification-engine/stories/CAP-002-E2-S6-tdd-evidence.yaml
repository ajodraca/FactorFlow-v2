# TDD evidence for CAP-002-E2-S6 - Possibly-restated mark for value and growth classifications.
# cycle-1 is the whole implementation: the three SQL edits only work together for the end-to-end tests (TC-COMP-186, 188),
# as the plan's Parallel Opportunities note says, and the new tests failed on one missing
# behaviour, the constant false that CAP-002-E2-S3 and CAP-002-E2-S5 wrote until this story.
# Decisions applied: DEC-0056 (backfill rule), DEC-0119 (classify.sql reads factor_input),
# DEC-0122 (which rows mark an input; which classification rows carry the mark).
# Reviews: the first code review asked for a test of an outdated and a not_computable input that
# lists a backfilled row (BLOCKING); the spec-drift review found no drift. The tests were added, the
# catalogue gained the mutants the reviewer named, the RED, the mutation run and the fingerprint were
# redone on the final tests, and both reviews then judged the final patch.
# cycle-2 is the rework of implementation review v1 (IR-001): tests only, no production change.

cycles:
  - id: cycle-1
    tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014]
    decisions: [DEC-0056, DEC-0119, DEC-0122]
    description: >
      Production: value_inputs.sql and growth_inputs.sql replace the constant false with
      bool_or(backfilled) over the rows of used, the CTE that also builds detail.periods (periods
      and windows aggregate both), written only when the status is not missing, since a missing
      input's detail lists no period (DEC-0122: "exactly the statement rows listed in its detail
      periods"). classify.sql gains the CTE marks: bool_or(factor_input.restated_possible) per
      active stock over this set's rows of this factor, behind one factor guard
      %(factor)s::text IN ('value', 'growth'), LEFT JOINed onto the classified, input-reason
      not_classified and not_enough_stocks row sets with coalesce(m.restated, false); the retired
      row set keeps the constant false. No parameter, Python module or migration changes (T012).
      Tests: TC-COMP-186, 187 and 188 and the T007 cases in
      tests/integration/test_engine_restatement.py, with helpers in
      tests/integration/engine_restatement_support.py; T008 in tests/unit/test_restatement_sql_static.py.
    deviations: >
      (1) T011 writes the guard into each of the three row sets; it is written once, inside marks,
      so a momentum build's marks is empty and every momentum row gets coalesce(NULL, false). Same
      result, one guard to pin. (2) T011's instrument_id = ANY(%(active_ids)s) is written as
      JOIN active, the unnest of that same parameter, as peer_ids does. (3) Helpers beyond T002's
      list: run_two_stage_build takes floor (T007 (d) needs 5), add_fundamentals takes
      statement_types (T007 (d) needs a stock without cash-flow statements), add_marked_inputs
      generalises add_momentum_inputs for T005's value and growth rows, input_snapshot holds T006's
      set-1 factor_input rows. (4) T005 adds a fifth stock E, marked on value and growth with no
      momentum row, so the not_classified momentum row of a ranked factor is checked too. (5) Tests
      beyond T007's list, added after GREEN to kill mutants or on review: all inputs of a factor
      missing (growth guard), outdated inputs, and not_computable value and growth inputs (review
      finding 1). (6) The mutants file is staged in the reviewed patch, as for CAP-002-E2-S5.
