    t019: >
      EXPLAIN (ANALYZE, BUFFERS) over 3000 active instruments with all eight inputs present (24,000 factor_input
      rows) plus an earlier complete set's 24,000 rows: peer_sets.sql 9 to 11 ms and one classify.sql call (value)
      about 50 ms, far under 10 seconds. With statistics as the inserts left them both use factor_input_pkey; after
      ANALYZE, with set_id matching half the table, the planner sequentially scans factor_input, reading the earlier
      set's rows too (48,000 rows per scan). A signal for CAP-002-E2-S7's volume test; not a gate here.
