  - id: cycle-2
    tasks: [T009, T010]
    description: >
      Review rework for implementation review v1. Tests only; no production file changes. IR-001 (HIGH): TC-COMP-069
      gains hand-built case (f), test_scores_tied_after_rounding_keep_the_percentiles_of_the_unrounded_scores, in
      tests/unit/test_composite_arithmetic.py. On growth over five stocks, revenue_growth [1, 2, 3, 3.0000001, 5] and
      eps_growth [10, 20, 30, 30, 50], the third and fourth stocks' unrounded scores differ by about 3.4e-8 (asserted
      on reference_scores). Both store 0.134840 and keep percentiles 50 and 75, the ranking of the unrounded score
      that T015, design 2.5 and the plan's Other Notes require. The literal scores and percentiles are written in the
      test. IR-002 (HIGH): T010(d) gains test_the_first_gap_follows_the_input_order_where_it_is_not_alphabetical in
      tests/integration/test_engine_peer_set.py. It has five stocks with at least two inputs not present, on growth
      (revenue_growth, eps_growth) and momentum (return_3m, return_6m, return_12m). For both factors, INPUT_NAMES order
      differs from the alphabetical order of the names and of the labels. Each case asserts the reason_code,
      reason_input and reason_detail of the first input not present in INPUT_NAMES order: an absent row counted as
      missing, all three momentum inputs outdated as a stale latest bar leaves them (design 2.4), and a later, more
      severe status that does not win. IR-003 (MEDIUM) is settled by owner decision DEC-0228 with no code change:
      classify.sql adds no spread tolerance, and the property test's filter on composite spreads below 1e-9 stands.
