# TDD evidence for CAP-002-E2-S5 - Peer sets, composite score and percentile classification.
# cycle-1 is the whole implementation: peer_sets.sql, classify.sql and _classification_stage only work together
# (classify.sql reads the classification_set_factor rows peer_sets.sql writes), and every new test failed for that one
# missing stage.
# Decisions applied: DEC-0052 (no numeric library), DEC-0053 (composite), DEC-0119 (read factor_input),
# DEC-0120 (reason_detail and INPUT_LABELS), DEC-0121 (registration order, restated_possible false), DEC-0130 (labels).
# Reviews: independent code-review and spec-drift subagents judged the staged diff. The first round approved with no
# drift and non-blocking notes; the notes on the tests were taken (see green_evidence), and the changed patch was
# re-fingerprinted, re-mutated and re-reviewed twice (APPROVED, no drift each time); the last review judged the final patch.
# Owner: the plan's open gap "near-constant composite caused by numeric rounding" was observed; see open_gap below.
# It is settled by owner decision DEC-0228 (review v1 IR-003): no tolerance in classify.sql; the property test's
# filter on composite spreads below 1e-9 stands.
# cycle-2 is the rework of implementation review v1 (IR-001, IR-002): tests only, no production change.

cycles:
  - id: cycle-1
    tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019]
    description: >
      Production: peer_sets.sql (one INSERT into classification_set_factor per build: the qualified count of each
      factor, a stock qualifying when its present factor_input rows number the factor's inputs, and ranked at
      constants.MIN_PEER_SET_SIZE); classify.sql (one INSERT into factor_classification per factor: DEC-0053 by
      window functions over the peer set, and not_classified rows for stocks outside it, for every stock of an
      unranked factor and for retired stocks, reason_detail from the bound input_labels); _classification_stage
      registered as the last statement of engine.py; constants.INPUT_LABELS. Tests: TC-COMP-067, 068, 095, 107, 111
      and the T010 cases in tests/integration/test_engine_peer_set.py; TC-COMP-069 (hand-built cases a to e and
      hypothesis properties) in tests/unit/test_composite_arithmetic.py; T011 in
      tests/unit/test_classify_sql_static.py; T012 in tests/unit/test_classification_stage_order.py; helpers and the
      pure-Python DEC-0053 oracle in tests/integration/engine_classify_support.py.
