    red_log_sha256: 17fe932d1560dc0a36f8c6123953b6f399bd95ab885c28cc831b9be42229bfce
    red_evidence: >
      Run on a clone of origin/main 7646ab7 (no production change) holding the five test files exactly as staged in
      cycle-1.patch (their sha256 are in the log header): 33 failed, 13 passed. Every failure is the missing
      production: engine._classification_stage absent (19 AttributeError, and ValueError from the order check),
      peer_sets.sql and classify.sql absent (9 FileNotFoundError, 2 is_file), constants.INPUT_LABELS absent (2). The
      13 that passed are the detectors' self-tests, the no-numeric-import check (already true), the input-order
      precondition and the order rule's self-test. An earlier RED of a draft of the same tests (32 failed, 13
      passed) was superseded by this one.
    green_evidence: >
      The five story test files: 46 passed; test_properties_hold_over_random_peer_sets passed under 40 explicit
      hypothesis seeds on the final tests. Before hand-off: uv run pytest 1513 passed, 1 xfailed (full-suite log
      under logs); -m 'not postgres' 1055 passed, 1 xfailed; -m postgres 458 passed; npm run test 352 passed; npm
      run test:e2e 18 passed; uv build ships classification/sql/peer_sets.sql and classify.sql. ruff check, ruff
      format --check and mypy src clean. Review notes taken on the tests: the property test skips examples whose
      oracle composite dispersion is below 1e-9 (the open gap below), shift and scale run separately, the mean-0 and
      sd-1 property runs on every example, two strict-mypy nits, and AC or DEC docstrings on every additional test.
      A strengthening test, test_the_unranked_reason_states_the_floor_in_force, was added before the mutation run so
      that a floor hard-coded in the stage's classify.sql call cannot survive. Deviation: the top score's percentile
      is asserted 100 only when that score is unique, because percent_rank gives tied rows the lowest rank (T013's
      wording says 'when at least two scores differ').
    open_gap: >
      Plan Open Gap 'near-constant composite caused by numeric rounding' is real, and distinct values do not avoid
      it. Inputs whose z-scores cancel mathematically (A and -2A + 1, or three value inputs with r = -1/2 and the
      third minus their sum) give a composite whose numeric spread is near 1e-17 after PostgreSQL's numeric
      division; stddev_samp of it is not exactly 0, so classify.sql re-standardises the noise into scores of about
      +-1 with spread percentiles instead of 0. The code reviewer reproduced it in 43 of 60 random trials of
      eps_growth = c - k * revenue_growth over 7 stocks; seed 25 of the first property-test probe found a related
      effect (an exact tie broken by rescaling one input). No production tolerance was added, as the plan instructs.
      The property test now skips examples whose oracle composite dispersion is below 1e-9 so that it does not
      generate the case; hand-built cases (d) and (e) pin the exactly constant composite. Owner question: should
      classify.sql treat a composite spread below some tolerance as zero dispersion, and if so which tolerance
      (factor-engine 2.5, DEC-0053)? Answered by the owner in DEC-0228 (2026-10-28, review v1 IR-003): no
      tolerance; classify.sql re-standardises exactly as DEC-0053 states and adds no spread threshold or constant,
      an exactly constant composite (spread 0) still scores 0, and the property test's skip of generated examples
      whose composite spread is below 1e-9 stands, since it excludes only the exact-cancellation case.
