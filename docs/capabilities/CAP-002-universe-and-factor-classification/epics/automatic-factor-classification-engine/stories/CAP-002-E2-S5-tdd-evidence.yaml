    red_evidence: >
      The four non-equivalent survivors of review v1 (mutants-cycle-2.json, the reviewer's ids and edits) were first
      reproduced as survivors of the cycle-1 tests: the seven focused files with the two cycle-2 tests deselected,
      83 passed under each mutant (4 of 4 survived). Then the two cycle-2 tests were run under one mutant at a time.
      rv:percentile-on-rounded-score fails case (f): the fourth stock gets (0.134840, 50) where 75 is expected.
      rv:gap-order-by-name, rv:gap-order-by-label and rv:gap-unordered fail the first-gap test on its first growth
      case: input_missing eps_growth where input_outdated revenue_growth is expected. Each run: 1 failed, 1 passed.
      Unmutated, both pass (2 passed, four workers). The unordered mutant leaves the choice to the plan. On
      PostgreSQL 16 the planner sorts the gap rows by (instrument_id, input_name) for a merge join with
      factor_input's primary key, so the mutant names the alphabetically first input. A probe printing all five
      cases' reason_input under it, run three times, found every case wrong each time. No test can make the order of
      an unordered DISTINCT ON deterministic. The kill is observed on this plan, not guaranteed on every plan.
