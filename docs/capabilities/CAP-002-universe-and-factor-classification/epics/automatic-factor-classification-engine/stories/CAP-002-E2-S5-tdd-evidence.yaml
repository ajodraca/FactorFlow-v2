        - id: manual:input-z-population-sd
          disposition: equivalent
          reason: >
            within one factor every input column has the same n, because a peer stock has every input present, so
            stddev_pop scales every z-score by the same factor sqrt(n / (n - 1)); the composite is scaled by it and
            re-standardising removes it, so scores and percentiles are identical in exact arithmetic. The sample
            standard deviation DEC-0053 requires is pinned where it is observable, at the re-standardisation
            (manual:score-population-sd is killed by hand-built case (a)), and stddev_samp by
            test_classify_does_its_arithmetic_with_window_functions
        - id: manual:input-z-uncentred
          disposition: equivalent
          reason: >
            dropping the input mean shifts every stock's composite by the same constant, the mean over the inputs of
            mean / sd, and re-standardising subtracts the composite's mean, so scores and percentiles are identical
            in exact arithmetic; the input z-scores are internal to classify.sql
