  - id: cycle-2
    tasks: [T003, T005, T006]
    description: >
      Review rework of CAP-002-E2-S9-implementation-review-v1 (IR-001, IR-002, IR-003). Tests only; scheduler.py is
      unchanged. IR-001: the INFO outcome-line test (T006 c) is parametrized over complete and failed, so the line must
      carry result.state (design 2.4; design section 4, Audit; plan T012). IR-002: a new test makes the dispatched
      reclaim_interrupted_sets raise and asserts the same exception leaves run_classification_loop, nothing but the reclaim
      is dispatched and no wait is requested (DAC-E2-12; design 2.4; plan Open Gaps: no retry is added, the owner question
      stays open). IR-003: a new test sets the stop event inside a successful build and asserts the loop claims again with
      no wait and stops at the idle stop check (plan T012 and Other Notes, stop event, E2-F26). The two new tests cite their
      ACs in their docstrings and carry no TC tag (T015). Mutation: no production line changed, so the catalogue
      generates nothing new; the review's own 30 mutants (4 catalogue, 19 coder, 7 reviewer; its mutants file, sha256
      3c3c55f3e82de0b7a89af0603187f976601ebff60c70ffa91da553648a5c5838, re-tagged cycle-2 as mutants-cycle-2.json) were
