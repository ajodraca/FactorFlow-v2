    deviations: >
      Rules beyond T007's list, added on the code review: skip, skipif and xfail marks and pytest.skip and
      pytest.xfail calls are refused (a skipped or expected-to-fail volume test proves nothing, DAC-E2-5); each
      pinned constant is bound exactly once anywhere in the module; engine.build is passed TIMEOUT_SECONDS; exactly
