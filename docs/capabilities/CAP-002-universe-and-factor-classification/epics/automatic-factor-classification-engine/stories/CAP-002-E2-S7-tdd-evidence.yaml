      series; a classification date within 30 days after a quarter end would make statements observed before their
      period end. Noted, not changed: TC-COMP-091 does not itself count corporate actions in the inputs' detail (the
      population test of cycle-2 does, at 40 stocks); the RED margin depends on the host (1.5 s against 1 s).
