# TDD evidence for CAP-002-E2-S7 - Whole-build proof: no backdating and the 3000-instrument volume test.
# The story adds tests only; no production file changes (T009 skipped: the volume build took under 2 s against
# the 295 s budget). Every cycle is a characterisation test of behaviour CAP-002-E2-S3 to S6 delivered, so its RED
# is the falsification run the task plan's T013 names, recorded in red_log, with the perturbation reverted before
# the diff was staged.
# The driver commits once per stage, so every cycle records commit_hash: stage and cites its reviewed_patch. The
# cycles share that commit: cycle-1's patch is the staged diff against HEAD (check-tdd-evidence.py fingerprint
# --staged); each later cycle's patch is the diff from the index tree the previous cycle was reviewed at to the
# index tree after staging its own files (fingerprint --range <previous tree>..<new tree>), so the patches apply in
# order onto the stage commit's parent and rebuild it.
# Decisions applied: DEC-0123 (volume test shape), DEC-0124 (no-backdating assertions).
# Reviews: one independent code-review subagent and one independent spec-drift subagent judged each cycle's patch.

cycles:
  - id: cycle-1
    tasks: [T001, T002, T003]
    decisions: [DEC-0123]
    description: >
      T001 confirmed every hard prerequisite on the branch (cut from origin/main f4deee3): engine.py registers
      _fundamental_inputs_stage, _momentum_inputs_stage and _classification_stage in that order, the classification
      stage last (DEC-0121); the seven SQL files exist; value_inputs.sql, growth_inputs.sql and classify.sql write
      restated_possible from bool_or (S6); the S2 and S3 support modules and the two test files to append to exist.
      T002 adds tests/integration/engine_proof_support.py: volume_sessions (273 weekdays over 13 months and 7 days,
      evenly spaced interior weekdays dropped), populate_volume (set-based INSERT ... SELECT with bound parameters:
      n instruments V00001 up, one bar per session observed on its session date, eight calendar quarters of the
      three statement types observed and filed 30 days before the last session with JSON-number payloads under
      TEST_KEYS, one cash dividend per instrument between 3 and 2 months back, a split for every tenth between 6 and
      5 months back, then ANALYZE), _insert_bar, populate_backdating, backfill_statement, revise_close, snapshot_set
      (jsonb kept as the store's text) and complete_and_open_next. T003 adds tests/integration/test_engine_volume.py,
      TC-COMP-091: 3000 instruments built through the real stages and the real floor, wall clock around the one
      engine.build call, complete within BUDGET_SECONDS = 295 with 24,000 inputs, 9,000 classified rows, three
      ranked factors of 3000 and the set complete with 3000 active instruments.
    deviations: >
      (1) BackdatingPopulation also carries classification_date, which backfill_statement needs and T002's field list
      omits. (2) T003 also asserts each classification_set_factor row is ranked with 3000 qualified, the plan's
      "every factor is ranked" read from the table as well as from BuildResult.
    red_log: repos/factorflow-v2/FactorFlow-v2/docs/capabilities/CAP-002-universe-and-factor-classification/epics/automatic-factor-classification-engine/stories/CAP-002-E2-S7-evidence/red-cycle-1-volume.log
    red_log_sha256: 8f70b278cb47523d82261cee45acc73bd9b6c5669b76b669fe01b01b456f115c
    red_evidence: >
      Falsification run named by T013: BUDGET_SECONDS temporarily set to 1 in test_engine_volume.py, on HEAD f4deee3
      plus the two cycle-1 files: 1 failed, on assert elapsed <= BUDGET_SECONDS (1.525 s against 1). Reverted before
      staging; the unperturbed file's sha256 is in the log header and matches the staged file.
    green_evidence: >
      uv run pytest -m slow tests/integration/test_engine_volume.py -s: 1 passed, build elapsed 1.649 s (fixture load
      7.2 s, excluded from the clock). ruff check and ruff format --check clean on both files; mypy --strict on them
      reports only the pre-existing engine_inputs_support.py:194 error outside this story. The code review
