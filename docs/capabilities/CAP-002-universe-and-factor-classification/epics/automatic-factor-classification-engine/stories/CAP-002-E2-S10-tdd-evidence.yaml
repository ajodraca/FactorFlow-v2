# TDD evidence for CAP-002-E2-S10 - Momentum requires corporate-actions coverage of its window (DEC-0397, DEC-0398).
# One cycle: the plan writes every test first (Phase 2, T002-T011) and commits them as the cycle's red_commit, before
# the one production task (T012, momentum_inputs.sql). Not run under a driver: the GREEN commit is the cycle's own
# commit (commit_hash), and this file, its logs and the ticked plan follow in a documentation commit.
# Decisions: none recorded by this stage; the rule, bounds, detail shapes, data types and cause order are DEC-0397,
# the coverage contract DEC-0398, both owner decisions taken before planning.
# Reviews: one independent code-review subagent and one independent spec-drift subagent judged the RED commit's diff
# together with the staged GREEN diff (cycle-1.patch): APPROVED, drift_detected false. diff_sha256 and reviewed_patch
# are of the staged GREEN diff, which is exactly the GREEN commit's diff.
# Cycle 2 is the review-rework of CAP-002-E2-S10-implementation-review-v1 (IR-001; one test, no production change). Its
# staged diff was judged by a fresh code-review subagent and a fresh spec-drift subagent: APPROVED, drift_detected false.

cycles:
  - id: cycle-1
    tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012]
    description: >
      momentum_inputs.sql computes a momentum input only when one corporate_actions coverage_segment of the stock
      contains its window (S_k, E]: a LEFT JOIN LATERAL probe of idx_coverage_instrument on the win relation with
      covered_from <= s_session + 1 and covered_to >= e_session. Otherwise the input is missing with detail
      {cause: corporate_actions_not_covered, window_months, E, S, corporate_actions_coverage} (the stock's segments
      ordered by covered_from, [] when none), a null value and known_on, and missing_data_type corporate_actions,
      ranked after a missing boundary and before price_not_positive and corporate_action_payload_unusable (DEC-0397).
      Present and outdated inputs record detail.corporate_actions_covered_by. The RED commit holds the two seed
      changes (engine_support.add_instrument with corporate_actions_covered=True, engine_proof_support.populate_volume,
      both 2000-01-01 to 2099-12-31), TC-COMP-381 to 386 in test_engine_inputs_momentum.py, the corporate_actions_covered_by
      key added to exactly the two whole-detail expectations DAC-E2-S10-6 names, and the TC-COMP-387 guard in
      test_runner_acquires.py. The GREEN diff also carries two test changes made during GREEN: the full-build
      TC-COMP-381 test uses a peer-set floor of 2 with a second covered stock (T004 said 1; a peer set of one has no
      sample deviation, so classify.sql's score is null and the set fails factor_classification_shape), and a new
      TC-COMP-383 case, test_coverage_bounds_are_the_resolved_bars_not_their_targets, added so the mutants that read
      the bounds from the S_k and E targets instead of the bars resolved are killed (both reviewers judged it in scope).
