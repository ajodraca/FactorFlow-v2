    tasks: [T005, T006, T007, T009, T010]
    decisions: [DEC-0055, DEC-0116, DEC-0117, DEC-0118, DEC-0241, DEC-0242, DEC-0243]
    description: >
      Review rework of CAP-002-E2-S4-implementation-review-v1 (CHANGES-REQUIRED). Production changes only for the two
      owner decisions; every other finding is test-only. DEC-0242 (IR-005) supersedes T010's known_on for missing
      rows: momentum_inputs.sql writes known_on only when status is not missing (CASE WHEN s.status <> 'missing'),
      so a missing input has known_on null whatever its cause, as_of stays E and the cause and rows read stay in
      detail; present and outdated inputs keep DEC-0118 (1), every split and dividend in their window being applied.
      DEC-0243 (IR-006) supersedes T010's missing_data_type = 'prices' for one cause: an input missing for
      corporate_action_payload_unusable names corporate_actions (CASE WHEN s.unusable AND NOT s.price_not_positive),
      so insert_inputs.sql enriches it with the last corporate_actions outcome; a missing boundary and DEC-0241's
      price_not_positive keep prices. T010 records both supersessions in its note. Tests in
      tests/integration/test_engine_inputs_momentum.py: IR-001, a second stock with its own split, dividend and a bar
      between the other stock's prior session and ex-date (DEC-0055 (3), (4), DEC-0118 (3)); IR-002, known_on over
      two dividends' prior sessions, each observed last in turn (DEC-0118 (1)); IR-003, a dividend followed by three
      splits, one on its ex-date, so its prior close and cash amount are scaled by different products (design 2.4,
      DEC-0118 (2)); IR-004, a usable dividend beside every unusable payload case, a "+1" cash amount case, and an
      unusable dividend over a zero prior close (DEC-0117 (2), (3), DEC-0241 (1), (2)); DEC-0242, known_on null on
      the missing S_12, price_not_positive and unusable-payload rows; DEC-0243, the corporate_actions outcome on an
      unusable-payload row and the prices outcome on a price_not_positive row whose dividend is also unusable. No
      assertion was weakened except the unusable-payload test's known_on, from the action's observed_on to null, as
      DEC-0242 requires. engine.py and every other file are unchanged.
