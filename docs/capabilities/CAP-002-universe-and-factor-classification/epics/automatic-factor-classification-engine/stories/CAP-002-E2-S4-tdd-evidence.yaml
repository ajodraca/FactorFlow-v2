    green_evidence: >
      Focused suite on the final tree (test_engine_inputs_momentum.py, test_engine_sql_safety.py,
      test_classification_stage_order.py): 100 passed. Full validation on the final tree before hand-off: uv run
      pytest 1679 passed, 1 xfailed (CAP-002-E2-S2's strict-xfail TC-COMP-059 line-item check; full-suite-
      cycle-1.log); -m 'not postgres' 1082 passed, 1 xfailed; -m postgres 597 passed; ruff check, ruff format
      --check and mypy src clean; npm ci, npx tsc --noEmit, npm run build clean; npm run test 876 passed; npm
      run test:e2e 18 passed; uv build ships classification/sql/momentum_inputs.sql. npm run lint (40 errors)
      and npm run format (2 files) fail only on the git-ignored build/lib/factorflow/api/static bundle an
      earlier uv build left; biome lint and format over the 110 tracked sources are clean. The T018 query (no
      momentum factor_input row not_computable or restated_possible) runs as assert_momentum_invariants in the
      T009 precedence, row-count, unusable-payload and non-positive-close tests (19 builds) and returns (0, 0)
      in each; the T014 probe's 9000 rows are all present.
    t014: >
      t014-volume-probe.log, final SQL: 3000 active instruments, 273 bars each (819,000 rows), 12,300 corporate
      actions. momentum_inputs.sql under EXPLAIN (ANALYZE, BUFFERS) takes 0.40 s (execution 398 ms), far under
      30 seconds; daily_bar is read only by backward index scans of idx_daily_bar_instrument_session, never
      sequentially; the fundamentals and momentum stages build in 0.8 s with 9000 present rows. The first SQL
      draft, written as T010 step (1) describes it (a DISTINCT ON CTE over every bar, joined to the window
      actions), ran over 10 minutes on the same roster and was cancelled: the planner estimated the materialised
      CTEs at one row and chose nested loops over about 36,000 x 36,000 rows. The final SQL applies the same
      latest-observation rule by ORDER BY session_date DESC, observed_on DESC, recorded_at DESC LIMIT 1 lookups
      (the form value_inputs.sql uses) and sums split factors over per-stock arrays. A signal for
      CAP-002-E2-S7's volume test, not a gate.
    tests_executed: true
    code_review_verdict: APPROVED
    code_review: >
      Independent code-review subagent. Round one REJECTED the first patch (1f257ed0): a zero or negative close
      on a bar used raised DivisionByZero or InvalidArgumentForLogarithm and failed the whole set, including for
      the prior session of a dividend outside every window; non-blocking: unusable-payload rows report the
      prices acquisition, missing rows carry known_on, two test gaps (stale stock with an unusable payload; a
      dividend's recorded split factors with a split after E), stale evidence, payload strings over 131,072
      digits. Rework: DEC-0241, the guard, and tests for both gaps. Round two APPROVED patch 97c758f0 with the
      non-blocking points left for the owner. A test-only delta (a positive close below 1, for four cut-off
      mutants) was re-reviewed: APPROVED for the final patch.
