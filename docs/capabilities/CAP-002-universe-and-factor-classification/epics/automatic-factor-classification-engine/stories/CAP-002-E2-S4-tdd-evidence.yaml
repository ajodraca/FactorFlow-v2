# TDD evidence for CAP-002-E2-S4 - Momentum inputs with split and dividend adjustment.
# One cycle, as the task plan lays it out: Phase 2 writes every test (T002-T009) and observes RED, Phase 3 makes
# them pass (T010-T012), Phase 4 validates and samples volume (T013, T014), Phase 5 checks traceability and the SQL
# against the design (T015, T016, T018); T017 is this file. The driver commits once per stage: commit_hash is stage.
# Review history: the first independent code review REJECTED the cycle (a zero or negative close on a bar used failed
# the whole set); the rework stayed in cycle-1 with its own observed RED and is decided as DEC-0241 (provisional,
# agent). The re-review APPROVED the reworked patch and a later test-only delta; spec drift was false on every patch.
# Decisions applied: DEC-0052, DEC-0055, DEC-0111, DEC-0115, DEC-0116, DEC-0117, DEC-0118, DEC-0121, DEC-0241.

cycles:
  - id: cycle-1
    tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018]
    decisions: [DEC-0052, DEC-0055, DEC-0111, DEC-0115, DEC-0116, DEC-0117, DEC-0118, DEC-0121, DEC-0241]
    description: >
      The momentum stage of the factor engine. momentum_inputs.sql is one INSERT into the inputs table that
      value_inputs.sql creates: per active stock, E is its latest bar on or before D minus MOMENTUM_LAG_MONTHS
      and S_k its latest bar on or before E minus k months, each read at the session's latest observation
      (observed_on, then recorded_at; DEC-0117 (1)); splits and dividends are taken at their latest observation,
      their payload values read only from a JSON number or a JSON string holding a plain decimal and checked for
      range (DEC-0117 (2)); S_k's close is scaled by the usable splits in (S_k, E], each dividend in the window
      compounds the factor by 1 + cash_amount x the splits strictly after its ex-date / its prior session's
      close x the splits after that session (DEC-0118 (2), (3)); total return = E close / adjusted S_k close x
      dividend factor - 1. Status: missing for a missing boundary (detail.boundary E or S_k), a non-positive
      close on a bar used (DEC-0241) or an unusable payload in the window (DEC-0117 (3)), in that order; else
      outdated when the latest bar precedes the latest trading day; else present; never not_computable. value
      only when present, as_of is E, known_on the latest observed_on of the E and S_k bars, the window's splits
      and dividends and each dividend's prior session (DEC-0118 (1)), restated_possible false, missing_data_type
      prices. engine.py gains _momentum_inputs_stage (momentum_inputs.sql, then insert_inputs.sql with factors =
      ['momentum']), registered after the fundamentals stage and above _STAGES.append(_classification_stage),
      which stays the module's last statement (DEC-0121, DEC-0115). Tests:
      tests/integration/test_engine_inputs_momentum.py (TC-COMP-063, 064, 065, 066 and 102, the supporting case
      for TC-COMP-059, every T004 to T009 case, the DEC-0241 cases and the registration check) over the helpers
      in tests/integration/engine_momentum_support.py.
    red_log: repos/factorflow-v2/FactorFlow-v2/docs/capabilities/CAP-002-universe-and-factor-classification/epics/automatic-factor-classification-engine/stories/CAP-002-E2-S4-evidence/red-cycle-1-final-tests.log
    red_log_sha256: 366be93c3b2029bd8a9f20367304b6c3f1ef2f28d7c9296237b46ad800acceff
    red_evidence: >
