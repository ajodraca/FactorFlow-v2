# TDD evidence for CAP-002-E2-S2 - Factor engine build transaction: constants, set context, completion, failure and timeout.
# One cycle: the package is a single spine (transaction, three statements, constants, line items) whose tests share fixtures.
# Decisions applied: DEC-0111 (REPEATABLE READ), DEC-0112 (_STAGES seam), DEC-0113 (strict xfail), DEC-0114 (no price data), DEC-0121 (registration order).
# Rework: cycle-2 answers implementation review v1 (IR-001 to IR-006, IR-008, IR-009, IR-010); IR-007 is the mutation evidence regenerated with python -B (no stale bytecode) and only referenced logs kept.
# Reviews: independent code-review and spec-drift subagents judged the staged diff three times. The first found BuildResult.set_id missing,
# the second found line_items.py not verbatim from design 2.4 (labels, sentinel); both were fixed with tests and re-reviewed. The third approved.

cycles:
  - id: cycle-1
    tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019]
    description: >
      factorflow.classification package: constants.py, line_items.py (seven items, every key REQUIRES_INPUT),
      engine.build with the _STAGES seam inside one REPEATABLE READ transaction, and set_context.sql,
      complete_set.sql, fail_set.sql. Tests: TC-COMP-159, 166, 167, 090 (integration), TC-COMP-160 (isolation and
      append-only over classification/), TC-COMP-059 (strict xfail), constants, line items and statement loading.
    red_log: repos/factorflow-v2/FactorFlow-v2/docs/capabilities/CAP-002-universe-and-factor-classification/epics/automatic-factor-classification-engine/stories/CAP-002-E2-S2-evidence/red-cycle-1-engine.log
