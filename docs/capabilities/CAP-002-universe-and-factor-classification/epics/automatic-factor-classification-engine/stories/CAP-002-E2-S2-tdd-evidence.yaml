    description: >
      factorflow.classification package: constants.py, line_items.py (seven items, every key REQUIRES_INPUT),
      engine.build with the _STAGES seam inside one REPEATABLE READ transaction, and set_context.sql,
      complete_set.sql, fail_set.sql. Tests: TC-COMP-159, 166, 167, 090 (integration), TC-COMP-160 (isolation and
      append-only over classification/), TC-COMP-059 (strict xfail), constants, line items and statement loading.
