    tasks: [T006, T007, T008, T009, T010, T017]
    description: >
      Review rework for implementation review v1. Tests: the transaction tests read the terminal set state and row
      counts from a second connection (IR-001); the timeout is local to the build transaction (IR-002); qualified_counts
      come from this set's classification_set_factor rows only (IR-003); stages run in list order (IR-004); an unknown
      set id and an empty active roster fail with their stated reasons (IR-005); the millisecond rounding is observed
      from the set_config parameter sent, not by reading the setting back under a 1 ms timeout (IR-006); the other
      writer's ended_at, the elapsed-time bound and the per-test AC traces T007 to T009 and T019 ask for (IR-009); the
      engine SQL guard reuses CAP-002-E2-S1's patterns for qualified names, ONLY, upserts and statement bounds (IR-010).
      Production: the failure log carries the exception (exc_info=True) so the stack trace reaches the structured log
      while failure_reason stays one line (IR-008). IR-007: cycle-1's mutation evidence is regenerated with python -B and
      the 16 unreferenced logs are removed.
