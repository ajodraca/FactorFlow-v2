  - id: cycle-3
    tasks: [T005, T009]
    description: >
      Review rework for implementation review v2. Tests only; no production file changes. IR-001: a completing build
      over two active instruments and one retired, all holding bars, asserts active_instruments == 2 on the committed
      set row and in BuildResult. IR-002: a stage raising an exception with an empty message leaves the set committed
      failed with the reason "RuntimeError: " (T017's format) and build does not raise. IR-003: a connection whose
      transaction is aborted (INERROR) is refused with ValueError before any statement and the set stays building.
      IR-004 (LOW): both rosters are asserted in instrument_id order over a heap whose order differs from id order,
      with index and bitmap scans disabled so only the ORDER BY can supply it; the heap order is asserted as a
      precondition. IR-005 (LOW): see cycle-1 mutation_state and the cycle-2 corrections.
