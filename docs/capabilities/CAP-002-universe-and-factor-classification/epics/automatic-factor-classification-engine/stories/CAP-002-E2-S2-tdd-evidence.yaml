      writer's ended_at, the elapsed-time bound and the per-test AC traces T007 to T009 and T019 ask for (IR-009); the
      engine SQL guard reuses CAP-002-E2-S1's patterns for qualified names, ONLY, upserts and statement bounds (IR-010).
