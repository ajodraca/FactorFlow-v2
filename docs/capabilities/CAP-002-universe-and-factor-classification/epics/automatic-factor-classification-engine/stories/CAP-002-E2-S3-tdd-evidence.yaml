    description: >
      Review rework for implementation review v1. Tests only; no production file changes. IR-001
      (HIGH): the TC-COMP-062 tests assert as_of and known_on on the not_computable value rows and
      known_on on the not_computable growth rows; the TC-COMP-100 test asserts known_on on every
      fundamentals-outdated row (the bar's observation for value inputs, the newest statement's for
      growth); the TC-COMP-101 test asserts as_of and known_on on the price-outdated value rows
      (DEC-0116 (5), DEC-0055 (7)). IR-002 (HIGH): exact detail.periods_found on periods_missing value
      inputs that read a trailing window (three quarters; a quarter absent from the trailing window),
      on book_to_price missing a line item, and on a value and a growth input whose cause is
      line_item_absent (design 2.4, T018, T019). IR-003 (HIGH): the fundamentals-acquisition test also
      makes revenue_growth missing, with fundamentals and prices acquisition_state rows of different
      outcomes, and asserts the fundamentals outcome (design 2.3 step 5, T019). IR-004 (MEDIUM): a new
      test gives two stocks a session observed twice on one day with different recorded_at and close,
      the later recording inserted last for one stock and first for the other, and asserts the later
      recording's close (DEC-0117 (1), design 2.4). Expected values are computed from the fixtures;
      no assertion is removed or weakened. IR-005 is answered in the rework commit message; IR-006 is
      left to the owner.
