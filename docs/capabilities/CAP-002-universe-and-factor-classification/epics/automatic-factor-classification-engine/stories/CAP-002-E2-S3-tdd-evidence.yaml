# TDD evidence for CAP-002-E2-S3 - Value and growth inputs from quarterly fundamentals.
# One cycle, as the task plan lays it out: Phase 2 writes every test (T002-T014) and observes RED,
# Phase 3 makes them pass (T015-T020); T021-T023 validate and T024 is this file.
# Review history: the first per-cycle code review rejected the cycle (prior-year window rule of design
# 2.4 and T015 against DEC-0055 (1)); the owner decided DEC-0221, which supersedes the 12-month span
# rule of design 2.4 and the window wording of T015. The rework stayed in cycle-1 with its own observed
# RED (red-cycle-1-dec-0221.log), and both reviews then judged the final patch: APPROVED, no drift.
# Decisions applied: DEC-0055, DEC-0056, DEC-0111, DEC-0115, DEC-0116, DEC-0117, DEC-0121, DEC-0122,
# DEC-0221.

cycles:
  - id: cycle-1
    tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019, T020]
    decisions: [DEC-0055, DEC-0056, DEC-0111, DEC-0115, DEC-0116, DEC-0117, DEC-0121, DEC-0122, DEC-0221]
    description: >
      The fundamentals stage of the factor engine. statements.sql builds the ON COMMIT DROP table stmt
      (latest observation per quarterly period and statement type, FY rows filtered before ranking,
      the DEC-0056 backfilled flag over every row of the instrument, and ttm_slot and prior_slot).
      The windows follow DEC-0221, not T015's wording: the trailing window is ranks 1 to 4 and the
      prior-year window ranks 5 to 8, each formed only when its quarter ends are consecutive (each
      adjacent pair at most 4 months apart; trailing-only inputs need P1 to P4, growth P1 to P8).
      value_inputs.sql creates inputs with book_to_price, earnings_yield and fcf_yield;
      growth_inputs.sql adds revenue_growth and eps_growth; insert_inputs.sql appends the named
      factors' rows to factor_input with the acquisition_state outcome on missing rows (DEC-0115).
      engine.py gains _line_item_parameters() and _fundamental_inputs_stage, registered at the end of
      the module (no _classification_stage yet, DEC-0121). Tests implement TC-COMP-060, 061, 062, 094,
      100, 101 and 161 plus the T011 to T014 cases and the DEC-0221 window cases (52-week filer,
      absent year-ago quarter, 52-week filer missing a quarter, the 4-month boundary, a P3 to P4 gap,
      three quarters).
    red_log: repos/factorflow-v2/FactorFlow-v2/docs/capabilities/CAP-002-universe-and-factor-classification/epics/automatic-factor-classification-engine/stories/CAP-002-E2-S3-evidence/red-cycle-1.log
    red_log_sha256: a080861c2529b6c31ce088a6d4e7d43285aa8cd81add89fd8d3841f6b2a6364d
    red_evidence: >
      Before any production code (HEAD 31359b2): 57 failed, 0 passed; 53 on AttributeError for
      engine._fundamental_inputs_stage and 4 on AttributeError for engine._line_item_parameters
      (red-cycle-1.log). Test-only corrections made while turning GREEN, none of which weakens an
      assertion: the add_statement default observed_on moved from 30 to 15 days after the period end so
      recent quarters are observed before the classification date, one known_on expectation that
      ignored the bar's observation was corrected, and the recorded_at tie case was rewritten to insert
      the later recording both last and first. DEC-0221 rework RED (red-cycle-1-dec-0221.log, staged
      cycle-1 tree with the old statements.sql): 4 failed, 5 passed; the 52-week filer read present
      0.1875 instead of 0.2837837838, and the absent year-ago quarter, the 52-week filer missing a
      quarter and the 4-months-and-a-day pair read present instead of missing. The P3 to P4 gap and
      three-quarter tests were added after the re-review showed the manual mutant
      statements-trailing-two-pairs surviving; that mutant is killed in the final results.
