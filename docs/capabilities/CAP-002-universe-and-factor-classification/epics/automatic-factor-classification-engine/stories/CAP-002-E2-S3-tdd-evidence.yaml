      the wheel carries classification/sql/statements.sql, value_inputs.sql, growth_inputs.sql and
      insert_inputs.sql. T022 (t022-volume-probe.log, final statements.sql) built 3000 instruments
      with 8 quarters of three statement types and 273 bars each in 0.9 s; statements.sql 0.14 s,
      value_inputs.sql 0.56 s, growth_inputs.sql 0.22 s, insert_inputs.sql 0.12 s.
    tests_executed: true
    code_review_verdict: APPROVED
    code_review: >
      Three rounds by independent code-review subagents. Round one REJECTED the cycle (patch
      dd8fe3d7) on the prior-year window rule of design 2.4 and T015 against DEC-0055 (1); the owner
      decided DEC-0221. Round two APPROVED the reworked patch (2b0c7481) with non-blocking findings;
      the test gap it found (P3 to P4 pair, fewer than four periods) was closed. Round three APPROVED
      the final patch with no findings. Left with the owner, as non-blocking follow-ups: the DEC-0221
      4-month bound is a SQL literal because T023 allows no edit to constants.py; a present ratio of
      1e20 or more overflows numeric(30,10) and fails the set; two quarterly period ends a few days
      apart count as two quarters; the engine.py module docstring predates this stage (doc-sync).
