    output, "IDENTICAL" printed) to confirm no mutation was left in place,
    then the full suite and static checks were re-run.
  commands:
    - uv run pytest -m 'not postgres' -q
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy src
    - uv build
  result: "246 passed, 59 deselected, 1 failed (the same pre-existing,
    unrelated tests/integration/test_api_static_mount.py failure noted in
    the GREEN cycle above); ruff check: All checks passed; ruff format
    --check: 96 files already formatted; mypy: Success, no issues found in
    28 source files; uv build succeeded"

