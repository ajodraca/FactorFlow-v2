# T016 (TC-INT-027, DAC-E3-S7-14). The first attempt, in run-20261010T160604Z,
# was blocked by a pre-existing defect; the second passed once EXP-20261010-2
# was merged.
e2e_verification:
  task: T016
  test_case: TC-INT-027
  status: passed
  attempts:
    - attempt: 1
      run: run-20261010T160604Z (unit u005)
      status: blocked
      environment: >-
        Docker 28.3.2 available. The host had no GNU `timeout` (used by the
        script's pre-existing refused-start check, line 125) and bash 3.2; the
        first attempt exited 127 there, before the acquisition stack. The
        verification was re-run with a temporary perl `timeout` shim first on
        PATH (/tmp, not in the repository); no repository file changed for it.
      steps:
        - step: 1 health and process
          result: >-
            pass. GET /api/health on 8125 answered
            {"status":"ok","database":"reachable","credential_present":true,...};
            `pgrep -f tests/e2e/support/ingestion_e2e_main.py` showed the
            ingestion process still running after health answered.
        - step: 2 request a run
          result: >-
            PUT /api/settings/history-depth {"years": 1} -> 200; POST
            /api/instruments {"symbols": ["AAPL"]} -> 201 added; POST
            /api/acquisition-runs -> 202, run 319f7994-23bb-484f-8e48-62f8af8c16a8.
        - step: 3 stub reached, run terminal
          result: >-
            stub reached, run NOT terminal. The script's stderr showed ten
            `[massive-stub] "GET ..." 200` lines for AAPL. The run stayed
            `running` with zero counted results for more than five minutes.
        - step: 4 npm run test:e2e
          result: 9 passed (45.1s), with the stack started by the edited script.
      root_cause: >-
        Pre-existing, outside this story's diff. `ingestion_main.main` opened
        its connection with psycopg's default autocommit=False
        (CAP-001-E4-S5). claim_next committed its own transaction, but
        active_instrument_ids then ran a bare SELECT that opened an implicit
        transaction which was never committed, so every later `with
        connection.transaction()` became a savepoint inside it. pg_stat_activity
        showed the runner's backend `idle in transaction`, last query `RELEASE
        "_pg3_1"`.
      disposition: >-
        Abstained for the owner's decision. The owner directed an expedited
        fix: EXP-20261010-2 (autocommit=True), expedited review v2
        PASS-WITH-WARNINGS, owner-approved, merged to main in PR #100 at
        dce91bb.
    - attempt: 2
      branch: usr/alvaro-de-jodra/CAP-001-E3-S6-S7 at cc0b410
      status: passed
      environment: >-
        Docker available; GNU `timeout` from Homebrew coreutils, with its
        gnubin directory first on PATH for the script only (owner approved the
        install). No repository file changed for it.
      steps:
        - step: 1 health and process
          result: >-
            pass. GET /api/health on 8125 answered {"status":"ok",
            "database":"reachable","credential_present":true,
            "schema_version":4,"most_recent_run":null};
            `pgrep -f tests/e2e/support/ingestion_e2e_main.py` showed the
            ingestion process (pid 98279) running after health answered.
        - step: 2 request a run
          result: >-
            PUT /api/settings/history-depth {"years": 1} -> 200; POST
            /api/instruments {"symbols": ["AAPL"]} -> 201 added; POST
            /api/acquisition-runs -> requested, run
            b62c6427-6727-42d8-8965-db48fcafedc2.
        - step: 3 stub reached, run terminal
          result: >-
            pass. The script's stderr shows ten `[massive-stub] "GET ..." 200`
            lines for AAPL (/v3/reference/tickers, /v2/aggs, the four
            /stocks/financials/v1 endpoints, /stocks/v1/splits and dividends,
            /vX/reference/ipos and ticker events), so the run reached the stub
            on 127.0.0.1:8126 over loopback http. GET
            /api/acquisition-runs/{id} shows state `partial`, ended_at
            19:21:19.221Z (0.2s after started_at), and four `written` results
            for AAPL.
        - step: 4 npm run test:e2e
          result: >-
            9 passed (44.3s), with the stack started by the edited script,
            including tests/e2e/coverage-empty.spec.ts on the acquisition
            stack.
      observation: >-
        The run is `partial`, not `succeeded`, although all four data types
        wrote. No code under src/ sets acquisition_run.instruments_named; it
        stays at its default 0. journal.finalise returns `succeeded` only when
        instruments_named > 0, so no run can succeed. This is pre-existing,
        outside this story, and does not affect TC-INT-027, whose expected
        result is a terminal run. It is reported to the owner as a follow-up.

