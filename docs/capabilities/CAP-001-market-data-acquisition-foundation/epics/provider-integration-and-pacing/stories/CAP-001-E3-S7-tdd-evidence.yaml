# T016 (TC-INT-027, DAC-E3-S7-14): E2E verification. BLOCKED -- the stage
# stopped here (story-coding "halt on failure"); T017 to T019's closing
# steps were not run.
e2e_verification:
  task: T016
  test_case: TC-INT-027
  status: blocked
  environment: >-
    Docker 28.3.2 available. The host has no GNU `timeout` (used by the
    script's pre-existing refused-start check, line 125) and bash 3.2; the
    first attempt exited 127 there, before the acquisition stack. The
    verification was re-run with a temporary perl `timeout` shim first on
    PATH (/tmp, not in the repository); no repository file changed for it.
  steps:
    - step: 1 health and process
      result: >-
        pass. GET /api/health on 8125 answered
        {"status":"ok","database":"reachable","credential_present":true,...};
        `pgrep -f tests/e2e/support/ingestion_e2e_main.py` showed the
        ingestion process still running after health answered.
    - step: 2 request a run
      result: >-
        PUT /api/settings/history-depth {"years": 1} -> 200; POST
        /api/instruments {"symbols": ["AAPL"]} -> 201 added; POST
        /api/acquisition-runs -> 202, run 319f7994-23bb-484f-8e48-62f8af8c16a8.
    - step: 3 stub reached, run terminal
      result: >-
        stub reached, run NOT terminal. The script's stderr shows ten
        `[massive-stub] "GET ..." 200` lines for AAPL (/v3/reference/tickers,
        /v2/aggs, the four /stocks/financials/v1 endpoints, /stocks/v1/splits
        and dividends, /vX/reference/ipos and ticker events), so the run
        reached the stub on 127.0.0.1:8126 over loopback http. The run stayed
        `running` with zero counted results for more than five minutes.
    - step: 4 npm run test:e2e
      result: >-
        9 passed (45.1s), with the stack started by the edited script; the
        suite includes tests/e2e/coverage-empty.spec.ts on the acquisition
        stack.
  root_cause: >-
    Pre-existing, outside this story's diff. `ingestion_main.main` opens its
    connection with psycopg's default autocommit=False (CAP-001-E4-S5;
    unchanged here apart from the two parameters). claim_next commits its
    own transaction, but claim_fn then calls
    instruments.service.active_instrument_ids, a bare SELECT outside any
    `connection.transaction()` block, which opens an implicit transaction
    that is never committed. Every later `with connection.transaction()`
    (heartbeat, the instrument write, finalise) becomes a savepoint inside
    it. Evidence: pg_stat_activity showed the runner's backend `idle in
    transaction` with xact_start 2026-10-10 17:08:06.460619+00 (the run's
    started_at is 17:08:06.455760), last query `RELEASE "_pg3_1"`, and
    tup_inserted unchanged across polls; `sample` showed the process in
    time.sleep from run_polling_loop. The release launch shares this code
    path. Before CAP-001-E3-S6 passed `base=` to the SDK, the acquisition
    stack never reached the stub, so no E2E run went far enough to show it.
  disposition: >-
    TC-INT-027's expected result "the run reaches a terminal state" is not
    met. Fixing it changes production transaction handling in
    CAP-001-E4-S5's module, which this story's plan does not authorize
    (only `src/factorflow/ingestion_main.py`'s two parameters); abstained
    for the owner's decision.
