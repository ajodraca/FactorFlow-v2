# diff_sha256 is the SHA-256 of the cycle's own diff over src, tests and
# scripts, taken against an index holding every earlier cycle (new files
# added with `git add -N`), i.e. exactly the bytes the two independent
# reviewers judged. For the first cycle the index was HEAD, so it was read as
# `git diff --cached`. The driver commits once per stage, so every cycle
# records commit_hash: stage.

