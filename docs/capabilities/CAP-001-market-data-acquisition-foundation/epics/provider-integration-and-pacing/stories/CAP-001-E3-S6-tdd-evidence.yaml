    commit_hash: stage
  - name: base-honoured
    tasks: [T007, T013, T016]
    status: green
    diff_sha256: 6043a3f917a3ea611fcc3751096ae0963a89cd6be7b3dc89c39a00a88f5e266b
    red:
      command: uv run pytest -q tests/unit/test_massive_sdk_config.py
      result: >-
        3 failed, 8 passed before T016: TC-COMP-354 (patched) KeyError 'base';
        TC-COMP-354 (real SDK) BASE was https://api.massive.com, not
        https://stub.example:8443; T013 recorded ('https', 'api.massive.com',
        443) instead of ('https', 'stub.example', 8443). Green on arrival:
        TC-COMP-357 (guards today's retries/pagination/trace) and TC-COMP-356.
    deviation: >-
      The plan lists TC-COMP-356 as RED before Phase 3. It cannot be: its
      input is the default host with a trailing slash, so without base= the
      SDK default yields the same https://api.massive.com/v3/... URL. A
      missing base= is an equivalent mutant for this one test and is killed
      by TC-COMP-354 and T013 (recorded under T018). TC-COMP-356 guards the
      trailing-slash normalisation reaching the transport.
    green:
      command: uv run pytest -q tests/unit/test_massive_sdk_config.py
      result: 11 passed after T016 added base=settings.base_url.
      full_suite_command: uv run pytest -m 'not postgres' -q
      full_suite_result: 574 passed, 270 deselected
      static_checks: >-
        ruff check clean; ruff format --check 177 files formatted; mypy src
        no issues in 47 files. The T016 comment sits on its own line above
        base= because inline it exceeded the 100-column limit.
    code_review_verdict: APPROVED
    code_review_evidence: >-
      Independent reviewer confirmed base= is the only production change, no
      redirect, Retry, proxy or TLS argument was added, retries=0 and existing
      tests are untouched, and the new tests are non-vacuous (next_url page
      asserted followed, vx pool attributed by identity). LOW: the TC-COMP-356
      equivalent mutant, as recorded; _env_settings does not clear other
      FACTORFLOW_MASSIVE_* variables, consistent with the file's precedent.
    spec_drift:
      drift_detected: false
      evidence: >-
        Independent reviewer found every plan value verbatim (stub base,
        trailing-slash base, next_url, Bearer header, no apiKey, /vX ipos on
        the vx pool) and judged the comment's move above base= a lint
        accommodation, not drift.
    tests_executed: true
    commit_hash: stage
  - name: transport-guards
    tasks: [T006, T008, T009, T010, T011, T012, T018]
    status: green-on-arrival-mutation-proven
    diff_sha256: 89a25bcaa9a466d8c0d014a9bdb7acdda5347d65626cd9662613e3248c7b2c77
    red:
      status: green-on-arrival
      reason: >-
        T006 and T008-T012 guard behaviour the code already has once cycles
        1 and 3 landed (TLS defaults, retries=0, no proxy, release contents),
        so they have no RED phase. T018's mutations below make each one
        meaningful, as the plan's suggested cycle 4 prescribes.
    green:
      command: >-
        uv run pytest -q tests/unit/test_massive_tls.py
        tests/unit/test_massive_redirects.py
        tests/unit/test_release_excludes_test_paths.py
      result: 11 passed, no production change in this cycle.
      static_checks: ruff check clean; ruff format applied to the three new files.
    code_review_verdict: APPROVED
    code_review_evidence: >-
      Independent reviewer confirmed only _make_request is patched so urllib3's
      real redirect path runs (the retries=3 control reaches 198.51.100.7), vx
      attribution by pool identity is sound, the proxy test covers both pools
      and both URL forms, the Dockerfile parser handles multi-source COPY, and
      the AST rule skips @app.middleware("http"). LOW: the TLS-kwargs check
      reads keyword arguments only; one mocked test omits forbid_sockets;
      the wheel test depends on uv's cache (DEC-0045, PROVISIONAL).
    spec_drift:
      drift_detected: false
      evidence: >-
        Independent reviewer matched every planned value (302 target,
        max_attempts 3, injected sleep and jitter without monotonic,
        ProviderUnavailable with a MaxRetryError cause, route one for vx,
        the retries=3 control, six proxy variables, both TLS construction
