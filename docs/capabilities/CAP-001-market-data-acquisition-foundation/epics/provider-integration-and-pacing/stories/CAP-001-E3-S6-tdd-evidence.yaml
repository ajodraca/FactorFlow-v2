# diff_sha256 is the SHA-256 of `git diff -- src tests` for the cycle, taken
# against an index holding every earlier cycle (new files added with
# `git add -N`), i.e. exactly the bytes the two independent reviewers judged.
# The driver commits once per stage, so every cycle records commit_hash: stage.

baseline:
  base_commit: 878099d4f3f209de591ad1c66e5514918b8ac78d
  branch: usr/alvaro-de-jodra/CAP-001-E3-S6-run-20261010T160604Z
  commands:
    - uv sync --all-extras
    - uv run pytest -m 'not postgres' -q (518 passed, 270 deselected)
  result: Green at the integration-branch head, the S6 story branch base.

cycles:
  - name: base-url-validator
