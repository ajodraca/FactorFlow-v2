    status: green
    diff_sha256: f207de6d72d516b704b158ae18616f9ebda9fadbb0a60145828e6c44ccbe5a1d
    red:
      command: uv run pytest -q tests/unit/test_settings_base_url.py
      result: >-
        45 failed, 5 passed. Every rejected-row, message and aggregate-load
        case failed with DID NOT RAISE ConfigurationError, and the trailing
        slash row loaded unchanged. Green on arrival, as planned: the
        default (TC-COMP-347) and the four accepted rows whose value is
        returned unchanged.
    green:
      command: uv run pytest -q tests/unit/test_settings_base_url.py
      result: 50 passed after T015 added MassiveSettings._validate_base_url.
      full_suite_command: uv run pytest -m 'not postgres' -q
      full_suite_result: 568 passed, 270 deselected
      static_checks: >-
        ruff check: All checks passed; ruff format --check: 177 files already
        formatted (after ruff format fixed line wrapping in the three cycle
        files); mypy src: Success, no issues found in 47 source files.
    code_review_verdict: APPROVED
    code_review_evidence: >-
      Independent reviewer confirmed the validator follows the 2.2c snippet's
      clause order and strings, that PydanticCustomError yields exactly
      'FACTORFLOW_MASSIVE_BASE_URL: <clause>' through _EnvNamedSettings
      (DEC-0044), that the tests pin exact messages and non-leakage of the
      value, 's3cret' and the key, and that the transport fake echoes the
      retries it was passed. Three LOW notes, none blocking: the fake keeps
      pool references, isprintable() matches the snippet verbatim, and exact
      message equality assumes a single failing field.
    spec_drift:
      drift_detected: false
      evidence: >-
        Independent reviewer mapped T001-T004, T014 and T015 to the plan,
        DAC-E3-S6-1 to S6-6 and TC-COMP-347 to 352; clause strings and order
        match 2.2c, no http branch, flag or variable was added (DEC-0033),
        and http://::1:8126 asserts only rejection and the variable name.
    tests_executed: true
    commit_hash: stage
  - name: start-refusal
    tasks: [T005]
    status: green
    diff_sha256: 39bfb6535733bd401f4f35e5a62ba7dcc554da4d90a1be8c742886d850e53a7b
    red:
      command: >-
        uv run pytest -q tests/unit/test_ingestion_main.py, with
        src/factorflow/config/settings.py temporarily restored to the base
        commit (no validator), then the cycle-1 file put back
      result: >-
        1 failed, 4 passed: TC-COMP-353 failed with "start opened a database
        connection", i.e. main() went past Settings() to psycopg.connect when
        no validator existed.
    green:
      command: uv run pytest -q tests/unit/test_ingestion_main.py
      result: 5 passed with the cycle-1 validator; ingestion_main.py unchanged.
      static_checks: ruff check and ruff format clean on the changed file.
    code_review_verdict: APPROVED
    code_review_evidence: >-
      Independent reviewer confirmed the three patch targets are the names
      main() actually uses, that a missing validator reaches the patched
      psycopg.connect, that the key is generated per test, and that the diff
