known_limitations:
  - id: pacing-window-bound-tolerates-2x-budget
    description: >-
      test_no_virtual_minute_window_exceeds_the_configured_budget
      (tests/unit/test_governor_pacing.py) asserts
      `count_in_window <= capacity + refill_rate * 60.0`, which at
      capacity=N tolerates up to 2N sends in a one-minute window --
      double the configured budget. This reflects a genuine, unresolved
      conflict between design acceptance criterion 1 ("no more than the
      configured budget over any one-minute window") and the governor's
      full-start token bucket (required by T006), which cannot satisfy
      that literal bound in its first window. Recorded as
      implementation-review-v1's IR-007 and carried forward, still open,
      as implementation-review-v2's IR-002. This needs an owner decision
      -- either the bucket starts empty/documents a first-window
      exception and the test is strengthened, or design AC 1 is amended
      to the standard token-bucket bound -- not a coding fix, and it does
      not block this story's gate.
    source: CAP-001-E3-S4-implementation-review-v2.md, finding IR-002 (carried from v1 IR-007)
    status: open, owner decision required
