# RED -> GREEN -> MUTATE -> STRENGTHEN -> REFACTOR evidence for the
# provider error taxonomy (errors.py), one cycle spanning T002-T010
# because the taxonomy and its classification functions are one
# indivisible unit under test, plus the T012 manual-mutation session run
# against the finished module before marking implementation tasks
# complete.

cycles:
  - unit: "MassiveError taxonomy + classify_error_body/is_rate_limited_body/is_fatal_for_governor/wrap_validation_error"
    red:
      description: >-
        tests/unit/test_massive_errors.py and
        tests/unit/test_massive_error_classification.py written in full
        (TC-COMP-011, 196-199, 207, 220-225, plus additional classifier
        boundary tests) against the Phase 1 placeholder errors.py, which
        declared no names at all.
      commit: 4783790
      test_command: uv run pytest tests/unit/test_massive_errors.py tests/unit/test_massive_error_classification.py -q
      result: "2 errors during collection (ImportError: cannot import
        name 'CredentialRejected' from
        'factorflow.ingestion.massive.errors')"
    green:
      description: >-
        Implemented MassiveError and its four subclasses
        (InstrumentNotFound, CredentialRejected, ProviderUnavailable,
        ProviderContractViolation); classify_error_body and
        is_rate_limited_body, which parse only the four documented safe
        envelope fields (status, message, error, request_id) and discard
        everything else; is_fatal_for_governor, a boolean label per type
        for the future governor-classifier seam without importing
        Outcome; and wrap_validation_error, which converts an S2
        ValidationError from a successful response into
        ProviderContractViolation carrying only a safe summary.
      commit: 43c3526
      test_command: uv run pytest tests/unit/test_massive_errors.py tests/unit/test_massive_error_classification.py -q
      result: "25 passed"
      full_suite_command: uv run pytest -m 'not postgres' -q
      full_suite_result: "206 passed, 59 deselected"
      static_checks: "ruff check: All checks passed; ruff format --check:
        89 files already formatted; mypy src: Success, no issues found in
        27 source files"

  - unit: "__init__.py re-exports (T010)"
    description: >-
      Re-exported the five MassiveError types and the four classification
      primitives from factorflow.ingestion.massive, alongside the
      existing S2 model exports, without exposing the Massive SDK's
      BadResponse type.
    commit: 18051ee
    test_command: uv run pytest -m 'not postgres' -q
    result: "206 passed, 59 deselected"
    static_checks: "ruff check: All checks passed; ruff format --check:
      89 files already formatted; mypy src: Success, no issues found in
      27 source files"

# T012: manual mutation session, run against the committed errors.py
# (commit 18051ee) after the GREEN cycle above, one mutation at a time,
# each reverted and the suite re-confirmed byte-identical before the next.
manual_mutations_baseline_commit: 18051ee
manual_mutations:
  - id: mutation-1-not-found-status-constant
    target: errors._NOT_FOUND_STATUS
    change: '"NOT_FOUND" -> "FOUND"'
    test_command: uv run pytest tests/unit/test_massive_error_classification.py tests/unit/test_massive_errors.py -q
    result: "25 passed -- NOT CAUGHT on first attempt. The only fixture
      exercising status == NOT_FOUND (error_not_found.json) also carries
      the documented not-found message text, so the message-based fallback
      path silently absorbed the mutation."
    caught: false
    strengthened: >-
      Added a new fixture, error_not_found_status_only.json, with
      status: "NOT_FOUND" paired with an unrelated message ("Resource
      missing."), and a new test,
      test_status_not_found_alone_classifies_even_with_an_unrelated_message,
      asserting the status field alone drives classification independent
      of message text. Re-ran with the mutation still applied.
    retest_command: uv run pytest tests/unit/test_massive_error_classification.py -q -k unrelated_message
    retest_result: "1 failed (AssertionError: assert False -- classified
      as ProviderUnavailable instead of InstrumentNotFound)"
    reverted_and_reconfirmed_green: true

  - id: mutation-2-api-key-markers
    target: errors._API_KEY_ERROR_MARKERS
    change: '("api key", "authorization header") -> ("this marker never matches anything",)'
    test_command: uv run pytest tests/unit/test_massive_error_classification.py tests/unit/test_massive_errors.py -q
    result: "3 failed, 23 passed (test_unknown_api_key_classifies_as_credential_rejected,
      test_malformed_authorization_header_classifies_as_credential_rejected,
      test_error_field_is_accepted_for_credential_rejection: all
      misclassified as ProviderUnavailable)"
    caught: true
    reverted_and_reconfirmed_green: true

  - id: mutation-3-malformed-body-fallback
    target: errors._safe_fields
    change: >-
      the except (JSONDecodeError, UnicodeDecodeError) branch returned
      {"status": "NOT_FOUND", ...} instead of None, so an unparseable
      body would have silently become InstrumentNotFound -- exactly the
      false negative AC-12 exists to prevent.
    test_command: uv run pytest tests/unit/test_massive_error_classification.py tests/unit/test_massive_errors.py -q
    result: "1 failed, 25 passed
      (test_malformed_json_classifies_as_provider_unavailable_never_not_found:
      AssertionError -- classified as InstrumentNotFound instead of
      ProviderUnavailable)"
    caught: true
    reverted_and_reconfirmed_green: true

  - id: mutation-4-validation-error-wrapping
    target: errors.wrap_validation_error
    change: 'return ProviderContractViolation(...) -> return ProviderUnavailable(...)'
    test_command: uv run pytest tests/unit/test_massive_error_classification.py tests/unit/test_massive_errors.py -q
    result: "1 failed, 25 passed
      (test_validation_error_from_a_successful_response_wraps_to_contract_violation:
      AssertionError -- result was ProviderUnavailable, not
      ProviderContractViolation)"
    caught: true
    reverted_and_reconfirmed_green: true

  - id: mutation-5-request-id-key
    target: errors._safe_fields
    change: 'parsed.get("request_id") -> parsed.get("requestId")'
    test_command: uv run pytest tests/unit/test_massive_error_classification.py tests/unit/test_massive_errors.py -q
    result: "3 failed, 23 passed (test_request_id_is_populated_when_present,
      test_every_taxonomy_type_carries_request_id_uniformly,
      test_not_found_failure_retains_safe_request_id_bearing_reason: all
      asserted provider_request_id is None instead of the fixture's ID)"
    caught: true
    reverted_and_reconfirmed_green: true

  - id: mutation-6-rate-limit-short-circuit
    target: errors.is_rate_limited_body
    change: 'return _RATE_LIMIT_MARKER in reason.lower() -> return False and _RATE_LIMIT_MARKER in reason.lower()'
    test_command: uv run pytest tests/unit/test_massive_error_classification.py tests/unit/test_massive_errors.py -q
    result: "1 failed, 25 passed
      (test_rate_limited_body_is_identified_without_constructing_any_massive_error:
      AssertionError -- assert False is True)"
    caught: true
    reverted_and_reconfirmed_green: true

post_mutation_verification:
  description: >-
    After all six mutations were individually applied, observed caught
    (mutation-1 only after the STRENGTHEN step added a fixture and a
    test), and reverted, errors.py was diffed byte-for-byte against the
    baseline commit (18051ee) via `git diff` (empty output) to confirm no
    mutation was left in place, then the full suite and static checks
    were re-run.
  commands:
    - uv run pytest -m 'not postgres' -q
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy src
    - uv build
  result: "207 passed, 59 deselected (206 baseline + 1 strengthened test
    added during mutation-1); ruff check: All checks passed; ruff format
    --check: 89 files already formatted; mypy: Success, no issues found
    in 27 source files; uv build succeeded"
