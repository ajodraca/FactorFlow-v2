    status: resolved-by-attended-owner-decision-and-propagated
    decided_on: 2026-09-20
    description: >-
      The owner decided in this attended session that CAP-001-E4's
      observation writer owns deriving fundamental_observation.fiscal_period.
      CAP-001-E3-S2 must not add fiscal_period to FinancialStatement. The
      derivation and covering writer test were propagated into
      CAP-001-E4-S3-tasks.md before this review. Implementation review v4
      accepted the content but warned that the edit occurred outside E4-S3's
      implementation-planning phase (IR-003) and carries provenance that does
      not match the producing commit (IR-004). Those process/provenance gates
      remain for E4-S3; the ownership decision itself is complete.
  - id: statement-type-ratio-plural-mismatch
    status: resolved-on-main
    description: >-
      The earlier S1 follow-up is resolved by the newer implementation now on
      main: client.py labels list_financials_ratios results "ratios", matching
      FinancialStatement and the fundamental_statement_known DDL constraint.
      test_fetch_financials_labels_ratios_rows_with_the_ddl_statement_type
      covers the integrated seam.

