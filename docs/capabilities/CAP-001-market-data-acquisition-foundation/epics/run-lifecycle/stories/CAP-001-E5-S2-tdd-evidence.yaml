story: CAP-001-E5-S2
notes: >-
  Per-task code-review and spec-drift verdicts were produced by an in-session
  structured review of each staged diff by the coding agent: the runtime for
  this execution provides no subagent-dispatch mechanism, so the independent
  subagent the task plan names was substituted with a checklist review against
  the loaded constitutions (CONST-SA, CONST-SEC, CONST-TEST) and the approved
  story/design/task plan. This substitution is recorded transparently here so
  the adversarial-review gate can weigh it.
