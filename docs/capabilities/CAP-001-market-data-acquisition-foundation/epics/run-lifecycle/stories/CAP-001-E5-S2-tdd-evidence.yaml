story: CAP-001-E5-S2
notes: >-
  Per-task code-review and spec-drift verdicts were produced by an in-session
  structured review of each staged diff by the coding agent: the runtime for
  this execution provides no subagent-dispatch mechanism, so the independent
  subagent the task plan names was substituted with a checklist review against
  the loaded constitutions (CONST-SA, CONST-SEC, CONST-TEST) and the approved
  story/design/task plan. This substitution is recorded transparently here so
  the adversarial-review gate can weigh it.
cycles:
  - name: t002-request-queueing-tests
    task: T002
    red:
      command: uv run pytest -m postgres tests/integration/test_run_queue.py
      result: "FAILED during collection: ModuleNotFoundError: No module named 'factorflow.runs.journal'"
    tests_executed: true
    tests:
      - tests/integration/test_run_queue.py
    staged_diff_review: >-
      PASS (in-session review): descriptive naming, bound parameters for all
      values, type hints on every signature, traceability comments for
      TC-COMP-023 and TC-COMP-265, one queueing behavior per test, no dead
      code, no markers.
    spec_drift_verification: >-
      drift_detected: false; staged diff implements T002 exactly: parametrized
      running/cancelling active row, request_run returns a distinct requested
      UUID and the active UUID as queued_behind, supplied depth persisted,
      every active-row field unchanged, and the no-active case returns
      queued_behind=None.
    commit_hash: 10504d0
  - name: t003-claim-tests
    task: T003
    red:
      command: uv run pytest -m postgres tests/integration/test_run_queue.py
      result: "FAILED during collection: ModuleNotFoundError: No module named 'factorflow.runs.journal'"
    tests_executed: true
    tests:
      - tests/integration/test_run_queue.py
    staged_diff_review: >-
      PASS (in-session review): FIFO test seeds requested_at out of insertion
      order so ORDER BY requested_at is the only passing implementation;
      empty-queue and running/cancelling-active polls assert None; the
      successful-claim test asserts state, started_at, claimed_by and
      heartbeat_at written atomically and maps the stored snapshot depth (7)
      while a different stated depth (2) exists; traceability comments cover
      TC-COMP-237, TC-COMP-260, TC-COMP-261, TC-COMP-262, TC-COMP-263.
    spec_drift_verification: >-
      drift_detected: false; staged diff implements T003 exactly: distinct
      ordered requested_at seeds, claim-then-terminalize predecessor chain,
      ascending FIFO assertion, empty queue and running/cancelling active rows
      yield None, one claim atomically writes the four fields and returns the
      row's UUID and stored depth.
    commit_hash: 05643b3
  - name: t004-contention-tests
    task: T004
    red:
      command: uv run pytest -m postgres tests/integration/test_run_queue.py
      result: "FAILED during collection: ModuleNotFoundError: No module named 'factorflow.runs.journal'"
    tests_executed: true
    tests:
      - tests/integration/test_run_queue.py
    staged_diff_review: >-
      PASS (in-session review): two independent connections via
      postgres_connection_string; the locked-candidate scenario bounds a
      blocking regression with lock_timeout=5000; the forced race holds the
      winner's claim uncommitted (open transaction makes the journal's
      transaction() a savepoint) so the loser provably waits on the pending
      unique-index entry, raises UniqueViolation after the winner commits,
      and leaves exactly one active row plus the loser still requested; the
      post-commit None loser path is asserted; helpers keep functions under
      30 lines; every connection is closed in finally; traceability comments
      for TC-COMP-238 and TC-COMP-264.
    spec_drift_verification: >-
      drift_detected: false; staged diff implements T004 exactly: (a) a held
      row lock on the oldest requested row is skipped by a claim on another
      connection that completes while the lock is held, and (b) two claims
      synchronized over distinct candidates so both pass the no-active guard,
      with the partial unique index producing one UniqueViolation loser and
      one active row maximum, plus the retained valid-loser None path.
    commit_hash: 61b9689
  - name: t005-unit-boundary-tests
    task: T005
    red:
      command: uv run pytest tests/unit/test_run_journal.py
      result: "FAILED during collection: ModuleNotFoundError: No module named 'factorflow.runs.journal'"
    tests_executed: true
    tests:
      - tests/unit/test_run_journal.py
    staged_diff_review: >-
      PASS (in-session review): deterministic recording fakes at the psycopg
      cursor/connection boundary; asserts frozen ClaimedRun mapping, exactly
      one executed statement per claim with bound runner_id, bound
      history_depth_years on the request insert, both queued_behind shapes,
      one transaction per operation, None mapping for an empty claim result,
      SQL contract pins (NOT EXISTS, ORDER BY requested_at, FOR UPDATE SKIP
      LOCKED, RETURNING run_id + history_depth_years), and no
      read_history_depth call via monkeypatch plus a vars() import check.
    spec_drift_verification: >-
      drift_detected: false; staged diff implements T005 exactly: focused
      cursor/connection-boundary tests for frozen ClaimedRun mapping,
      UUID/depth return mapping, bound runner_id and history_depth_years
      parameters, None mapping when the claim returns no row, and proof the
      claim maps the returned row's stored depth without calling
      factorflow.instruments.settings.read_history_depth.
    commit_hash: b53b1c6
  - name: t006-journal-implementation
    task: T006
    green:
      command: >-
        uv run pytest tests/unit/test_run_journal.py &&
        uv run pytest -m postgres tests/integration/test_run_queue.py
      result: "6 unit passed; 10 postgres integration passed in 5.35s"
    tests_executed: true
    implementation:
      - src/factorflow/runs/journal.py
    staged_diff_review: >-
      PASS (in-session review): ClaimedRun is a frozen dataclass; request_run
      performs the insert and the active-run lookup in one transaction() with
      bound parameters and never touches the active row; claim_next executes
      the design's single UPDATE ... WHERE run_id = (SELECT ... NOT EXISTS ...
      ORDER BY requested_at LIMIT 1 FOR UPDATE SKIP LOCKED) RETURNING run_id,
      history_depth_years statement verbatim with bound runner_id, maps no row
      to None, propagates UniqueViolation to the caller, and never reads
      owner_setting; all signatures typed; functions under 30 lines.
    spec_drift_verification: >-
      drift_detected: false; staged diff implements T006 exactly:
      factorflow.runs.journal exports frozen ClaimedRun,
      request_run(connection, history_depth_years) -> tuple[UUID, UUID|None],
      and claim_next(connection, runner_id) -> ClaimedRun|None with typed
      psycopg boundaries, bound parameters, one-transaction request, the
      single-statement claim, None on no row, and no current-settings read.
      heartbeat/cancel/finalise are correctly absent (other stories' scope).
    commit_hash: f073242
  - name: t007-integration-run
    task: T007
    green:
      command: >-
        uv run pytest tests/integration/test_run_queue.py
        tests/unit/test_run_journal.py && uv run pytest
      result: "16 S2 tests passed in 3.65s; full suite 414 passed, 2 warnings"
    tests_executed: true
    note: >-
      No corrections required; the production journal boundary satisfied every
      staged test on first integration. The None claim signal is a plain
      return value consumed unchanged by the runner's configured-wait loop
      (CAP-001-E4-S5 owns the wait policy).
    staged_diff_review: "PASS (in-session review): no file diff produced"
    spec_drift_verification: "drift_detected: false; no file diff produced"
    commit_hash: "none — run-only task produced no file diff"
  - name: t008-mutation-strengthening
    task: T008
    mutations:
      - >-
        FIFO order: ORDER BY requested_at -> DESC in the claim subquery;
        test_claims_follow_request_order failed; restored.
      - >-
        Claim active-state predicate: dropped 'cancelling' from the NOT EXISTS
        guard; test_claim_returns_none_while_run_active[cancelling] failed
        (UniqueViolation); restored.
      - >-
        SKIP LOCKED removed (plain FOR UPDATE):
        test_claim_skips_locked_candidate failed with LockNotAvailable under
        the test's lock_timeout=5000 rather than hanging; restored.
      - >-
        Active-row preservation: request_run additionally ran UPDATE
        heartbeat_at = now() on the active row;
        test_request_queues_behind_active_run[running] and [cancelling]
        failed; restored.
      - >-
        Returned-depth mapping: claim returned history_depth_years=1 instead
        of row[1]; test_successful_claim_sets_fields_and_returns_snapshot,
        test_claim_skips_locked_candidate and
        test_concurrent_claims_fail_on_unique_index failed; restored.
      - >-
        No-row mapping: an empty claim mapped to a zero-UUID ClaimedRun
        instead of None; test_claim_next_returns_none_when_no_row and the
        integration None paths (empty queue, running/cancelling active, both
        contention tests) failed; restored.
      - >-
        Request queued_behind predicate: dropped 'cancelling' from
        _ACTIVE_RUN_SQL; test_request_queues_behind_active_run[cancelling]
        failed; restored.
    strengthening: >-
      none required — every injected mutant was killed by an existing test,
      so no test needed strengthening.
    refactor: "none — the implementation is already the design's minimum"
    staged_diff_review: >-
      PASS (in-session review): no production or test diff in this task —
      mutation evidence was produced by temporary edits, each observed failing
      and each restored (git diff src/ empty afterwards); this entry records
      executions, mutations, and verdicts only.
    spec_drift_verification: >-
      drift_detected: false; mutation set covers exactly the plan's list —
      FIFO order, active-state predicate (claim guard and request lookup),
      SKIP LOCKED, active-row preservation, returned-depth and no-row mapping
      — and all mutants are killed by retained tests.
    commit_hash: pending
cross_story_verification:
  none_signal: >-
    The no-row claim result is a plain None return pinned by
    tests/unit/test_run_journal.py::test_claim_next_returns_none_when_no_row
    and the integration None paths. CAP-001-E4-S5's configured-wait loop
    (tests/integration/test_runner_credential.py,
    tests/unit/test_ingestion_main.py, poll over
    settings.run.poll_interval_seconds = 5.0s default) does not exist yet —
    that story is unimplemented. S2 supplies the stable None signal it will
    consume; S2 does not duplicate the wait policy.
