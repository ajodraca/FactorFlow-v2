    owner_decision_date: "2026-09-19"
    decision: >-
      The owner explicitly authorized an exception for unreconstructable historical
      TDD-cycle commit hashes so this completed S1 work may proceed to final review.
    affected_cycles:
      - design-sql-fence-helper
      - schema-constraint-strengthening
    missing_evidence: >-
      Non-empty per-cycle commit hashes required by T013; the inherited staged
      production artifacts were present before this resume, and no prior coherent-cycle
      commits were recorded. The pre-production RED evidence for the inherited
      production artifacts is also unavailable.
    rationale: >-
      Git history and the current worktree cannot reconstruct hashes for commits that
      were never made. No hash, RED result, or other TDD evidence has been fabricated.
    scope: >-
      This exception applies only to the listed historical cycles. The final validation
      and mutation evidence below remains the recorded evidence for the completed state.
