## Notes

- PostgreSQL 16 container was available via testcontainers for all postgres-marked tests.
- The `acquisition_run_single_active` unique partial index required test helpers to mark
  the first run as `succeeded` before inserting a second run in multi-run test scenarios.
  This is correct database behavior and test helpers accommodate it explicitly.
- `_derive_fiscal_period` derivation of `fiscal_period` from `FinancialStatement.timeframe`
  and `fiscal_quarter` is mandatory (owner decision 2026-09-20) and verified by
  `test_annual_financial_statement_stores_fiscal_period_fy` and
  `test_quarterly_financial_statement_stores_fiscal_period_q_n`.
