## Mutation Probes

### Probe 1: Adjacency Handling

**Mutation**: Changed `current_to + _one_day` to `current_to` in `merge_ranges`
(removes one-calendar-day adjacency coalescing).

**Test killed**: `test_merge_preceding_one_day_adjacency` and
`test_merge_following_one_day_adjacency` in `test_coverage_merge.py` —
both failed asserting two segments merged into one.

**Restored**: Change reverted; GREEN confirmed.

### Probe 2: Observation Conflict Action

**Mutation**: Changed `ON CONFLICT DO NOTHING` to `ON CONFLICT DO UPDATE SET recorded_at = now()`
in `_insert_references` in `writer.py`.

**Test killed**: `test_writer_source_uses_on_conflict_do_nothing_for_all_observation_tables`
in `test_sql_is_append_only.py` — detected the DO UPDATE mutation.
Also `test_observation_history_sql_is_append_only` — detected the mutation.

**Restored**: Change reverted; GREEN confirmed.

### Probe 3: Coverage Write Outside Transaction

**Mutation**: Moved `_replace_coverage` calls to after `connection.cursor()` context closes,
simulating coverage being replaced after the main cursor is closed.

**Test killed**: This mutation is not applicable because `write_instrument` does not own
the outer transaction — it operates on the connection within the caller's transaction scope.
The rollback test `test_failure_during_acquisition_state_rolls_back_everything` proved that
coverage is inside the transaction: the test-local trigger on `acquisition_state` caused
the full rollback including coverage rows, confirming `_replace_coverage` executes inside
the same transaction context.

**Restored**: N/A — probe confirmed coverage is transactional.

### Probe 4: Rollback Propagation

**Mutation**: Added `except Exception: pass` around the `cur.execute(...)` block for
`acquisition_state` upsert in `write_instrument`, swallowing the injected trigger error.

**Test killed**: `test_failure_during_acquisition_state_rolls_back_everything` — the
`pytest.raises(Exception, match="injected failure")` assertion failed because the exception
was swallowed, meaning the test detected the mutation.

**Restored**: Change reverted; GREEN confirmed.

