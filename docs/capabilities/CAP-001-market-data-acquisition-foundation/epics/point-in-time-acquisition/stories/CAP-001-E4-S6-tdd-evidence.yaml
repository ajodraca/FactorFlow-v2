  (382 tests) covers all pure-classification and mock-boundary behaviors.
- Per the validation plan: "report an unavailable PostgreSQL container as an
  excluded validation rather than presenting `uv run pytest -m 'not postgres'`
  as the full suite."

### Frontend
- No frontend code was modified. Frontend validation not run.

