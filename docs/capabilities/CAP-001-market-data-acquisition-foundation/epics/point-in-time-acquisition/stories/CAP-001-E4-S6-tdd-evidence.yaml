## Notes

- `write_error_results` is preserved in `outcomes.py` for backward compatibility;
  it handles bulk error cases where all data types fail during the all-at-once
  reference fetch phase. It is no longer called by the runner directly — the
  runner now uses per-data-type try/except and `classify_provider_error` +
  `write_instrument_with_outcomes`.
- `write_instrument` is preserved in `writer.py` and remains the non-outcome-aware
  path. `write_instrument_with_outcomes` extends it to accept optional `error_outcomes`
  for per-data-type error cases (TC-COMP-188: prices=written, fundamentals=not_found).
- The runner's per-data-type fetch loop raises `CredentialRejected` immediately
  (bypassing the per-type handler) to preserve the run-level failure path.
- `hypothesis` module is not installed in this environment; `test_fetch_plan.py`
  was excluded from all validation runs. This is a pre-existing environment gap
  unrelated to this story.
