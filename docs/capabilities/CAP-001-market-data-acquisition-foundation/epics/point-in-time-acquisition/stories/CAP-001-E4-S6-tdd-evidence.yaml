## Mutation Probes

### Probe 1: written vs unchanged mapping

**Mutation**: Changed `"written" if result.reference_appended > 0 else "unchanged"` to
always return `"unchanged"` for reference in `classify_write_result`.

**Test killed**: `test_written_outcome_when_rows_appended` — asserted `outcomes["reference"] == "written"` but got `"unchanged"`.

**Restored**: Change reverted; GREEN confirmed.

### Probe 2: not_found vs failed mapping

**Mutation**: Changed `classify_provider_error` to return `"failed"` for both
`InstrumentNotFound` and `ProviderUnavailable`.

**Test killed**: `test_not_found_maps_to_not_found_outcome` — asserted `record.outcome == "not_found"` but got `"failed"`.

**Restored**: Change reverted; GREEN confirmed.

### Probe 3: CredentialRejected rejection guard

**Mutation**: Removed the `if isinstance(error, CredentialRejected): raise ValueError(...)` guard
from `classify_provider_error`.

**Test killed**: `test_credential_rejected_is_rejected_as_per_data_type_outcome` — the `pytest.raises(ValueError)` assertion failed because no exception was raised.

**Restored**: Change reverted; GREEN confirmed.

### Probe 4: reason field populated

**Mutation**: Changed `InstrumentOutcomeRecord(data_type=..., outcome=..., reason=reason)` to
`InstrumentOutcomeRecord(data_type=..., outcome=..., reason=None)` in `classify_provider_error`.

**Test killed**: `test_not_found_maps_to_not_found_outcome` — asserted `record.reason == reason` but got `None`.

**Restored**: Change reverted; GREEN confirmed.

### Probe 5: empty WriteResult classification

**Mutation**: Changed `"written" if result.prices_appended > 0 else "unchanged"` to
`"written" if result.prices_appended >= 0 else "unchanged"` (always written).

**Test killed**: `test_empty_write_result_classifies_all_unchanged` — asserted `outcomes["prices"] == "unchanged"` but got `"written"`.

**Restored**: Change reverted; GREEN confirmed.

### Probe 6: safe reason credential exclusion

**Mutation**: Removed the `redact` call in `compose_failure_reason` (passed raw message).

**Test killed**: `test_safe_reason_retains_request_id_excludes_credential` — asserted `credential not in reason` but credential was present.

**Restored**: Change reverted; GREEN confirmed.

