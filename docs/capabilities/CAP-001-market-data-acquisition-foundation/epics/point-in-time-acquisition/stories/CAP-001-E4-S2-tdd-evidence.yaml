# Durable RED -> GREEN -> MUTATE evidence for T001-T004. The RED and initial
# GREEN observations occurred during the prior story-coding stage; this resumed
# stage re-verified GREEN and performed every mutation below against commit
# e7e0d10, reverting each mutation before continuing.

cycle:
  unit: factorflow.ingestion.hashing
  red:
    timing: prior story-coding stage, before T003
    test_command: uv run pytest -m 'not postgres' tests/unit/test_hashing.py
    result: >-
      Collection failed because factorflow.ingestion.hashing did not yet exist
      (ModuleNotFoundError). This is the T001/T002 checkpoint observed before
      the implementation was added; it was not re-labelled as a current run.
    commit: uncommitted (prior story-coding stage)
  green:
    timing: resumed story-coding stage on 2026-09-17 (current session)
    test_command: uv run pytest -m 'not postgres' tests/unit/test_hashing.py
    result: 9 passed
    independent_process_command: >-
      uv run python -c 'from decimal import Decimal; from
      factorflow.ingestion.hashing import value_hash;
      print(value_hash({"b": Decimal("1.10"), "a": 1}).hex())' &&
      uv run python -c 'from decimal import Decimal; from
      factorflow.ingestion.hashing import value_hash;
      print(value_hash({"a": 1, "b": Decimal("1.10")}).hex())'
    independent_process_result: >-
      Both processes returned
      2714464a21c390ddb3e17648a6136144b72389c99d090392fe822e1ed8601d7f.
    implementation_commit: e7e0d10c8a590c6a31798862fa0e53ee406f17e2

manual_mutations_baseline: e7e0d10c8a590c6a31798862fa0e53ee406f17e2
manual_mutations:
  - id: mutation-1-sorted-keys
    target: factorflow.ingestion.hashing.canonical_json
    change: sort_keys=True -> sort_keys=False
    test_command: uv run pytest -m 'not postgres' tests/unit/test_hashing.py -q
    result: >-
      2 failed, 7 passed:
      test_canonical_json_sorts_nested_keys_and_uses_compact_separators and
      test_dictionary_insertion_order_does_not_change_value_hash.
    caught: true
    reverted_and_reconfirmed_green: true

  - id: mutation-2-decimal-string-conversion
    target: factorflow.ingestion.hashing._canonicalize
    change: return str(value) for Decimal -> return float(value)
    test_command: uv run pytest -m 'not postgres' tests/unit/test_hashing.py -q
    result: >-
      1 failed, 8 passed:
      test_nested_decimals_render_as_exact_strings_and_preserve_scale observed
      numeric 1.1 instead of the exact JSON string "1.10".
    caught: true
    reverted_and_reconfirmed_green: true

  - id: mutation-3-float-rejection
    target: factorflow.ingestion.hashing._canonicalize
    change: raise TypeError for float -> return str(value)
    test_command: uv run pytest -m 'not postgres' tests/unit/test_hashing.py -q
    result: >-
      1 failed, 8 passed:
      test_float_value_raises_instead_of_entering_the_digest reported
      DID NOT RAISE TypeError.
    caught: true
    reverted_and_reconfirmed_green: true

  - id: mutation-4-sha256-output
    target: factorflow.ingestion.hashing.value_hash
    change: hashlib.sha256(...).digest() -> hashlib.sha1(...).digest()
    test_command: uv run pytest -m 'not postgres' tests/unit/test_hashing.py -q
    result: >-
      1 failed, 8 passed:
      test_identical_input_returns_the_same_raw_sha256_digest observed a digest
      different from hashlib.sha256(canonical_json(value)).digest().
    caught: true
    reverted_and_reconfirmed_green: true

