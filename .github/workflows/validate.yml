name: validate

# The first automated validation this repository has had. Until now its suite
# ran only where someone had Docker Desktop open: 31 `postgres`-marked test
# functions and the whole end-to-end suite need a real PostgreSQL container, so
# nothing outside one laptop could establish that the project is green.
#
# Every command below is quoted from the approved tech stack's Validation
# Commands table (`docs/constitution/tech-stack.md`). Nothing here invents a
# check, and nothing here is skipped for convenience — `ubuntu-latest` provides
# a working Docker daemon, which is the whole reason this can exist.
#
# Steps are deliberately narrow and ordered cheapest-first, so a red run names
# what broke rather than that something did.

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `requires-python = ">=3.12"`; pinned rather than floating so a new
      # release cannot turn a green suite red without a commit saying so.
      - name: Install dependencies
        run: uv sync --all-extras
        env:
          UV_PYTHON: "3.12"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      # The container-free half first: it is seconds, and it separates a real
      # defect from a testcontainers problem, which are diagnosed differently.
      - name: Tests without a container
        run: uv run pytest -m 'not postgres'

      # The half that has never run anywhere but one Mac. testcontainers pulls
      # postgres:16 and talks to the runner's Docker daemon.
      - name: Full suite, including the postgres-marked tests
        run: uv run pytest

      - name: Build
        run: uv build

  frontend:
    name: Frontend — lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Unit and component tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # The e2e suite is the most expensive and the most likely to be flaky, and
    # it proves nothing if the units are already broken.
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --all-extras
          npm ci
        env:
          UV_PYTHON: "3.12"

      # `scripts/run-e2e-server.sh` starts a real PostgreSQL container, applies
      # migrations, builds the bundle and runs the API; Playwright waits on
      # `GET /api/health` before the first spec. Only chromium is configured.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        run: npm run test:e2e

      # Playwright's teardown can escalate to SIGKILL, which the server
      # script's trap cannot catch, so the report is worth keeping when the
      # suite fails and the container may have outlived it.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
